[build]
  publish = "."
  command = "python3 scripts/build_site.py"

[[redirects]]
  from = "/_internal/*"
  to = "/"
  status = 404
  force = true

# The Materials tool ships content-hashed assets and data, so those two
# directories are safe to cache permanently. Its upstream build carries these
# rules in tools/materials/_headers, which Netlify only reads from the publish
# root, so they are restated here against the tool's real path.
[[headers]]
  for = "/tools/materials/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/tools/materials/data/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/tools/materials/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Redirect www to apex domain
[[redirects]]
  from = "https://www.transparent.tools/*"
  to = "https://transparent.tools/:splat"
  status = 301
  force = true

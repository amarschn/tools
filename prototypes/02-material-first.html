<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Materials — material-first prototype</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #181818;
      --muted: #666;
      --faint: #888;
      --line: #d3d3d3;
      --soft: #f5f5f5;
      --blue: #075ea8;
      --blue-soft: #edf5fb;
      --max: 960px;
    }

    * { box-sizing: border-box; }

    html {
      min-width: 300px;
      color: var(--ink);
      background: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      font-size: 14px;
    }

    body { margin: 0; }
    button, input { font: inherit; }

    :focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 1px;
    }

    .skip-link {
      position: fixed;
      top: 4px;
      left: 4px;
      z-index: 20;
      padding: 7px 9px;
      border: 1px solid var(--blue);
      background: #fff;
      transform: translateY(-150%);
    }

    .skip-link:focus { transform: none; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .topbar {
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 6px max(12px, calc((100vw - var(--max)) / 2));
      border-bottom: 1px solid #aaa;
    }

    .brand {
      color: #111;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    .top-meta {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .top-meta b { color: #333; font-weight: 600; }

    .warning {
      padding: 5px max(12px, calc((100vw - var(--max)) / 2));
      border-bottom: 1px solid var(--line);
      color: #4d4d4d;
      background: var(--soft);
      font-size: 12px;
    }

    main {
      width: min(100%, var(--max));
      margin: 0 auto;
      padding: 12px 12px 42px;
    }

    .lookup-label, .property-label {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 5px;
      font-size: 12px;
      font-weight: 650;
    }

    .lookup-label span, .property-label span {
      color: var(--faint);
      font-weight: 400;
    }

    .search {
      height: 40px;
      display: grid;
      grid-template-columns: 1fr auto;
      border: 1px solid #777;
    }

    .search:focus-within {
      border-color: var(--blue);
      box-shadow: 0 0 0 1px var(--blue);
    }

    .search input {
      min-width: 0;
      height: 38px;
      padding: 0 10px;
      border: 0;
      outline: 0;
      color: #111;
      background: #fff;
      font-size: 15px;
    }

    .search input::-webkit-search-cancel-button {
      appearance: none;
      -webkit-appearance: none;
    }

    .search button {
      min-width: 38px;
      border: 0;
      border-left: 1px solid var(--line);
      background: var(--soft);
      cursor: pointer;
    }

    .search button[hidden] { display: none; }

    .query-meta {
      min-height: 33px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }

    .query-meta strong { color: #333; font-weight: 600; }
    .timing { color: var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; }

    .notice {
      padding: 9px 0;
      border-bottom: 1px solid var(--line);
      line-height: 1.45;
    }

    .notice strong { font-weight: 650; }
    .notice p { margin: 2px 0 0; color: var(--muted); }

    .choices {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 7px;
    }

    .choice, .back, .close {
      min-height: 29px;
      padding: 4px 8px;
      border: 1px solid #aaa;
      border-radius: 2px;
      color: #222;
      background: #fff;
      cursor: pointer;
    }

    .choice:hover, .back:hover, .close:hover {
      color: var(--blue);
      border-color: var(--blue);
    }

    .choice[aria-pressed="true"] {
      color: #064e89;
      border-color: var(--blue);
      background: var(--blue-soft);
    }

    .results-title {
      margin: 11px 0 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    .results {
      border-top: 1px solid #aaa;
      border-bottom: 1px solid #aaa;
    }

    .result {
      width: 100%;
      min-height: 47px;
      display: grid;
      grid-template-columns: minmax(190px, 1.5fr) minmax(120px, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 5px 7px;
      border: 0;
      border-bottom: 1px solid #e2e2e2;
      background: #fff;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
    }

    .result:last-child { border-bottom: 0; }
    .result:hover, .result:focus { background: var(--soft); }

    .result strong, .result small { display: block; }
    .result strong { color: #111; font-size: 14px; font-weight: 650; }
    .result small, .result-context { color: var(--muted); font-size: 12px; }
    .result-action { color: var(--blue); font-size: 12px; white-space: nowrap; }

    .empty {
      padding: 18px 0;
      border-bottom: 1px solid #aaa;
      color: var(--muted);
    }

    .record-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      padding: 12px 0 10px;
      border-bottom: 1px solid #aaa;
    }

    .record-head h1 {
      margin: 3px 0 2px;
      color: #111;
      font-size: 22px;
      line-height: 1.2;
    }

    .record-head p { margin: 0; color: var(--muted); }

    .record-actions {
      display: flex;
      align-items: flex-start;
      gap: 5px;
    }

    .record-path {
      color: var(--muted);
      font-size: 12px;
    }

    .record-note {
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      line-height: 1.45;
    }

    .state-list {
      margin-top: 10px;
      border-top: 1px solid #aaa;
      border-bottom: 1px solid #aaa;
    }

    .state {
      width: 100%;
      min-height: 43px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 6px 7px;
      border: 0;
      border-bottom: 1px solid #e2e2e2;
      color: #111;
      background: #fff;
      text-align: left;
      cursor: pointer;
    }

    .state:last-child { border-bottom: 0; }
    .state:hover { background: var(--soft); }
    .state span { color: var(--muted); font-size: 12px; }

    .property-tools {
      padding: 11px 0 9px;
      border-bottom: 1px solid var(--line);
    }

    .property-search {
      width: 100%;
      height: 34px;
      padding: 0 9px;
      border: 1px solid #999;
      outline: 0;
    }

    .property-search:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 1px var(--blue);
    }

    .property-choice-note {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .property-section { border-bottom: 1px solid #aaa; }

    .property-heading {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 0 5px;
    }

    .property-heading h2 {
      margin: 0;
      font-size: 14px;
      font-weight: 650;
    }

    .property-heading span {
      color: var(--muted);
      font-size: 12px;
    }

    .observation {
      display: grid;
      grid-template-columns: 125px minmax(180px, 1fr) minmax(190px, 1.1fr);
      gap: 12px;
      padding: 7px 0;
      border-top: 1px solid #e2e2e2;
      font-size: 12px;
    }

    .observation .value {
      color: #111;
      font-variant-numeric: tabular-nums;
      font-weight: 650;
    }

    .observation span {
      min-width: 0;
      overflow-wrap: anywhere;
      color: var(--muted);
    }

    footer {
      width: min(100%, var(--max));
      margin: 0 auto;
      padding: 9px 12px 18px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--faint);
      font-size: 11px;
    }

    [hidden] { display: none !important; }

    @media (max-width: 620px) {
      .top-meta .wide { display: none; }
      .result { grid-template-columns: minmax(155px, 1fr) auto; }
      .result-context { display: none; }
      .record-head { grid-template-columns: 1fr; }
      .record-actions { grid-row: 1; justify-content: space-between; }
      .observation { grid-template-columns: 105px 1fr; gap: 3px 10px; }
      .observation > :last-child { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#material-query">Skip to material search</a>

  <header class="topbar">
    <a class="brand" href="./02-material-first.html">Materials</a>
    <div class="top-meta">
      <b id="record-count">— records</b> · <span id="version">v—</span>
      <span class="wide"> · material-first</span>
    </div>
  </header>
  <div class="warning" id="warning">Synthetic test data only.</div>

  <main>
    <section id="lookup-view">
      <label class="lookup-label" for="material-query">
        Find a material
        <span>Names and designations first</span>
      </label>
      <form class="search" id="material-search" role="search">
        <input id="material-query" type="search" autocomplete="off" spellcheck="false"
          placeholder="Try AX60-T6, NylonDemo N6, or plastics" aria-controls="material-results" autofocus>
        <button id="clear" type="button" aria-label="Clear search" hidden>×</button>
      </form>
      <div class="query-meta">
        <span id="query-summary"><strong>Opening fixture…</strong></span>
        <span class="timing" id="timing">search — ms</span>
      </div>
      <div id="notice" hidden></div>
      <p class="results-title" id="results-title">Materials</p>
      <div class="results" id="material-results" role="listbox" aria-label="Material results"></div>
    </section>

    <article id="record-view" hidden></article>
    <p id="live" class="sr-only" role="status" aria-live="polite"></p>
  </main>

  <footer>
    <span>One material, then one property. No rankings or comparisons.</span>
    <span id="build">build —</span>
  </footer>

  <script src="./assets/synthetic-corpus.js"></script>
  <script src="./assets/search-core.js"></script>
  <script>
    (function () {
      "use strict";

      var api = window.MaterialsPrototypeSearch;
      var corpus = api.corpus;
      var lookupView = document.getElementById("lookup-view");
      var recordView = document.getElementById("record-view");
      var input = document.getElementById("material-query");
      var clear = document.getElementById("clear");
      var results = document.getElementById("material-results");
      var summary = document.getElementById("query-summary");
      var timing = document.getElementById("timing");
      var notice = document.getElementById("notice");
      var resultsTitle = document.getElementById("results-title");
      var live = document.getElementById("live");
      var analysis = null;
      var pendingProperty = null;
      var selectedEntity = null;
      var propertyFilterId = null;
      var propertyFilterText = "";

      document.getElementById("record-count").textContent =
        api.stats.lookup_record_count + " records";
      document.getElementById("version").textContent =
        "v" + corpus.corpus_version.replace(/^synthetic-/, "");
      document.getElementById("build").textContent = corpus.build_version;
      document.getElementById("warning").textContent =
        "Synthetic test data only — " + corpus.warning;

      function escapeHtml(value) {
        return String(value == null ? "" : value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function displayId(entity) {
        var material = api.getMaterial(entity.material_id);
        var values = entity.kind === "state"
          ? (entity.designations || [])
          : (material && material.designations || []);
        return values.length ? values.slice(0, 2).join(" · ") : entity.id.replace(/^synthetic-/, "");
      }

      function setNotice(html) {
        notice.hidden = !html;
        notice.className = html ? "notice" : "";
        notice.innerHTML = html || "";
      }

      function choiceButtons(intent, attribute) {
        if (!intent) return "";
        return '<div class="choices">' + intent.ids.map(function (id) {
          var property = api.getProperty(id);
          if (!property) return "";
          return '<button class="choice" type="button" ' + attribute + '="' +
            escapeHtml(id) + '">' + escapeHtml(property.name) + "</button>";
        }).join("") + "</div>";
      }

      function shownResults(value) {
        if (value.state === "unsupported-comparison" || value.state === "no-match" ||
            value.state === "choose-scope") return [];
        if (value.state === "needs-material") return api.search("").results;
        return value.results || [];
      }

      function renderLookup() {
        var shown = shownResults(analysis);
        var heading;
        var secondary = "";
        setNotice("");

        if (analysis.state === "idle") {
          heading = "Choose a material";
          secondary = " · " + api.stats.material_count + " identities";
          resultsTitle.textContent = "Material identities";
        } else if (analysis.state === "unsupported-comparison") {
          heading = "Comparison is outside this tool";
          secondary = " · select one material";
          resultsTitle.textContent = "No comparison results";
          setNotice(
            "<strong>This lookup does not answer “best,” “strongest,” “versus,” or comparison queries.</strong>" +
            "<p>Search one exact material or browse a category. Its values appear only after selection.</p>" +
            '<div class="choices"><button class="choice" type="button" data-query="Synal AX60">Synal AX60</button>' +
            '<button class="choice" type="button" data-query="plastics">Browse plastics</button></div>'
          );
        } else if (analysis.state === "choose-scope") {
          heading = "Choose a category";
          secondary = " · the term is ambiguous";
          resultsTitle.textContent = "Category choices";
          setNotice(
            "<strong>That word refers to more than one category.</strong>" +
            '<div class="choices">' + analysis.scope_options.map(function (scope) {
              return '<button class="choice" type="button" data-query="' +
                escapeHtml(scope.name) + '">' + escapeHtml(scope.name) + "</button>";
            }).join("") + "</div>"
          );
        } else if (analysis.state === "needs-material") {
          heading = "Material required";
          secondary = " · property saved for the next step";
          resultsTitle.textContent = "Choose a material first";
          setNotice(
            "<strong>" + escapeHtml(analysis.property_intent.label) + " is a property.</strong>" +
            "<p>Choose one material below or add its name to the search. The property will be filtered inside that record.</p>"
          );
        } else if (analysis.state === "choose-property") {
          heading = "Choose a material first";
          secondary = analysis.scope ? " · browsing " + analysis.scope.name : "";
          resultsTitle.textContent = analysis.scope
            ? "Materials in " + analysis.scope.name
            : "Material identities";
          setNotice(
            "<strong>“" + escapeHtml(analysis.property_intent.label) +
            "” can mean several different tests.</strong>" +
            "<p>First choose a material. The property choices will then appear inside its record; no cross-material values are shown here.</p>"
          );
        } else if (analysis.state === "browse-scope") {
          heading = analysis.scope.name;
          secondary = " · category, not a material";
          resultsTitle.textContent = "Choose a material in this category";
          setNotice(
            "<strong>" + escapeHtml(analysis.scope.name) + " is a category.</strong>" +
            "<p>It carries no representative property values. Select one of its material identities.</p>"
          );
        } else if (analysis.state === "no-match") {
          heading = "No material matched";
          secondary = " · “" + analysis.query.trim() + "”";
          resultsTitle.textContent = "No results";
          setNotice(
            "<strong>The material part of this query is not in the fixture.</strong>" +
            "<p>Try a shorter designation or browse a category. Property words do not identify a material.</p>" +
            '<div class="choices"><button class="choice" type="button" data-query="NylonDemo N6">NylonDemo N6</button>' +
            '<button class="choice" type="button" data-query="engineering plastics">Engineering plastics</button></div>'
          );
        } else {
          heading = analysis.total + (analysis.total === 1 ? " material match" : " material matches");
          if (analysis.scope) secondary += " · " + analysis.scope.name;
          if (analysis.property_intent) secondary += " · property saved: " + analysis.property_intent.label;
          resultsTitle.textContent = "Choose one material";
        }

        summary.innerHTML = "<strong>" + escapeHtml(heading) + "</strong>" +
          escapeHtml(secondary);
        timing.textContent = "search " + analysis.duration_ms.toFixed(2) + " ms";
        clear.hidden = !input.value;

        if (!shown.length) {
          results.innerHTML = '<div class="empty">No selectable material identities.</div>';
        } else {
          results.innerHTML = shown.map(function (entity, index) {
            var context = entity.kind === "state"
              ? entity.parent_name + " · named state"
              : (entity.taxon_names[0] || "material");
            var next = entity.kind === "material" && !entity.has_direct_data && entity.state_count
              ? "Choose state"
              : "Open record";
            return '<button class="result" type="button" role="option" id="material-result-' +
              index + '" data-entity="' + escapeHtml(entity.id) + '">' +
              '<span><strong>' + escapeHtml(entity.name) + '</strong><small>' +
                escapeHtml(displayId(entity)) + "</small></span>" +
              '<span class="result-context">' + escapeHtml(context) + "</span>" +
              '<span class="result-action">' + next + " →</span></button>";
          }).join("");
        }
        live.textContent = heading + ". " + shown.length + " material choices shown.";
      }

      function runLookup() {
        analysis = api.search(input.value);
        pendingProperty = analysis.property_intent;
        selectedEntity = null;
        propertyFilterId = pendingProperty && pendingProperty.kind === "property"
          ? pendingProperty.id
          : null;
        propertyFilterText = "";
        recordView.hidden = true;
        lookupView.hidden = false;
        renderLookup();
      }

      function groupObservations(observations) {
        var groups = Object.create(null);
        observations.forEach(function (item) {
          if (!groups[item.property_id]) groups[item.property_id] = [];
          groups[item.property_id].push(item);
        });
        return groups;
      }

      function matchingPropertyIds(observations) {
        var ids = Array.from(new Set(observations.map(function (item) {
          return item.property_id;
        })));
        if (propertyFilterId) return ids.indexOf(propertyFilterId) === -1 ? [] : [propertyFilterId];
        var normalized = api.normalize(propertyFilterText);
        if (!normalized) return ids;
        return ids.filter(function (id) {
          var property = api.getProperty(id);
          var text = [property.name].concat(property.aliases || []).join(" ");
          return api.normalize(text).indexOf(normalized) !== -1;
        });
      }

      function renderRecord() {
        if (!selectedEntity) return;
        var observations = api.getObservations(selectedEntity);
        var children = api.getStateChildren(selectedEntity);
        var material = api.getMaterial(selectedEntity.material_id);
        var path = (material && material.taxon_ids || []).map(api.taxonName).join(" · ");
        var unresolvedGroup = pendingProperty && pendingProperty.kind === "group" &&
          !propertyFilterId;
        var header =
          '<header class="record-head"><div><div class="record-path">' +
            escapeHtml(path || "Unclassified") + '</div><h1>' +
            escapeHtml(selectedEntity.name) + '</h1><p>' +
            escapeHtml(displayId(selectedEntity)) + " · " +
            escapeHtml(selectedEntity.kind === "state" ? "named material state" : "material identity") +
          '</p></div><div class="record-actions"><button class="back" type="button" data-back>← Results</button>' +
          '<button class="close" type="button" data-new>New lookup</button></div></header>';

        if (!observations.length && children.length) {
          recordView.innerHTML = header +
            '<div class="record-note">This identity has no direct values. Its named states are separate lookup records because their properties differ. Choose one state:</div>' +
            '<div class="state-list">' + children.map(function (child) {
              return '<button class="state" type="button" data-state="' +
                escapeHtml(child.id) + '"><strong>' + escapeHtml(child.label) +
                '</strong><span>' + child.observation_count + " observations →</span></button>";
            }).join("") + "</div>";
          return;
        }

        var propertyPrompt = "";
        if (unresolvedGroup) {
          propertyPrompt =
            '<div class="notice"><strong>Which “' +
            escapeHtml(pendingProperty.label.toLowerCase()) +
            '” property do you need for this material?</strong><p>No value is shown until the test is specific.</p>' +
            choiceButtons(pendingProperty, "data-record-property") + "</div>";
        }

        var filterValue = propertyFilterText;
        var tools =
          '<div class="property-tools"><label class="property-label" for="property-filter">Filter this record’s properties' +
            '<span>Only ' + escapeHtml(selectedEntity.name) + '</span></label>' +
            '<input class="property-search" id="property-filter" type="search" autocomplete="off" value="' +
              escapeHtml(filterValue) + '" placeholder="Try density, yield strength, or temperature">' +
            (propertyFilterId ? '<p class="property-choice-note">Showing ' +
              escapeHtml(api.getProperty(propertyFilterId).name) +
              ' only. <button class="choice" type="button" data-clear-property>Show all properties</button></p>' : "") +
          "</div>";

        var groups = groupObservations(observations);
        var visibleIds = unresolvedGroup ? [] : matchingPropertyIds(observations);
        var sections = visibleIds.map(function (id) {
          var property = api.getProperty(id);
          var items = groups[id] || [];
          return '<section class="property-section"><div class="property-heading"><h2>' +
            escapeHtml(property ? property.name : id) + '</h2><span>' +
            items.length + (items.length === 1 ? " observation" : " observations") +
            "</span></div>" + items.map(function (item) {
              return '<div class="observation"><span class="value">' +
                escapeHtml(api.formatObservation(item)) + "</span><span>" +
                escapeHtml(api.conditionSummary(item)) + " · " +
                escapeHtml(item.basis.replace(/_/g, " ")) + "</span><span>" +
                escapeHtml(item.source_id) + " · " +
                escapeHtml(item.source_locator) + "</span></div>";
            }).join("") + "</section>";
        }).join("");

        if (!unresolvedGroup && !sections) {
          sections = '<div class="empty">No property in this record matches that filter.</div>';
        }

        recordView.innerHTML = header +
          (selectedEntity.notes ? '<div class="record-note">' +
            escapeHtml(selectedEntity.notes) + "</div>" : "") +
          propertyPrompt + tools + sections;

        var propertyInput = document.getElementById("property-filter");
        if (propertyInput) {
          propertyInput.addEventListener("input", function () {
            propertyFilterText = propertyInput.value;
            propertyFilterId = null;
            pendingProperty = propertyFilterText
              ? api.search(propertyFilterText).property_intent
              : null;
            if (pendingProperty && pendingProperty.kind === "property") {
              propertyFilterId = pendingProperty.id;
            }
            renderRecord();
            var next = document.getElementById("property-filter");
            if (next) {
              next.focus();
              next.setSelectionRange(next.value.length, next.value.length);
            }
          });
        }
      }

      function openEntity(id) {
        selectedEntity = api.getEntity(id);
        if (!selectedEntity) return;
        propertyFilterId = pendingProperty && pendingProperty.kind === "property"
          ? pendingProperty.id
          : propertyFilterId;
        lookupView.hidden = true;
        recordView.hidden = false;
        renderRecord();
        recordView.focus();
        window.scrollTo(0, 0);
        live.textContent = "Opened " + selectedEntity.name + ".";
      }

      function setQuery(value) {
        input.value = value;
        runLookup();
        input.focus();
      }

      input.addEventListener("input", runLookup);
      input.addEventListener("keydown", function (event) {
        if (event.key === "ArrowDown") {
          var first = results.querySelector(".result");
          if (first) {
            event.preventDefault();
            first.focus();
          }
        } else if (event.key === "Escape" && input.value) {
          event.preventDefault();
          setQuery("");
        }
      });

      document.getElementById("material-search").addEventListener("submit", function (event) {
        event.preventDefault();
        var first = results.querySelector(".result");
        if (first) first.click();
      });

      clear.addEventListener("click", function () { setQuery(""); });

      results.addEventListener("keydown", function (event) {
        var rows = Array.prototype.slice.call(results.querySelectorAll(".result"));
        var index = rows.indexOf(document.activeElement);
        if (index < 0) return;
        if (event.key === "ArrowDown" || event.key === "ArrowUp") {
          event.preventDefault();
          var delta = event.key === "ArrowDown" ? 1 : -1;
          rows[(index + delta + rows.length) % rows.length].focus();
        } else if (event.key === "Escape") {
          event.preventDefault();
          input.focus();
        }
      });

      document.addEventListener("click", function (event) {
        var queryButton = event.target.closest("[data-query]");
        if (queryButton) {
          setQuery(queryButton.getAttribute("data-query"));
          return;
        }

        var result = event.target.closest("[data-entity]");
        if (result) {
          openEntity(result.getAttribute("data-entity"));
          return;
        }

        var state = event.target.closest("[data-state]");
        if (state) {
          openEntity(state.getAttribute("data-state"));
          return;
        }

        var property = event.target.closest("[data-record-property]");
        if (property) {
          propertyFilterId = property.getAttribute("data-record-property");
          propertyFilterText = api.getProperty(propertyFilterId).name;
          renderRecord();
          return;
        }

        if (event.target.closest("[data-clear-property]")) {
          pendingProperty = null;
          propertyFilterId = null;
          propertyFilterText = "";
          renderRecord();
          return;
        }

        if (event.target.closest("[data-back]")) {
          recordView.hidden = true;
          lookupView.hidden = false;
          selectedEntity = null;
          input.focus();
          return;
        }

        if (event.target.closest("[data-new]")) {
          setQuery("");
          return;
        }
      });

      document.addEventListener("keydown", function (event) {
        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") {
          event.preventDefault();
          if (lookupView.hidden) setQuery("");
          input.focus();
          input.select();
        }
        if (event.key === "/" && !/input|textarea|select/i.test(document.activeElement.tagName)) {
          event.preventDefault();
          if (lookupView.hidden) setQuery("");
          input.focus();
        }
      });

      runLookup();
    })();
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Engineering Tools | Homepage Prototype G</title>
    <style>
      :root {
        --primary-color: #0b0d12;
        --primary-light: #f4f5f7;
        --secondary-color: #4b5563;
        --accent-color: #111827;
        --success-color: #0f766e;
        --warning-color: #b45309;
        --danger-color: #b91c1c;
        --text-color: #111827;
        --text-light: #6b7280;
        --border-color: #e5e7eb;
        --bg-color: #f8f9fb;
        --bg-card: #ffffff;
        --shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
        --shadow-lg: 0 6px 18px rgba(15, 23, 42, 0.08);
        --border-radius: 8px;
        --font-sans: "Helvetica Neue", "Avenir Next", "Univers", "Helvetica", system-ui, sans-serif;
        --font-mono: "SF Mono", "Menlo", "Monaco", monospace;
      }

      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html { color-scheme: light; }
      body {
        margin: 0;
        color: var(--text-color);
        background: var(--bg-color);
        font-family: var(--font-sans);
        line-height: 1.5;
      }
      a { color: inherit; }
      button, input, select { font: inherit; }
      .skip-link {
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 100;
        padding: 10px 14px;
        color: var(--bg-card);
        background: var(--primary-color);
        transform: translateY(-160%);
      }
      .skip-link:focus { transform: translateY(0); }
      .site-header {
        border-bottom: 1px solid var(--border-color);
        background: var(--bg-card);
      }
      .masthead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: min(92%, 1400px);
        min-height: 58px;
        margin: 0 auto;
        gap: 18px;
      }
      .wordmark {
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        font-weight: 650;
        text-decoration: none;
        letter-spacing: -0.02em;
      }
      .prototype-label {
        color: var(--text-light);
        font: 0.7rem/1.4 var(--font-mono);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .page-shell {
        width: min(92%, 1400px);
        margin: 0 auto;
        padding: 56px 0 72px;
      }
      .page-header { max-width: 900px; }
      h1 {
        margin: 0 0 26px;
        font-size: clamp(2.25rem, 5vw, 4.8rem);
        font-weight: 600;
        letter-spacing: -0.045em;
        line-height: 0.98;
      }
      h2 {
        margin: 48px 0 0;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border-color);
        font-size: 1.375rem;
        font-weight: 600;
      }
      h3 {
        margin: 0;
        color: var(--secondary-color);
        font-size: 1.1rem;
        font-weight: 600;
      }
      .combobox-shell {
        position: relative;
        width: min(100%, 820px);
      }
      .search-label {
        display: block;
        margin-bottom: 7px;
        color: var(--secondary-color);
        font-size: 0.82rem;
        font-weight: 600;
      }
      .search-input {
        width: 100%;
        min-height: 58px;
        border: 1px solid var(--primary-color);
        border-radius: var(--border-radius);
        padding: 14px 52px 14px 18px;
        color: var(--text-color);
        background: var(--bg-card);
        font-size: 1.05rem;
        box-shadow: var(--shadow);
      }
      .search-input:focus {
        outline: 3px solid rgba(17, 24, 39, 0.16);
        outline-offset: 2px;
      }
      .search-icon {
        position: absolute;
        right: 18px;
        bottom: 17px;
        width: 24px;
        height: 24px;
        pointer-events: none;
      }
      .search-results {
        position: absolute;
        top: calc(100% + 8px);
        left: 0;
        right: 0;
        z-index: 50;
        max-height: 390px;
        margin: 0;
        padding: 6px;
        overflow: auto;
        border: 1px solid var(--primary-color);
        border-radius: var(--border-radius);
        background: var(--bg-card);
        box-shadow: var(--shadow-lg);
        list-style: none;
      }
      .search-result {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 3px 16px;
        min-height: 52px;
        padding: 10px 12px;
        border-radius: 5px;
        cursor: pointer;
      }
      .search-result[aria-selected="true"],
      .search-result:hover { background: var(--primary-light); }
      .search-result-title { font-weight: 650; }
      .search-result-description {
        grid-column: 1;
        color: var(--text-light);
        font-size: 0.78rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .search-result-status {
        grid-column: 2;
        grid-row: 1 / span 2;
        align-self: center;
        color: var(--text-light);
        font: 0.66rem/1.3 var(--font-mono);
        text-transform: uppercase;
      }
      .search-empty { padding: 14px; color: var(--text-light); }
      .index-controls {
        display: grid;
        grid-template-columns: repeat(2, minmax(190px, 280px)) 1fr;
        align-items: end;
        gap: 14px;
        padding: 20px 0 16px;
      }
      .filter-field label {
        display: block;
        margin-bottom: 6px;
        color: var(--text-light);
        font-size: 0.76rem;
        font-weight: 600;
      }
      .filter-field select {
        width: 100%;
        min-height: 44px;
        border: 1px solid var(--border-color);
        border-radius: var(--border-radius);
        padding: 9px 36px 9px 12px;
        color: var(--text-color);
        background: var(--bg-card);
      }
      .filter-field select:focus {
        outline: 2px solid var(--primary-color);
        outline-offset: 2px;
      }
      .result-line {
        justify-self: end;
        margin: 0 0 12px;
        color: var(--text-light);
        font: 0.72rem/1.4 var(--font-mono);
      }
      .index-groups {
        display: grid;
        gap: 44px;
        padding-top: 18px;
      }
      .index-group { min-width: 0; }
      .group-heading {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 14px;
        margin-bottom: 14px;
      }
      .group-count {
        color: var(--text-light);
        font: 0.68rem/1.4 var(--font-mono);
      }
      .card-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .card-cell { min-width: 0; }
      .tool-card {
        position: relative;
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 100%;
        border: 1px solid var(--border-color);
        border-radius: var(--border-radius);
        color: inherit;
        background: var(--bg-card);
        box-shadow: var(--shadow);
        text-decoration: none;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }
      .tool-card:hover {
        border-color: var(--primary-color);
        box-shadow: var(--shadow-lg);
      }
      .tool-card:focus-visible {
        outline: 3px solid var(--primary-color);
        outline-offset: 3px;
      }
      .card-thumbnail {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 7;
        border-bottom: 1px solid var(--border-color);
        border-radius: 7px 7px 0 0;
        object-fit: cover;
        object-position: center;
        background: var(--primary-light);
      }
      .card-body {
        display: flex;
        flex-direction: column;
        min-height: 230px;
        padding: 18px;
      }
      .card-status {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-bottom: 10px;
        color: var(--text-light);
        font: 0.65rem/1.3 var(--font-mono);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .status-dot {
        width: 7px;
        height: 7px;
        border: 1px solid var(--secondary-color);
        border-radius: 50%;
      }
      .status-dot.is-verified {
        border-color: var(--success-color);
        background: var(--success-color);
      }
      .card-title {
        margin: 0;
        color: var(--text-color);
        font-size: 1.05rem;
        line-height: 1.25;
      }
      .card-description {
        margin: 9px 0 14px;
        color: var(--secondary-color);
        font-size: 0.84rem;
        line-height: 1.48;
      }
      .tag-list {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin: auto 0 14px;
      }
      .tag {
        border: 1px solid var(--border-color);
        border-radius: 999px;
        padding: 3px 7px;
        color: var(--secondary-color);
        background: var(--primary-light);
        font: 0.62rem/1.3 var(--font-mono);
      }
      .card-metadata {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
        padding-top: 12px;
        border-top: 1px solid var(--border-color);
        color: var(--text-light);
        font: 0.65rem/1.45 var(--font-mono);
      }
      .preview-popover {
        position: fixed;
        top: 50%;
        left: 50%;
        z-index: 80;
        width: min(560px, calc(100vw - 48px));
        padding: 8px;
        border: 1px solid var(--primary-color);
        border-radius: 10px;
        background: var(--bg-card);
        box-shadow: 0 18px 58px rgba(15, 23, 42, 0.24);
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, -47%) scale(0.97);
        transition: opacity 0.12s ease, transform 0.12s ease;
      }
      .preview-popover img {
        display: block;
        width: 100%;
        border-radius: 5px;
      }
      @media (hover: hover) and (pointer: fine) {
        .tool-card:hover .preview-popover {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1);
        }
      }
      .tool-card:focus .preview-popover {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
      .empty-state, .load-error {
        padding: 44px 0;
        color: var(--text-light);
      }
      footer {
        border-top: 1px solid var(--border-color);
        background: var(--bg-card);
      }
      .footer-inner {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        width: min(92%, 1400px);
        margin: 0 auto;
        padding: 24px 0 34px;
        color: var(--text-light);
        font-size: 0.78rem;
      }
      .footer-links { display: flex; flex-wrap: wrap; gap: 18px; }

      @media (max-width: 1050px) {
        .card-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }
      @media (max-width: 720px) {
        .page-shell { padding-top: 38px; }
        .index-controls { grid-template-columns: 1fr 1fr; }
        .result-line { grid-column: 1 / -1; justify-self: start; margin: 0; }
        .card-grid { grid-template-columns: 1fr; }
        .card-body { min-height: 0; }
        .preview-popover { display: none; }
      }
      @media (max-width: 480px) {
        .prototype-label { max-width: 145px; text-align: right; }
        h1 { font-size: 2.55rem; }
        h2 { margin-top: 36px; }
        .index-controls { grid-template-columns: 1fr; }
        .search-result-description { display: none; }
        .footer-inner { flex-direction: column; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#tool-index">Skip to Tool Index</a>
    <header class="site-header">
      <div class="masthead">
        <a class="wordmark" href="/">transparent.tools</a>
        <span class="prototype-label">Option G · Visual cards</span>
      </div>
    </header>

    <main class="page-shell" id="main-content">
      <header class="page-header">
        <h1>Engineering Tools</h1>
        <div class="combobox-shell" id="combobox-shell">
          <label class="search-label" for="search">Search tools</label>
          <input
            class="search-input"
            id="search"
            data-testid="search-input"
            type="search"
            placeholder="Bolt torque, beam bending, Reynolds number"
            autocomplete="off"
            autofocus
            role="combobox"
            aria-autocomplete="list"
            aria-controls="search-results"
            aria-expanded="false"
          />
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="6.5"></circle>
            <path d="m15.5 15.5 5 5"></path>
          </svg>
          <ul class="search-results" id="search-results" data-testid="search-results" role="listbox" hidden></ul>
        </div>
      </header>

      <section id="tool-index" aria-labelledby="index-heading">
        <h2 id="index-heading">Tool Index</h2>
        <div class="index-controls">
          <div class="filter-field">
            <label for="category">Discipline</label>
            <select id="category" data-testid="category-filter"></select>
          </div>
          <div class="filter-field">
            <label for="status">Review status</label>
            <select id="status" data-testid="status-filter">
              <option value="all">All statuses</option>
              <option value="verified">Verified only</option>
              <option value="experimental">Experimental only</option>
            </select>
          </div>
          <p class="result-line" id="result-line" aria-live="polite">Loading catalog...</p>
        </div>
        <div class="index-groups" id="tool-grid" data-testid="tool-grid">
          <!-- BEGIN static tool links -->
          <!-- END static tool links -->
        </div>
      </section>
    </main>

    <footer>
      <div class="footer-inner">
        <span>&copy; <span id="year"></span> Transparent Tools</span>
        <nav class="footer-links" aria-label="Footer">
          <a href="/about.html">About</a>
          <a href="/legal.html">Terms &amp; Privacy</a>
          <a href="https://ko-fi.com/transparent_tools" target="_blank" rel="noopener">Support on Ko-fi</a>
        </nav>
      </div>
    </footer>

    <script src="../shared.js"></script>
    <script>
      (function () {
        "use strict";

        const HP = window.HomepagePrototype;
        const controls = {
          searchInput: document.getElementById("search"),
          categorySelect: document.getElementById("category"),
          statusSelect: document.getElementById("status"),
        };
        const searchResults = document.getElementById("search-results");
        const grid = document.getElementById("tool-grid");
        const resultLine = document.getElementById("result-line");
        let tools = [];
        let visibleSearchResults = [];
        let activeResultIndex = -1;
        let resultsDismissed = false;

        HP.setCurrentYear(document.getElementById("year"));

        function metadataItems(tool) {
          const items = [];
          if (tool.lastUpdated) {
            items.push(HP.createElement("span", {
              text: `Updated ${HP.formatToolDate(tool.lastUpdated)}`,
            }));
          }
          if (tool.revisionCount) {
            items.push(HP.createElement("span", {
              text: `${tool.revisionCount} repository ${tool.revisionCount === 1 ? "change" : "changes"}`,
            }));
          }
          if (tool.version) {
            items.push(HP.createElement("span", { text: `v${tool.version}` }));
          }
          return items;
        }

        function toolCard(tool) {
          const previewUrl = HP.previewDataUrl(tool);
          const tags = HP.visibleTags(tool, 4);
          const link = HP.createElement("a", {
            className: "tool-card",
            href: HP.toolUrl(tool.path),
            dataset: { testid: "tool-link", title: tool.title },
            attributes: { "aria-label": tool.title },
          }, [
            HP.createElement("img", {
              className: "card-thumbnail",
              src: previewUrl,
              alt: "",
              loading: "lazy",
              attributes: { "aria-hidden": "true" },
            }),
            HP.createElement("span", { className: "card-body" }, [
              HP.createElement("span", { className: "card-status" }, [
                HP.createElement("span", {
                  className: `status-dot ${tool.verified ? "is-verified" : ""}`,
                  attributes: { "aria-hidden": "true" },
                }),
                HP.createElement("span", { text: tool.statusLabel }),
              ]),
              HP.createElement("h4", { className: "card-title", text: tool.title }),
              HP.createElement("span", { className: "card-description", text: tool.description }),
              HP.createElement("span", { className: "tag-list" },
                tags.map((tag) => HP.createElement("span", { className: "tag", text: tag })),
              ),
              HP.createElement("span", { className: "card-metadata" }, metadataItems(tool)),
            ]),
            HP.createElement("span", {
              className: "preview-popover",
              dataset: { testid: "preview-tooltip" },
              attributes: { "aria-hidden": "true" },
            }, [
              HP.createElement("img", { src: previewUrl, alt: "" }),
            ]),
          ]);
          return HP.createElement("li", {
            className: "card-cell",
            dataset: { testid: "tool-item", title: tool.title },
          }, link);
        }

        function renderIndex(filtered, filters) {
          const groups = HP.groupTools(filtered, filters.category);
          grid.replaceChildren();
          resultLine.textContent = `${filtered.length} ${filtered.length === 1 ? "tool" : "tools"}`;

          if (!filtered.length) {
            grid.appendChild(HP.createElement("div", {
              className: "empty-state",
              text: "No tools match those filters. Try a shorter search or choose all disciplines.",
            }));
            return;
          }

          groups.forEach((group) => {
            const headingId = `group-${group.id}`;
            const section = HP.createElement("section", {
              className: "index-group",
              attributes: { "aria-labelledby": headingId },
            }, [
              HP.createElement("div", { className: "group-heading" }, [
                HP.createElement("h3", { id: headingId, text: group.label }),
                HP.createElement("span", { className: "group-count", text: `${group.tools.length} tools` }),
              ]),
              HP.createElement("ul", { className: "card-grid" }, group.tools.map(toolCard)),
            ]);
            grid.appendChild(section);
          });
        }

        function closeSearchResults() {
          searchResults.hidden = true;
          controls.searchInput.setAttribute("aria-expanded", "false");
          controls.searchInput.removeAttribute("aria-activedescendant");
          activeResultIndex = -1;
        }

        function setActiveResult(nextIndex) {
          const options = Array.from(searchResults.querySelectorAll('[role="option"]:not([aria-disabled="true"])'));
          if (!options.length) return;
          activeResultIndex = (nextIndex + options.length) % options.length;
          options.forEach((option, index) => {
            option.setAttribute("aria-selected", String(index === activeResultIndex));
          });
          controls.searchInput.setAttribute("aria-activedescendant", options[activeResultIndex].id);
          options[activeResultIndex].scrollIntoView({ block: "nearest" });
        }

        function renderSearchResults(filtered) {
          const query = controls.searchInput.value.trim();
          visibleSearchResults = query ? HP.sortTools(filtered).slice(0, 7) : [];
          searchResults.replaceChildren();
          activeResultIndex = -1;

          if (!query || resultsDismissed) {
            closeSearchResults();
            return;
          }

          if (!visibleSearchResults.length) {
            searchResults.appendChild(HP.createElement("li", {
              className: "search-empty",
              text: "No matching tools",
              attributes: { role: "option", "aria-disabled": "true" },
            }));
          } else {
            visibleSearchResults.forEach((tool, index) => {
              const option = HP.createElement("li", {
                className: "search-result",
                id: `search-option-${index}`,
                dataset: { testid: "search-result", index: String(index) },
                attributes: { role: "option", "aria-selected": "false" },
              }, [
                HP.createElement("span", { className: "search-result-title", text: tool.title }),
                HP.createElement("span", { className: "search-result-description", text: tool.description }),
                HP.createElement("span", { className: "search-result-status", text: tool.statusLabel }),
              ]);
              option.addEventListener("pointerdown", (event) => event.preventDefault());
              option.addEventListener("click", () => window.location.assign(HP.toolUrl(tool.path)));
              searchResults.appendChild(option);
            });
          }
          searchResults.hidden = false;
          controls.searchInput.setAttribute("aria-expanded", "true");
        }

        function renderPage() {
          const filters = HP.getFilters(controls);
          const filtered = HP.filterTools(tools, filters);
          renderIndex(filtered, filters);
          renderSearchResults(filtered);
        }

        controls.searchInput.addEventListener("input", () => {
          resultsDismissed = false;
          renderPage();
        });
        controls.categorySelect.addEventListener("change", renderPage);
        controls.statusSelect.addEventListener("change", renderPage);
        controls.searchInput.addEventListener("focus", () => {
          if (controls.searchInput.value.trim() && !resultsDismissed) renderPage();
        });
        controls.searchInput.addEventListener("keydown", (event) => {
          if (event.key === "ArrowDown") {
            event.preventDefault();
            resultsDismissed = false;
            if (searchResults.hidden) renderPage();
            if (visibleSearchResults.length) setActiveResult(activeResultIndex + 1);
          } else if (event.key === "ArrowUp") {
            event.preventDefault();
            resultsDismissed = false;
            if (searchResults.hidden) renderPage();
            if (visibleSearchResults.length) setActiveResult(activeResultIndex - 1);
          } else if (event.key === "Enter" && activeResultIndex >= 0) {
            event.preventDefault();
            window.location.assign(HP.toolUrl(visibleSearchResults[activeResultIndex].path));
          } else if (event.key === "Escape") {
            resultsDismissed = true;
            closeSearchResults();
          }
        });
        document.addEventListener("pointerdown", (event) => {
          if (!document.getElementById("combobox-shell").contains(event.target)) closeSearchResults();
        });

        HP.loadCatalogWithMetadata()
          .then((catalog) => {
            tools = catalog;
            HP.populateCategorySelect(controls.categorySelect, tools);
            renderPage();
          })
          .catch((error) => {
            console.error(error);
            resultLine.textContent = "Catalog unavailable";
            grid.replaceChildren(HP.createElement("div", {
              className: "load-error",
              text: "The catalog could not be loaded. Run this prototype from the repository's local web server.",
            }));
          });
      })();
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Preview cards | Transparent Tools homepage prototype</title>
    <style>
      :root {
        --primary-color: #0b0d12;
        --primary-light: #f4f5f7;
        --secondary-color: #4b5563;
        --accent-color: #111827;
        --success-color: #0f766e;
        --warning-color: #b45309;
        --danger-color: #b91c1c;
        --text-color: #111827;
        --text-light: #6b7280;
        --border-color: #e5e7eb;
        --bg-color: #f8f9fb;
        --bg-card: #ffffff;
        --shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
        --shadow-lg: 0 6px 18px rgba(15, 23, 42, 0.08);
        --border-radius: 8px;
        --font-sans: "Helvetica Neue", "Avenir Next", "Univers", "Helvetica", system-ui, sans-serif;
        --font-mono: "SF Mono", "Menlo", "Monaco", monospace;
      }

      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      body {
        margin: 0;
        color: var(--text-color);
        background: var(--bg-color);
        font-family: var(--font-sans);
        line-height: 1.5;
      }
      a { color: inherit; }
      button, input, select { font: inherit; }
      .skip-link {
        position: fixed;
        z-index: 50;
        top: 8px;
        left: 8px;
        padding: 8px 12px;
        color: #fff;
        background: var(--accent-color);
        transform: translateY(-160%);
      }
      .skip-link:focus { transform: translateY(0); }
      .site-header {
        border-bottom: 1px solid var(--border-color);
        background: var(--bg-card);
      }
      .masthead {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: min(92%, 1240px);
        margin: 0 auto;
        padding: 15px 0;
      }
      .wordmark {
        text-decoration: none;
        font-weight: 650;
        letter-spacing: -0.02em;
      }
      .prototype-label {
        color: var(--text-light);
        font: 0.66rem/1.3 var(--font-mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      main {
        width: min(92%, 1240px);
        margin: 0 auto;
        padding: clamp(42px, 7vw, 82px) 0 78px;
      }
      .page-heading {
        margin-bottom: 30px;
      }
      h1 {
        margin: 0;
        font-size: clamp(2.45rem, 6vw, 5rem);
        font-weight: 550;
        letter-spacing: -0.05em;
        line-height: 1;
      }
      .search-panel {
        max-width: 920px;
      }
      .combobox-shell { position: relative; }
      .search-label {
        display: block;
        margin-bottom: 7px;
        color: var(--text-light);
        font: 0.68rem/1.2 var(--font-mono);
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      .search-field {
        position: relative;
      }
      .search-input {
        width: 100%;
        min-height: 64px;
        border: 1px solid var(--primary-color);
        border-radius: var(--border-radius);
        padding: 14px 54px 14px 18px;
        color: var(--text-color);
        background: var(--bg-card);
        font-size: clamp(1.02rem, 2vw, 1.22rem);
        box-shadow: var(--shadow-lg);
      }
      .search-icon {
        position: absolute;
        top: 50%;
        right: 19px;
        width: 22px;
        height: 22px;
        pointer-events: none;
        transform: translateY(-50%);
      }
      input:focus, select:focus, a:focus-visible,
      [role="option"][aria-selected="true"] {
        outline: 2px solid var(--accent-color);
        outline-offset: 2px;
      }
      .search-results {
        position: absolute;
        z-index: 30;
        top: calc(100% + 8px);
        right: 0;
        left: 0;
        max-height: min(460px, 62vh);
        margin: 0;
        border: 1px solid var(--primary-color);
        border-radius: var(--border-radius);
        padding: 0;
        overflow-y: auto;
        background: var(--bg-card);
        box-shadow: var(--shadow-lg);
        list-style: none;
      }
      .search-result {
        display: grid;
        grid-template-columns: minmax(150px, 0.8fr) minmax(190px, 1.2fr) auto;
        gap: 15px;
        align-items: center;
        min-height: 54px;
        border-bottom: 1px solid var(--border-color);
        padding: 10px 14px;
        text-decoration: none;
      }
      .search-results li:last-child .search-result { border-bottom: 0; }
      .search-result:hover,
      .search-result[aria-selected="true"] { background: var(--primary-light); }
      .result-title { font-size: 0.84rem; font-weight: 650; }
      .result-description {
        overflow: hidden;
        color: var(--secondary-color);
        font-size: 0.75rem;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .result-status {
        color: var(--text-light);
        font: 0.6rem/1.2 var(--font-mono);
        text-transform: uppercase;
      }
      .search-empty {
        padding: 16px;
        color: var(--text-light);
        font-size: 0.84rem;
      }
      .filter-row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-top: 16px;
      }
      .filter-control label {
        display: block;
        margin-bottom: 5px;
        color: var(--text-light);
        font: 0.63rem/1.2 var(--font-mono);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .filter-control select {
        width: 100%;
        min-height: 44px;
        border: 1px solid var(--border-color);
        border-radius: var(--border-radius);
        padding: 8px 10px;
        color: var(--text-color);
        background: var(--bg-card);
      }
      .catalog-stats {
        min-height: 20px;
        margin: 14px 0 0;
        color: var(--text-light);
        font: 0.68rem/1.4 var(--font-mono);
      }
      .tool-index {
        margin-top: 46px;
      }
      .index-heading {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        align-items: baseline;
        margin-bottom: 30px;
        border-bottom: 1px solid var(--primary-color);
      }
      h2 {
        margin: 0;
        border: 0;
        padding: 0 0 12px;
        font-size: 1.375rem;
        font-weight: 600;
      }
      .result-line {
        margin: 0;
        padding-bottom: 12px;
        color: var(--text-light);
        font: 0.68rem/1.3 var(--font-mono);
      }
      .index-groups {
        display: grid;
        gap: 42px;
      }
      .index-group { min-width: 0; }
      .group-heading {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        margin: 0 0 12px;
        border-bottom: 1px solid var(--border-color);
        padding: 0 0 9px;
        color: var(--text-color);
        font-size: 0.95rem;
      }
      .group-count {
        color: var(--text-light);
        font: 0.64rem/1.4 var(--font-mono);
      }
      .card-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .tool-card {
        display: flex;
        flex-direction: column;
        min-height: 156px;
        border: 1px solid var(--border-color);
        border-radius: var(--border-radius);
        padding: 16px;
        background: var(--bg-card);
        box-shadow: var(--shadow);
        text-decoration: none;
      }
      .tool-card:hover,
      .tool-card:focus-visible {
        border-color: var(--primary-color);
      }
      .card-heading {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        align-items: start;
      }
      .card-title {
        margin: 0;
        color: var(--text-color);
        font-size: 0.92rem;
        font-weight: 650;
        line-height: 1.35;
      }
      .status-mark {
        display: inline-block;
        width: 8px;
        height: 8px;
        margin-top: 4px;
        border: 1px solid var(--primary-color);
      }
      .status-mark.is-verified { background: var(--primary-color); }
      .status-mark.is-experimental { background: transparent; }
      .card-description {
        display: -webkit-box;
        margin: 7px 0 12px;
        overflow: hidden;
        color: var(--secondary-color);
        font-size: 0.76rem;
        line-height: 1.45;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }
      .tag-list {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin: auto 0 10px;
      }
      .tool-tag {
        border: 1px solid var(--border-color);
        border-radius: 999px;
        padding: 2px 7px;
        color: var(--secondary-color);
        background: var(--primary-light);
        font: 0.59rem/1.35 var(--font-mono);
      }
      .card-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 5px 13px;
        padding-top: 9px;
        border-top: 1px solid var(--border-color);
        color: var(--text-light);
        font: 0.59rem/1.4 var(--font-mono);
      }
      .card-meta span { white-space: nowrap; }
      .preview-popover {
        position: fixed;
        z-index: 40;
        width: 292px;
        border: 1px solid var(--primary-color);
        border-radius: var(--border-radius);
        padding: 9px;
        pointer-events: none;
        background: var(--bg-card);
        box-shadow: var(--shadow-lg);
      }
      .preview-popover img {
        display: block;
        width: 100%;
        height: auto;
        border: 1px solid var(--border-color);
        border-radius: 4px;
        background: var(--primary-light);
      }
      .preview-caption {
        display: block;
        padding: 7px 3px 1px;
        overflow: hidden;
        font: 0.64rem/1.3 var(--font-mono);
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .empty-state, .load-error {
        padding: 42px 0;
        color: var(--text-light);
      }
      footer {
        border-top: 1px solid var(--border-color);
        background: var(--bg-card);
      }
      .footer-inner {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        width: min(92%, 1240px);
        margin: 0 auto;
        padding: 24px 0 36px;
        color: var(--text-light);
        font-size: 0.78rem;
      }
      .footer-links { display: flex; gap: 18px; }

      @media (max-width: 720px) {
        .card-grid { grid-template-columns: 1fr; }
        .preview-popover { display: none; }
      }
      @media (max-width: 560px) {
        .prototype-label { max-width: 145px; text-align: right; }
        .filter-row { grid-template-columns: 1fr; }
        .search-result { grid-template-columns: minmax(0, 1fr) auto; }
        .result-description { display: none; }
        .index-heading { align-items: flex-start; flex-direction: column; gap: 0; }
        .tool-card { min-height: 0; }
        .footer-inner { flex-direction: column; }
      }
      @media (prefers-reduced-motion: reduce) {
        * { scroll-behavior: auto !important; }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#tool-index">Skip to tool index</a>
    <header class="site-header">
      <div class="masthead">
        <a class="wordmark" href="/">transparent.tools</a>
        <span class="prototype-label">Option E · Preview cards</span>
      </div>
    </header>

    <main>
      <div class="page-heading">
        <h1 id="page-title">Engineering Tools</h1>
      </div>

      <section class="search-panel" aria-label="Find a tool">
        <div class="combobox-shell" id="combobox-shell">
          <label class="search-label" for="search">Search tools</label>
          <div class="search-field">
            <input
              class="search-input"
              id="search"
              data-testid="search-input"
              type="search"
              placeholder="Search by tool, component, or quantity"
              autocomplete="off"
              role="combobox"
              aria-autocomplete="list"
              aria-controls="search-results"
              aria-expanded="false"
            />
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
          </div>
          <ul class="search-results" id="search-results" data-testid="search-results" role="listbox" hidden></ul>
        </div>
        <div class="filter-row">
          <div class="filter-control">
            <label for="category">Discipline</label>
            <select id="category" data-testid="category-filter"></select>
          </div>
          <div class="filter-control">
            <label for="status">Review status</label>
            <select id="status" data-testid="status-filter">
              <option value="all">All statuses</option>
              <option value="verified">Verified only</option>
              <option value="experimental">Experimental only</option>
            </select>
          </div>
        </div>
        <p class="catalog-stats" id="catalog-stats">Loading catalog...</p>
      </section>

      <section class="tool-index" id="tool-index" aria-labelledby="index-heading">
        <div class="index-heading">
          <h2 id="index-heading">Tool Index</h2>
          <p class="result-line" id="result-line" data-testid="result-line" aria-live="polite"></p>
        </div>
        <div class="index-groups" id="tool-grid" data-testid="tool-grid">
          <!-- BEGIN static tool links -->
          <!-- END static tool links -->
        </div>
      </section>
    </main>

    <aside class="preview-popover" id="preview-popover" data-testid="preview-popover" aria-hidden="true" hidden>
      <img id="preview-image" alt="" />
      <span class="preview-caption" id="preview-caption"></span>
    </aside>

    <footer>
      <div class="footer-inner">
        <span>&copy; <span id="year"></span> Transparent Tools</span>
        <nav class="footer-links" aria-label="Footer">
          <a href="/about.html">About</a>
          <a href="/legal.html">Terms &amp; Privacy</a>
          <a href="https://ko-fi.com/transparent_tools" target="_blank" rel="noopener">Support on Ko-fi</a>
        </nav>
      </div>
    </footer>

    <script src="../shared.js"></script>
    <script>
      (function () {
        "use strict";
        const HP = window.HomepagePrototype;
        const controls = {
          searchInput: document.getElementById("search"),
          categorySelect: document.getElementById("category"),
          statusSelect: document.getElementById("status"),
        };
        const grid = document.getElementById("tool-grid");
        const resultLine = document.getElementById("result-line");
        const statsLine = document.getElementById("catalog-stats");
        const searchResults = document.getElementById("search-results");
        const preview = document.getElementById("preview-popover");
        const previewImage = document.getElementById("preview-image");
        const previewCaption = document.getElementById("preview-caption");
        let tools = [];
        let visibleSearchResults = [];
        let activeResultIndex = -1;
        let resultsDismissed = false;

        HP.setCurrentYear(document.getElementById("year"));

        function repositoryChangeText(tool) {
          if (!Number.isInteger(tool.revisionCount)) {
            return "Repository history unavailable";
          }
          return `${tool.revisionCount} repository ${tool.revisionCount === 1 ? "change" : "changes"}`;
        }

        function tagList(tool, maximum) {
          const tags = HP.visibleTags(tool, maximum);
          if (!tags.length) return null;
          return HP.createElement("div", { className: "tag-list" }, tags.map((tag) =>
            HP.createElement("span", {
              className: "tool-tag",
              text: tag,
              dataset: { testid: "tool-tag" },
            }),
          ));
        }

        function metadata(tool) {
          const items = [
            HP.createElement("span", {
              text: `Updated ${HP.formatToolDate(tool.lastUpdated)}`,
              dataset: { testid: "tool-last-updated" },
            }),
            HP.createElement("span", {
              text: repositoryChangeText(tool),
              dataset: { testid: "tool-revision-count" },
            }),
          ];
          if (tool.version !== null) {
            items.push(HP.createElement("span", {
              text: `v${tool.version}`,
              dataset: { testid: "tool-version" },
            }));
          }
          return HP.createElement("div", { className: "card-meta" }, items);
        }

        function hidePreview() {
          preview.hidden = true;
          preview.setAttribute("aria-hidden", "true");
        }

        function positionPreview(anchor, pointerEvent) {
          const width = 292;
          const gap = 14;
          const rect = anchor.getBoundingClientRect();
          let left = rect.right + gap;
          if (left + width > window.innerWidth - 10) {
            left = Math.max(10, rect.left - width - gap);
          }
          const preferredTop = pointerEvent ? pointerEvent.clientY - 58 : rect.top;
          const height = preview.offsetHeight || 210;
          const top = Math.max(10, Math.min(preferredTop, window.innerHeight - height - 10));
          preview.style.left = `${left}px`;
          preview.style.top = `${top}px`;
        }

        function showPreview(tool, anchor, pointerEvent) {
          if (window.matchMedia("(max-width: 720px)").matches) return;
          previewImage.src = HP.previewDataUrl(tool);
          previewCaption.textContent = tool.title;
          preview.hidden = false;
          preview.setAttribute("aria-hidden", "false");
          positionPreview(anchor, pointerEvent);
        }

        function toolCard(tool) {
          const link = HP.createElement("a", {
            className: "tool-card",
            href: HP.toolUrl(tool.path),
            dataset: { testid: "tool-link", title: tool.title },
            attributes: { "aria-label": `${tool.title}, ${tool.statusLabel}` },
          }, [
            HP.createElement("div", { className: "card-heading" }, [
              HP.createElement("h4", { className: "card-title", text: tool.title }),
              HP.createStatusMark(tool),
            ]),
            HP.createElement("p", { className: "card-description", text: tool.description }),
            tagList(tool, 4),
            metadata(tool),
          ]);
          link.addEventListener("pointerenter", (event) => showPreview(tool, link, event));
          link.addEventListener("pointermove", (event) => positionPreview(link, event));
          link.addEventListener("pointerleave", () => {
            if (document.activeElement !== link) hidePreview();
          });
          link.addEventListener("focus", () => showPreview(tool, link));
          link.addEventListener("blur", hidePreview);
          return link;
        }

        function renderIndex(filtered, filters) {
          const grouped = HP.groupTools(filtered, filters.category);
          grid.replaceChildren();
          resultLine.textContent = `${filtered.length} ${filtered.length === 1 ? "tool" : "tools"}`;

          if (!filtered.length) {
            grid.appendChild(HP.createElement("div", {
              className: "empty-state",
              text: "No tools match these filters.",
            }));
            hidePreview();
            return;
          }

          grouped.forEach((group) => {
            const headingId = `group-${group.id}`;
            const section = HP.createElement("section", {
              className: "index-group",
              attributes: { "aria-labelledby": headingId },
            });
            section.appendChild(HP.createElement("h3", {
              className: "group-heading",
              id: headingId,
            }, [
              HP.createElement("span", { text: group.label }),
              HP.createElement("span", { className: "group-count", text: String(group.tools.length) }),
            ]));
            const list = HP.createElement("ul", { className: "card-grid" });
            group.tools.forEach((tool) => {
              list.appendChild(HP.createElement("li", {
                dataset: { testid: "tool-item", title: tool.title },
              }, toolCard(tool)));
            });
            section.appendChild(list);
            grid.appendChild(section);
          });
        }

        function closeSearchResults() {
          searchResults.hidden = true;
          controls.searchInput.setAttribute("aria-expanded", "false");
          controls.searchInput.removeAttribute("aria-activedescendant");
          activeResultIndex = -1;
        }

        function setActiveResult(nextIndex) {
          const options = Array.from(searchResults.querySelectorAll('[role="option"]:not([aria-disabled="true"])'));
          if (!options.length) {
            closeSearchResults();
            return;
          }
          activeResultIndex = (nextIndex + options.length) % options.length;
          options.forEach((option, index) => {
            option.setAttribute("aria-selected", String(index === activeResultIndex));
          });
          const active = options[activeResultIndex];
          controls.searchInput.setAttribute("aria-activedescendant", active.id);
          active.scrollIntoView({ block: "nearest" });
        }

        function renderSearchResults(filtered) {
          const query = controls.searchInput.value.trim();
          visibleSearchResults = query ? HP.sortTools(filtered).slice(0, 8) : [];
          searchResults.replaceChildren();
          activeResultIndex = -1;

          if (!query || resultsDismissed) {
            closeSearchResults();
            return;
          }
          if (!visibleSearchResults.length) {
            searchResults.appendChild(HP.createElement("li", {
              className: "search-empty",
              text: "No matching tools",
              attributes: { role: "option", "aria-disabled": "true" },
            }));
          } else {
            visibleSearchResults.forEach((tool, index) => {
              const result = HP.createElement("a", {
                className: "search-result",
                id: `search-option-${index}`,
                href: HP.toolUrl(tool.path),
                dataset: { testid: "search-result", index: String(index) },
                attributes: { role: "option", "aria-selected": "false", tabindex: "-1" },
              }, [
                HP.createElement("span", { className: "result-title", text: tool.title }),
                HP.createElement("span", { className: "result-description", text: tool.description }),
                HP.createElement("span", { className: "result-status", text: tool.statusLabel }),
              ]);
              result.addEventListener("pointerdown", (event) => event.preventDefault());
              result.addEventListener("pointerenter", () => setActiveResult(index));
              searchResults.appendChild(HP.createElement("li", {}, result));
            });
          }
          searchResults.hidden = false;
          controls.searchInput.setAttribute("aria-expanded", "true");
        }

        function renderPage() {
          const filters = HP.getFilters(controls);
          const filtered = HP.filterTools(tools, filters);
          renderIndex(filtered, filters);
          renderSearchResults(filtered);
        }

        controls.searchInput.addEventListener("input", () => {
          resultsDismissed = false;
          renderPage();
        });
        controls.searchInput.addEventListener("focus", () => {
          resultsDismissed = false;
          renderPage();
        });
        controls.searchInput.addEventListener("keydown", (event) => {
          if (event.key === "ArrowDown") {
            event.preventDefault();
            if (searchResults.hidden) {
              resultsDismissed = false;
              renderPage();
            }
            setActiveResult(activeResultIndex + 1);
          } else if (event.key === "ArrowUp") {
            event.preventDefault();
            setActiveResult(activeResultIndex - 1);
          } else if (event.key === "Enter" && activeResultIndex >= 0) {
            event.preventDefault();
            window.location.assign(HP.toolUrl(visibleSearchResults[activeResultIndex].path));
          } else if (event.key === "Escape") {
            resultsDismissed = true;
            closeSearchResults();
          }
        });
        controls.categorySelect.addEventListener("change", renderPage);
        controls.statusSelect.addEventListener("change", renderPage);
        document.addEventListener("pointerdown", (event) => {
          if (!document.getElementById("combobox-shell").contains(event.target)) {
            resultsDismissed = true;
            closeSearchResults();
          }
        });
        window.addEventListener("scroll", hidePreview, { passive: true });
        window.addEventListener("resize", hidePreview);

        HP.loadCatalogWithMetadata()
          .then((catalogTools) => {
            tools = catalogTools;
            HP.populateCategorySelect(controls.categorySelect, tools);
            const catalogStats = HP.stats(tools);
            statsLine.textContent = `${catalogStats.total} tools · ${catalogStats.groups} disciplines · ${catalogStats.verified} verified`;
            renderPage();
          })
          .catch((error) => {
            console.error(error);
            statsLine.textContent = "Catalog unavailable";
            grid.replaceChildren(HP.createElement("div", {
              className: "load-error",
              text: "The tool catalog could not be loaded.",
            }));
          });
      })();
    </script>
  </body>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Grouped card grid | Transparent Tools homepage prototype</title>
    <style>
      :root {
        --primary-color: #0b0d12;
        --primary-light: #f4f5f7;
        --secondary-color: #4b5563;
        --accent-color: #111827;
        --success-color: #0f766e;
        --warning-color: #b45309;
        --danger-color: #b91c1c;
        --text-color: #111827;
        --text-light: #6b7280;
        --border-color: #e5e7eb;
        --bg-color: #f8f9fb;
        --bg-card: #ffffff;
        --shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
        --shadow-lg: 0 6px 18px rgba(15, 23, 42, 0.08);
        --border-radius: 8px;
        --font-sans: "Helvetica Neue", "Avenir Next", "Univers", "Helvetica", system-ui, sans-serif;
        --font-mono: "SF Mono", "Menlo", "Monaco", monospace;
      }

      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        color: var(--text-color);
        background: var(--bg-color);
        font-family: var(--font-sans);
        line-height: 1.5;
      }
      a { color: inherit; }
      button, input, select { font: inherit; }
      .skip-link {
        position: fixed;
        top: 8px;
        left: 8px;
        z-index: 20;
        padding: 8px 12px;
        color: white;
        background: var(--accent-color);
        transform: translateY(-160%);
      }
      .skip-link:focus { transform: translateY(0); }
      .site-header {
        border-bottom: 1px solid var(--border-color);
        background: var(--bg-card);
      }
      .masthead {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: min(92%, 1400px);
        margin: 0 auto;
        padding: 16px 0;
      }
      .wordmark {
        text-decoration: none;
        font-weight: 650;
        letter-spacing: -0.02em;
      }
      .prototype-label {
        color: var(--text-light);
        font: 0.68rem/1 var(--font-mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .hero {
        width: min(92%, 1400px);
        margin: 0 auto;
        padding: 52px 0 34px;
      }
      .hero-grid {
        display: grid;
        grid-template-columns: minmax(0, 0.9fr) minmax(360px, 1.1fr);
        gap: clamp(28px, 6vw, 90px);
        align-items: end;
      }
      h1 {
        margin: 0;
        max-width: 620px;
        font-size: clamp(2.2rem, 5vw, 4.2rem);
        font-weight: 550;
        letter-spacing: -0.045em;
        line-height: 1;
      }
      .hero-copy {
        max-width: 510px;
        margin: 18px 0 0;
        color: var(--secondary-color);
      }
      .search-label, .status-control label {
        display: block;
        margin-bottom: 7px;
        color: var(--text-light);
        font: 0.68rem/1.2 var(--font-mono);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .search-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 190px;
        gap: 10px;
      }
      .search-row input, .search-row select {
        width: 100%;
        min-height: 48px;
        border: 1px solid var(--border-color);
        border-radius: var(--border-radius);
        padding: 11px 14px;
        color: var(--text-color);
        background: var(--bg-card);
      }
      input:focus, select:focus, button:focus-visible, a:focus-visible {
        outline: 2px solid var(--accent-color);
        outline-offset: 2px;
      }
      .stat-line {
        margin: 13px 0 0;
        color: var(--text-light);
        font: 0.72rem/1.4 var(--font-mono);
        letter-spacing: 0.02em;
      }
      main {
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr);
        gap: 42px;
        width: min(92%, 1400px);
        margin: 0 auto;
        padding: 34px 0 76px;
        border-top: 1px solid var(--primary-color);
      }
      .sidebar { min-width: 0; }
      .sidebar-title {
        margin: 0 0 12px;
        color: var(--text-light);
        font: 0.68rem/1.2 var(--font-mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .category-nav {
        position: sticky;
        top: 16px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .category-button {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        width: 100%;
        border: 0;
        border-left: 2px solid transparent;
        padding: 9px 10px;
        color: var(--secondary-color);
        background: transparent;
        text-align: left;
        cursor: pointer;
        font-size: 0.82rem;
      }
      .category-button:hover { background: var(--primary-light); }
      .category-button[aria-pressed="true"] {
        border-left-color: var(--primary-color);
        color: var(--text-color);
        background: var(--primary-light);
        font-weight: 650;
      }
      .category-count { font: 0.66rem/1.5 var(--font-mono); }
      .listing { min-width: 0; }
      .result-line {
        margin: 0 0 26px;
        color: var(--text-light);
        font: 0.72rem/1.4 var(--font-mono);
      }
      .tool-section { margin-bottom: 50px; scroll-margin-top: 24px; }
      .section-header {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        align-items: baseline;
        margin-bottom: 16px;
        padding-bottom: 11px;
        border-bottom: 1px solid var(--border-color);
      }
      .section-header h2 {
        margin: 0;
        border: 0;
        padding: 0;
        font-size: 1.25rem;
      }
      .section-count { color: var(--text-light); font: 0.7rem/1 var(--font-mono); }
      .card-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }
      .tool-card {
        display: flex;
        flex-direction: column;
        min-height: 210px;
        border: 1px solid var(--border-color);
        border-radius: var(--border-radius);
        padding: 19px;
        background: var(--bg-card);
        box-shadow: var(--shadow);
      }
      .tool-card.is-experimental { background: #fbfbfc; color: var(--secondary-color); }
      .card-topline {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
        margin-bottom: 17px;
      }
      .status-label, .up-next-label {
        border: 1px solid var(--border-color);
        border-radius: 999px;
        padding: 3px 7px;
        color: var(--secondary-color);
        font: 0.62rem/1.2 var(--font-mono);
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }
      .status-label.is-verified {
        border-color: var(--primary-color);
        color: var(--primary-color);
        background: var(--primary-color);
        color: white;
      }
      .up-next-label { color: var(--warning-color); border-color: var(--warning-color); }
      .card-group {
        margin-left: auto;
        color: var(--text-light);
        font: 0.6rem/1.3 var(--font-mono);
        text-align: right;
        text-transform: uppercase;
      }
      .tool-card h3 {
        margin: 0;
        color: var(--text-color);
        font-size: 1rem;
        line-height: 1.3;
      }
      .tool-card p {
        display: -webkit-box;
        margin: 9px 0 18px;
        overflow: hidden;
        color: var(--secondary-color);
        font-size: 0.82rem;
        line-height: 1.45;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }
      .open-link {
        display: inline-flex;
        gap: 7px;
        align-items: center;
        margin-top: auto;
        color: var(--text-color);
        font-size: 0.78rem;
        font-weight: 650;
        text-decoration: none;
      }
      .open-link::after { content: "↗"; font-family: var(--font-mono); }
      .open-link:hover { text-decoration: underline; }
      .experimental-toggle {
        width: 100%;
        margin-top: 13px;
        border: 1px solid var(--border-color);
        border-radius: var(--border-radius);
        padding: 10px 12px;
        color: var(--secondary-color);
        background: var(--primary-light);
        cursor: pointer;
        text-align: left;
        font-size: 0.78rem;
      }
      .experimental-toggle::after { content: " +"; font-family: var(--font-mono); }
      .experimental-toggle[aria-expanded="true"]::after { content: " −"; }
      .experimental-grid { margin-top: 14px; }
      .empty-state, .load-error {
        padding: 48px 0;
        color: var(--text-light);
        border-top: 1px solid var(--border-color);
      }
      footer {
        border-top: 1px solid var(--border-color);
        background: var(--bg-card);
      }
      .footer-inner {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        width: min(92%, 1400px);
        margin: 0 auto;
        padding: 24px 0 36px;
        color: var(--text-light);
        font-size: 0.78rem;
      }
      .footer-links { display: flex; gap: 18px; }

      @media (max-width: 1120px) {
        .card-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }
      @media (max-width: 800px) {
        .hero-grid { grid-template-columns: 1fr; }
        main { grid-template-columns: 1fr; gap: 24px; }
        .sidebar { min-width: 0; overflow: hidden; }
        .category-nav {
          position: static;
          flex-direction: row;
          gap: 6px;
          overflow-x: auto;
          padding-bottom: 8px;
        }
        .category-button {
          display: inline-flex;
          width: auto;
          flex: 0 0 auto;
          border: 1px solid var(--border-color);
          border-radius: 999px;
          white-space: nowrap;
        }
        .category-button[aria-pressed="true"] { border-color: var(--primary-color); }
      }
      @media (max-width: 560px) {
        .masthead { align-items: flex-start; }
        .prototype-label { max-width: 130px; text-align: right; line-height: 1.4; }
        .hero { padding-top: 34px; }
        .search-row { grid-template-columns: 1fr; }
        .card-grid { grid-template-columns: 1fr; }
        .tool-card { min-height: 190px; }
        .footer-inner { flex-direction: column; }
      }
      @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#catalog">Skip to catalog</a>
    <header class="site-header">
      <div class="masthead">
        <a class="wordmark" href="/">transparent.tools</a>
        <span class="prototype-label">Option B · Grouped cards</span>
      </div>
    </header>

    <section class="hero" aria-labelledby="page-title">
      <div class="hero-grid">
        <div>
          <h1 id="page-title">Useful numbers. Visible methods.</h1>
          <p class="hero-copy">Free engineering calculators that run in your browser. Search by problem, quantity, or discipline.</p>
        </div>
        <div>
          <label class="search-label" for="search">Find a tool</label>
          <div class="search-row">
            <input id="search" data-testid="search-input" type="search" placeholder="Try “bolt torque”" autocomplete="off" />
            <div class="status-control">
              <label class="search-label" for="status">Review status</label>
              <select id="status" data-testid="status-filter">
                <option value="all">All statuses</option>
                <option value="verified">Verified only</option>
                <option value="experimental">Experimental only</option>
              </select>
            </div>
          </div>
          <p class="stat-line" id="catalog-stats">Loading catalog...</p>
        </div>
      </div>
    </section>

    <main id="catalog">
      <aside class="sidebar">
        <h2 class="sidebar-title">Browse by discipline</h2>
        <nav class="category-nav" id="category-nav" data-testid="category-filter" aria-label="Filter by discipline"></nav>
      </aside>
      <div class="listing">
        <p class="result-line" id="result-line" aria-live="polite"></p>
        <div id="tool-grid" data-testid="tool-grid">
          <!-- BEGIN static tool links -->
          <!-- END static tool links -->
        </div>
      </div>
    </main>

    <footer>
      <div class="footer-inner">
        <span>&copy; <span id="year"></span> Transparent Tools</span>
        <nav class="footer-links" aria-label="Footer">
          <a href="/about.html">About</a>
          <a href="/legal.html">Terms &amp; Privacy</a>
          <a href="https://ko-fi.com/transparent_tools" target="_blank" rel="noopener">Support on Ko-fi</a>
        </nav>
      </div>
    </footer>

    <script src="../shared.js"></script>
    <script>
      (function () {
        "use strict";
        const HP = window.HomepagePrototype;
        const searchInput = document.getElementById("search");
        const statusSelect = document.getElementById("status");
        const categoryNav = document.getElementById("category-nav");
        const grid = document.getElementById("tool-grid");
        const resultLine = document.getElementById("result-line");
        const statsLine = document.getElementById("catalog-stats");
        const expandedGroups = new Set();
        let selectedCategory = "all";
        let tools = [];

        HP.setCurrentYear(document.getElementById("year"));

        function filters() {
          return {
            query: searchInput.value.trim().toLowerCase(),
            category: selectedCategory,
            status: statusSelect.value,
          };
        }

        function renderCategoryNav() {
          const activeFilters = filters();
          const countBase = HP.filterTools(tools, { ...activeFilters, category: "all" });
          categoryNav.replaceChildren();
          const choices = [
            { id: "all", label: "All disciplines", count: countBase.length },
            ...HP.DISPLAY_GROUPS.map((group) => ({
              id: group.id,
              label: group.label,
              count: HP.countForGroup(countBase, group.id),
            })).filter((group) => group.count),
          ];

          choices.forEach((choice) => {
            const button = HP.createElement("button", {
              className: "category-button",
              type: "button",
              dataset: { testid: "category-option", category: choice.id },
              attributes: { "aria-pressed": String(choice.id === selectedCategory) },
            }, [
              HP.createElement("span", { text: choice.label }),
              HP.createElement("span", { className: "category-count", text: String(choice.count) }),
            ]);
            button.addEventListener("click", () => {
              selectedCategory = choice.id;
              render();
              document.querySelector(`[data-category="${choice.id}"]`)?.focus();
            });
            categoryNav.appendChild(button);
          });
        }

        function toolCard(tool) {
          const card = HP.createElement("article", {
            className: `tool-card ${tool.verified ? "" : "is-experimental"}`,
            dataset: { testid: "tool-item", variant: "card", title: tool.title },
          });
          const status = HP.createElement("span", {
            className: `status-label ${tool.verified ? "is-verified" : ""}`,
            text: tool.statusLabel,
          });
          const topLine = HP.createElement("div", { className: "card-topline" }, [
            status,
            HP.createElement("span", {
              className: "card-group",
              text: HP.GROUP_BY_ID.get(tool.primaryGroupId).label,
            }),
          ]);
          if (tool.upNext) {
            topLine.insertBefore(HP.createElement("span", { className: "up-next-label", text: "Up next" }), topLine.lastChild);
          }
          card.append(
            topLine,
            HP.createElement("h3", { text: tool.title }),
            HP.createElement("p", { text: tool.description }),
            HP.createElement("a", {
              className: "open-link",
              href: HP.toolUrl(tool.path),
              text: "Open tool",
              dataset: { testid: "tool-link", title: tool.title },
              attributes: { "aria-label": `Open ${tool.title}` },
            }),
          );
          return card;
        }

        function renderToolGrid(toolList, className = "card-grid") {
          const cardGrid = HP.createElement("div", { className });
          toolList.forEach((tool) => cardGrid.appendChild(toolCard(tool)));
          return cardGrid;
        }

        function render() {
          const activeFilters = filters();
          const filtered = HP.filterTools(tools, activeFilters);
          const grouped = HP.groupTools(filtered, selectedCategory);
          const forceExperimental = HP.shouldRevealExperimental(activeFilters);
          grid.replaceChildren();
          renderCategoryNav();
          resultLine.textContent = `${filtered.length} ${filtered.length === 1 ? "tool" : "tools"} shown`;

          if (!filtered.length) {
            grid.appendChild(HP.createElement("div", {
              className: "empty-state",
              text: "No tools match those filters. Clear the search or choose another discipline.",
            }));
            return;
          }

          grouped.forEach((group) => {
            const section = HP.createElement("section", { className: "tool-section", id: `section-${group.id}` });
            section.setAttribute("aria-labelledby", `heading-${group.id}`);
            section.appendChild(HP.createElement("div", { className: "section-header" }, [
              HP.createElement("h2", { id: `heading-${group.id}`, text: group.label }),
              HP.createElement("span", { className: "section-count", text: `${group.tools.length} tools` }),
            ]));

            const verified = group.tools.filter((tool) => tool.verified);
            const experimental = group.tools.filter((tool) => !tool.verified);
            if (verified.length) section.appendChild(renderToolGrid(verified));

            if (experimental.length) {
              const panelId = `experimental-${group.id}`;
              const isExpanded = forceExperimental || expandedGroups.has(group.id);
              const experimentalGrid = renderToolGrid(experimental, "card-grid experimental-grid");
              experimentalGrid.id = panelId;
              experimentalGrid.hidden = !isExpanded;
              if (!forceExperimental) {
                const toggle = HP.createElement("button", {
                  className: "experimental-toggle",
                  type: "button",
                  text: `${isExpanded ? "Hide" : "Show"} experimental tools (${experimental.length})`,
                  dataset: { testid: "experimental-toggle", group: group.id },
                  attributes: { "aria-expanded": String(isExpanded), "aria-controls": panelId },
                });
                toggle.addEventListener("click", () => {
                  if (expandedGroups.has(group.id)) expandedGroups.delete(group.id);
                  else expandedGroups.add(group.id);
                  render();
                  document.querySelector(`[data-group="${group.id}"]`)?.focus();
                });
                section.appendChild(toggle);
              }
              section.appendChild(experimentalGrid);
            }
            grid.appendChild(section);
          });
        }

        searchInput.addEventListener("input", render);
        statusSelect.addEventListener("change", render);

        HP.loadCatalog()
          .then((catalog) => {
            tools = catalog;
            const counts = HP.stats(tools);
            statsLine.textContent = `${counts.total} calculators · ${counts.verified} verified · all client-side`;
            render();
          })
          .catch((error) => {
            console.error(error);
            statsLine.textContent = "Catalog unavailable";
            grid.replaceChildren(HP.createElement("div", {
              className: "load-error",
              text: "The catalog could not be loaded. Run this prototype from the repository's local web server.",
            }));
          });
      })();
    </script>
  </body>
</html>

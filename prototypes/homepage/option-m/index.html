<!doctype html>
<html lang="en" data-theme="light" data-theme-storage-key="transparent-tools-theme">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Tool Index | Homepage prototype</title>
    <script>
      (function () {
        const root = document.documentElement;
        const storageKey = root.dataset.themeStorageKey;
        let savedTheme = null;
        try {
          savedTheme = window.localStorage.getItem(storageKey);
        } catch {}
        const systemTheme = window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
        root.dataset.theme = savedTheme === "dark" || savedTheme === "light"
          ? savedTheme
          : systemTheme;
      })();
    </script>
    <style>
      :root {
        --ink: #171a1f;
        --muted: #68717b;
        --line: #d9dde2;
        --line-strong: #a6adb5;
        --card: #ffffff;
        --wash: #f0f2f4;
        --verified: #166d65;
        --inverse-ink: #ffffff;
        --wordmark: #616a74;
        --control-label: #58616b;
        --input-border: #555d66;
        --placeholder: #858c95;
        --row-hover: #fafbfb;
        --description: #505861;
        --tag-text: #515963;
        --backdrop: rgba(18, 22, 27, 0.54);
        --drawer-shadow: rgba(15, 23, 42, 0.18);
        --frame-bg: #ffffff;
        --radius: 6px;
        --sans: "Helvetica Neue", "Avenir Next", "Helvetica", system-ui, sans-serif;
        --mono: "SF Mono", "Menlo", "Monaco", monospace;
      }

      html[data-theme="dark"] {
        color-scheme: dark;
        --ink: #f3f4f6;
        --muted: #aeb5bf;
        --line: #2d333d;
        --line-strong: #596270;
        --card: #0b0d12;
        --wash: #151a22;
        --verified: #52c7b8;
        --inverse-ink: #0b0d12;
        --wordmark: #b8c0ca;
        --control-label: #b4bcc6;
        --input-border: #6d7784;
        --placeholder: #8f99a5;
        --row-hover: #11161d;
        --description: #c0c6ce;
        --tag-text: #c7cdd4;
        --backdrop: rgba(0, 0, 0, 0.72);
        --drawer-shadow: rgba(0, 0, 0, 0.62);
      }

      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html { color-scheme: light; }
      body {
        margin: 0;
        color: var(--ink);
        background: var(--card);
        font-family: var(--sans);
        line-height: 1.45;
      }
      body.drawer-open { overflow: hidden; }
      a { color: inherit; }
      button, input, select { font: inherit; }
      button { color: inherit; }
      .skip-link {
        position: fixed;
        z-index: 60;
        top: 8px;
        left: 8px;
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 9px 13px;
        color: var(--inverse-ink);
        background: var(--ink);
        transform: translateY(-160%);
      }
      .skip-link:focus { transform: translateY(0); }

      .global-header {
        height: 52px;
        border-bottom: 1px solid var(--line);
        background: var(--card);
      }
      .header-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: min(calc(100% - 48px), 1280px);
        height: 100%;
        margin: 0 auto;
      }
      .wordmark {
        display: inline-flex;
        align-items: center;
        min-width: 44px;
        min-height: 44px;
        color: var(--wordmark);
        font-size: 0.94rem;
        font-weight: 620;
        letter-spacing: -0.01em;
        text-decoration: none;
      }
      .wordmark:hover { color: var(--ink); }
      .theme-toggle {
        display: inline-grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border: 0;
        border-radius: var(--radius);
        padding: 0;
        color: var(--control-label);
        background: transparent;
        cursor: pointer;
      }
      .theme-toggle:hover {
        color: var(--ink);
        background: var(--wash);
      }
      .theme-icon {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.8;
      }
      .theme-icon-sun { display: none; }
      html[data-theme="dark"] .theme-icon-moon { display: none; }
      html[data-theme="dark"] .theme-icon-sun { display: block; }

      .index-controls {
        border-bottom: 1px solid var(--line);
        background: var(--card);
      }
      .controls-inner {
        width: min(calc(100% - 48px), 1280px);
        margin: 0 auto;
        padding: 27px 0 30px;
      }
      .title-row {
        margin-bottom: 16px;
      }
      h1 {
        margin: 0;
        font-size: clamp(1.85rem, 2.5vw, 2rem);
        font-weight: 640;
        letter-spacing: -0.035em;
        line-height: 1.1;
      }
      .filter-toolbar {
        display: grid;
        grid-template-columns: minmax(280px, 1fr) minmax(190px, 250px) minmax(170px, 210px);
        gap: 10px;
        align-items: end;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 10px;
        background-color: var(--card);
      }
      .toolbar-control { min-width: 0; }
      .toolbar-control label {
        display: block;
        margin-bottom: 5px;
        color: var(--control-label);
        font: 0.63rem/1.25 var(--mono);
        letter-spacing: 0.045em;
        text-transform: uppercase;
      }
      .search-input,
      .toolbar-control select {
        width: 100%;
        min-height: 46px;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius);
        padding: 9px 11px;
        color: var(--ink);
        background: var(--card);
      }
      .search-input {
        border-color: var(--input-border);
        font-size: 0.94rem;
      }
      .search-input::placeholder { color: var(--placeholder); }
      .toolbar-control select { font-size: 0.82rem; }
      input:focus-visible,
      select:focus-visible,
      button:focus-visible,
      a:focus-visible,
      iframe:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }

      .list-shell {
        width: min(calc(100% - 48px), 1280px);
        margin: 0 auto;
        padding: 28px 0 72px;
        background: var(--card);
      }
      .directory-heading {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 14px;
        border-bottom: 1px solid var(--ink);
      }
      .directory-label {
        margin: 0;
        padding: 0 0 9px;
        font-size: 0.86rem;
        font-weight: 650;
      }
      .result-line {
        margin: 0;
        padding-bottom: 9px;
        color: var(--muted);
        font: 0.64rem/1.3 var(--mono);
      }
      .directory-groups {
        display: grid;
        min-width: 0;
        gap: 24px;
      }
      .directory-group { min-width: 0; }
      .group-heading {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        margin: 0;
        border-bottom: 1px solid var(--line);
        padding: 0 6px 7px;
        font-size: 0.79rem;
        font-weight: 650;
      }
      .group-count {
        color: var(--muted);
        font: 0.61rem/1.35 var(--mono);
      }
      .directory-list {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .tool-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: stretch;
        min-height: 70px;
        border-bottom: 1px solid var(--line);
        background: var(--card);
      }
      .tool-row:hover { background: var(--row-hover); }
      .row-link {
        display: grid;
        grid-template-columns: 9px minmax(170px, 0.7fr) minmax(220px, 1.3fr) minmax(185px, auto);
        gap: 11px;
        align-items: start;
        min-width: 0;
        min-height: 70px;
        padding: 10px 8px 10px 5px;
        text-decoration: none;
      }
      .status-mark {
        display: inline-block;
        width: 7px;
        height: 7px;
        margin-top: 5px;
        border: 1px solid var(--ink);
      }
      .status-mark.is-verified {
        border-color: var(--verified);
        background: var(--verified);
      }
      .status-mark.is-experimental { background: transparent; }
      .row-title {
        font-size: 0.81rem;
        font-weight: 650;
        line-height: 1.32;
      }
      .row-description {
        display: -webkit-box;
        overflow: hidden;
        color: var(--description);
        font-size: 0.71rem;
        line-height: 1.4;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }
      .row-side { text-align: right; }
      .row-tags,
      .row-meta {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .row-tags { gap: 4px; margin-bottom: 5px; }
      .tool-tag {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 1px 6px;
        color: var(--tag-text);
        background: var(--wash);
        font: 0.53rem/1.35 var(--mono);
      }
      .row-meta {
        gap: 3px 9px;
        color: var(--muted);
        font: 0.54rem/1.35 var(--mono);
      }
      .row-meta span { white-space: nowrap; }
      .preview-button {
        align-self: center;
        min-width: 78px;
        min-height: 44px;
        margin: 9px 5px 9px 7px;
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 8px 10px;
        color: var(--control-label);
        background: transparent;
        font-size: 0.7rem;
        font-weight: 600;
        cursor: pointer;
      }
      .preview-button:hover {
        border-color: var(--line-strong);
        color: var(--ink);
        background: var(--wash);
      }
      .empty-state,
      .load-error {
        min-height: 120px;
        padding: 34px 8px;
        color: var(--muted);
      }
      footer {
        border-top: 1px solid var(--line);
        background: var(--card);
      }
      .footer-inner {
        display: flex;
        justify-content: flex-end;
        gap: 16px;
        width: min(calc(100% - 48px), 1280px);
        margin: 0 auto;
        padding: 20px 0 28px;
        color: var(--muted);
        font-size: 0.71rem;
      }
      .footer-inner a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 44px;
        min-height: 44px;
      }

      .preview-backdrop {
        position: fixed;
        z-index: 50;
        inset: 0;
        display: flex;
        justify-content: flex-end;
        background: var(--backdrop);
      }
      .preview-drawer {
        display: flex;
        flex-direction: column;
        width: min(88vw, 1320px);
        height: 100%;
        border-left: 1px solid var(--ink);
        background: var(--card);
        box-shadow: -12px 0 32px var(--drawer-shadow);
      }
      .preview-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        min-height: 64px;
        border-bottom: 1px solid var(--line);
        padding: 10px 14px 10px 18px;
      }
      .preview-toolbar h2 {
        min-width: 0;
        margin: 0;
        overflow: hidden;
        font-size: 0.96rem;
        font-weight: 650;
        line-height: 1.3;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .preview-actions {
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 8px;
      }
      .open-tool,
      .close-preview {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        border: 1px solid var(--line-strong);
        border-radius: 5px;
        padding: 8px 13px;
        background: var(--card);
        font-size: 0.74rem;
        font-weight: 620;
        text-decoration: none;
      }
      .close-preview { cursor: pointer; }
      .open-tool:hover,
      .close-preview:hover { border-color: var(--ink); background: var(--wash); }
      .preview-host {
        position: relative;
        flex: 1;
        min-height: 0;
        background: var(--wash);
      }
      .preview-loading {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        margin: 0;
        color: var(--muted);
        font: 0.71rem/1.4 var(--mono);
      }
      .preview-frame {
        position: relative;
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: var(--frame-bg);
      }

      @media (max-width: 1050px) {
        .row-link {
          grid-template-columns: 9px minmax(180px, 0.72fr) minmax(220px, 1.28fr);
        }
        .row-side { grid-column: 2 / -1; text-align: left; }
        .row-tags,
        .row-meta { justify-content: flex-start; }
      }
      @media (max-width: 760px) {
        .header-inner,
        .controls-inner,
        .list-shell,
        .footer-inner { width: min(calc(100% - 32px), 1280px); }
        .controls-inner { padding: 23px 0 25px; }
        .title-row { align-items: flex-start; flex-direction: column; gap: 7px; }
        .filter-toolbar { grid-template-columns: 1fr; }
        .tool-row { grid-template-columns: minmax(0, 1fr) auto; }
        .row-link {
          grid-template-columns: 9px minmax(0, 1fr);
          min-height: 110px;
          padding: 11px 5px;
        }
        .row-description,
        .row-side { grid-column: 2; }
        .preview-button {
          min-width: 74px;
          margin-right: 4px;
          padding-inline: 8px;
        }
        .preview-drawer {
          width: 100vw;
          height: 100dvh;
          border-left: 0;
        }
      }
      @media (max-width: 430px) {
        .directory-heading { align-items: flex-start; flex-direction: column; gap: 0; }
        .tool-row { grid-template-columns: minmax(0, 1fr); }
        .preview-button {
          justify-self: stretch;
          margin: 0 5px 10px 14px;
        }
        .preview-toolbar { align-items: flex-start; padding-left: 14px; }
        .preview-toolbar h2 {
          padding-top: 12px;
          white-space: normal;
        }
        .preview-actions { flex-wrap: wrap; justify-content: flex-end; }
        .open-tool,
        .close-preview { padding-inline: 10px; }
      }
      @media (prefers-reduced-motion: reduce) {
        * { scroll-behavior: auto !important; }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#tool-index">Skip to tool index</a>

    <div class="page-shell" id="page-shell">
      <header class="global-header">
        <div class="header-inner">
          <a class="wordmark" href="/">transparent.tools</a>
          <button
            class="theme-toggle"
            id="theme-toggle"
            data-testid="theme-toggle"
            type="button"
            aria-label="Use dark theme"
            aria-pressed="false"
            title="Use dark theme"
          >
            <svg class="theme-icon theme-icon-moon" aria-hidden="true" viewBox="0 0 24 24">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
            </svg>
            <svg class="theme-icon theme-icon-sun" aria-hidden="true" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="3.5" />
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
          </button>
        </div>
      </header>

      <section class="index-controls" aria-labelledby="page-title">
        <div class="controls-inner">
          <div class="title-row">
            <h1 id="page-title">Tool Index</h1>
          </div>
          <div class="filter-toolbar" aria-label="Find a tool">
            <div class="toolbar-control">
              <label for="search">Search tools</label>
              <input
                class="search-input"
                id="search"
                data-testid="search-input"
                type="search"
                placeholder="Tool, component, or quantity"
                autocomplete="off"
              />
            </div>
            <div class="toolbar-control">
              <label for="category">Discipline</label>
              <select id="category" data-testid="category-filter"></select>
            </div>
            <div class="toolbar-control">
              <label for="status">Review status</label>
              <select id="status" data-testid="status-filter">
                <option value="all">All statuses</option>
                <option value="verified">Verified only</option>
                <option value="experimental">Experimental only</option>
              </select>
            </div>
          </div>
        </div>
      </section>

      <main class="list-shell">
        <section id="tool-index" aria-labelledby="directory-label">
          <div class="directory-heading">
            <h2 class="directory-label" id="directory-label">All tools</h2>
            <p class="result-line" id="result-line" data-testid="result-line" aria-live="polite"></p>
          </div>
          <div class="directory-groups" id="tool-grid" data-testid="tool-grid">
            <!-- BEGIN static tool links -->
            <!-- END static tool links -->
          </div>
        </section>
      </main>

      <footer>
        <nav class="footer-inner" aria-label="Footer">
          <a href="/about.html">About</a>
          <a href="/legal.html">Terms &amp; Privacy</a>
        </nav>
      </footer>
    </div>

    <div class="preview-backdrop" id="preview-backdrop" hidden>
      <section
        class="preview-drawer"
        id="preview-drawer"
        data-testid="preview-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="preview-title"
      >
        <header class="preview-toolbar">
          <h2 id="preview-title">Tool preview</h2>
          <div class="preview-actions">
            <a class="open-tool" id="open-tool" href="#">Open tool</a>
            <button class="close-preview" id="close-preview" type="button">Close</button>
          </div>
        </header>
        <div class="preview-host" id="preview-host"></div>
      </section>
    </div>

    <script src="../shared.js"></script>
    <script>
      (function () {
        "use strict";
        const HP = window.HomepagePrototype;
        const controls = {
          searchInput: document.getElementById("search"),
          categorySelect: document.getElementById("category"),
          statusSelect: document.getElementById("status"),
        };
        const grid = document.getElementById("tool-grid");
        const resultLine = document.getElementById("result-line");
        const themeToggle = document.getElementById("theme-toggle");
        const pageShell = document.getElementById("page-shell");
        const backdrop = document.getElementById("preview-backdrop");
        const drawer = document.getElementById("preview-drawer");
        const previewTitle = document.getElementById("preview-title");
        const previewHost = document.getElementById("preview-host");
        const openToolLink = document.getElementById("open-tool");
        const closeButton = document.getElementById("close-preview");
        let tools = [];
        let activeTool = null;
        let previewTrigger = null;
        const themeMedia = window.matchMedia("(prefers-color-scheme: dark)");
        const themeStorageKey = document.documentElement.dataset.themeStorageKey;

        function storedTheme() {
          try {
            const value = window.localStorage.getItem(themeStorageKey);
            return value === "dark" || value === "light" ? value : null;
          } catch {
            return null;
          }
        }

        function syncThemeToggle(theme) {
          const dark = theme === "dark";
          const label = dark ? "Use light theme" : "Use dark theme";
          themeToggle.setAttribute("aria-label", label);
          themeToggle.setAttribute("aria-pressed", String(dark));
          themeToggle.title = label;
        }

        function applyTheme(theme, persist = false) {
          document.documentElement.dataset.theme = theme;
          if (persist) {
            try {
              window.localStorage.setItem(themeStorageKey, theme);
            } catch {}
          }
          syncThemeToggle(theme);
        }

        syncThemeToggle(document.documentElement.dataset.theme);
        themeToggle.addEventListener("click", () => {
          const nextTheme = document.documentElement.dataset.theme === "dark"
            ? "light"
            : "dark";
          applyTheme(nextTheme, true);
        });
        themeMedia.addEventListener("change", (event) => {
          if (!storedTheme()) applyTheme(event.matches ? "dark" : "light");
        });

        function repositoryChangeText(tool) {
          if (!Number.isInteger(tool.revisionCount)) return "Changes unavailable";
          return `${tool.revisionCount} repository ${tool.revisionCount === 1 ? "change" : "changes"}`;
        }

        function toolTags(tool) {
          return HP.createElement("div", { className: "row-tags" },
            HP.visibleTags(tool, 3).map((tag) => HP.createElement("span", {
              className: "tool-tag",
              text: tag,
              dataset: { testid: "tool-tag" },
            })),
          );
        }

        function toolMetadata(tool) {
          const items = [
            HP.createElement("span", {
              text: `Updated ${HP.formatToolDate(tool.lastUpdated)}`,
              dataset: { testid: "tool-last-updated" },
            }),
            HP.createElement("span", {
              text: repositoryChangeText(tool),
              dataset: { testid: "tool-revision-count" },
            }),
          ];
          if (tool.version !== null) {
            items.push(HP.createElement("span", {
              text: `v${tool.version}`,
              dataset: { testid: "tool-version" },
            }));
          }
          return HP.createElement("div", { className: "row-meta" }, items);
        }

        function closePreview(restoreFocus = true) {
          if (backdrop.hidden) return;
          activeTool = null;
          backdrop.hidden = true;
          document.body.classList.remove("drawer-open");
          pageShell.inert = false;
          previewHost.replaceChildren();
          previewTitle.textContent = "Tool preview";
          openToolLink.href = "#";
          if (restoreFocus && previewTrigger && previewTrigger.isConnected) {
            previewTrigger.focus();
          }
          previewTrigger = null;
        }

        function handleFrameEscape(event) {
          if (event.key === "Escape") closePreview(true);
        }

        function openPreview(tool, trigger) {
          activeTool = tool;
          previewTrigger = trigger;
          previewTitle.textContent = tool.title;
          openToolLink.href = HP.toolUrl(tool.path);

          const loading = HP.createElement("p", {
            className: "preview-loading",
            text: "Loading tool...",
          });
          const frame = document.createElement("iframe");
          frame.className = "preview-frame";
          frame.title = `Preview of ${tool.title}`;
          frame.dataset.testid = "preview-frame";
          frame.referrerPolicy = "same-origin";
          frame.addEventListener("load", () => {
            loading.remove();
            try {
              frame.contentWindow.addEventListener("keydown", handleFrameEscape);
            } catch (error) {
              console.debug("Preview keyboard hook unavailable", error);
            }
          }, { once: true });
          frame.src = HP.toolUrl(tool.path);
          previewHost.replaceChildren(loading, frame);

          backdrop.hidden = false;
          document.body.classList.add("drawer-open");
          pageShell.inert = true;
          closeButton.focus();
        }

        function previewButton(tool) {
          const button = HP.createElement("button", {
            className: "preview-button",
            type: "button",
            text: "Preview",
            dataset: { testid: "preview-button", title: tool.title },
            attributes: { "aria-label": `Preview ${tool.title}` },
          });
          button.addEventListener("click", () => openPreview(tool, button));
          return button;
        }

        function toolRow(tool) {
          const link = HP.createElement("a", {
            className: "row-link",
            href: HP.toolUrl(tool.path),
            dataset: { testid: "tool-link", title: tool.title },
            attributes: { "aria-label": `${tool.title}, ${tool.statusLabel}` },
          }, [
            HP.createStatusMark(tool),
            HP.createElement("span", { className: "row-title", text: tool.title }),
            HP.createElement("span", { className: "row-description", text: tool.description }),
            HP.createElement("span", { className: "row-side" }, [
              toolTags(tool),
              toolMetadata(tool),
            ]),
          ]);
          return HP.createElement("li", {
            className: "tool-row",
            dataset: { testid: "tool-item", title: tool.title },
          }, [link, previewButton(tool)]);
        }

        function renderIndex(filtered, filters) {
          const grouped = HP.groupTools(filtered, filters.category);
          grid.replaceChildren();
          const filtersAreActive = Boolean(filters.query)
            || filters.category !== "all"
            || filters.status !== "all";
          resultLine.textContent = filtersAreActive
            ? `${filtered.length} ${filtered.length === 1 ? "tool" : "tools"}`
            : "";

          if (!filtered.length) {
            grid.appendChild(HP.createElement("div", {
              className: "empty-state",
              text: "No tools match these filters.",
            }));
            return;
          }

          grouped.forEach((group) => {
            const headingId = `group-${group.id}`;
            const section = HP.createElement("section", {
              className: "directory-group",
              attributes: { "aria-labelledby": headingId },
            });
            section.appendChild(HP.createElement("h3", {
              className: "group-heading",
              id: headingId,
            }, [
              HP.createElement("span", { text: group.label }),
              HP.createElement("span", { className: "group-count", text: String(group.tools.length) }),
            ]));
            const list = HP.createElement("ul", { className: "directory-list" });
            group.tools.forEach((tool) => list.appendChild(toolRow(tool)));
            section.appendChild(list);
            grid.appendChild(section);
          });
        }

        function renderPage() {
          if (activeTool) closePreview(false);
          const filters = HP.getFilters(controls);
          renderIndex(HP.filterTools(tools, filters), filters);
        }

        function focusableDrawerControls() {
          return Array.from(drawer.querySelectorAll(
            "a[href], button:not([disabled]), iframe, [tabindex]:not([tabindex='-1'])",
          )).filter((element) => !element.hidden);
        }

        controls.searchInput.addEventListener("input", renderPage);
        controls.categorySelect.addEventListener("change", renderPage);
        controls.statusSelect.addEventListener("change", renderPage);
        closeButton.addEventListener("click", () => closePreview(true));
        backdrop.addEventListener("pointerdown", (event) => {
          if (event.target === backdrop) closePreview(true);
        });
        document.addEventListener("keydown", (event) => {
          if (backdrop.hidden) return;
          if (event.key === "Escape") {
            event.preventDefault();
            closePreview(true);
            return;
          }
          if (event.key !== "Tab") return;
          const focusable = focusableDrawerControls();
          if (!focusable.length) return;
          const first = focusable[0];
          const last = focusable[focusable.length - 1];
          if (event.shiftKey && document.activeElement === first) {
            event.preventDefault();
            last.focus();
          } else if (!event.shiftKey && document.activeElement === last) {
            event.preventDefault();
            first.focus();
          }
        });

        HP.loadCatalogWithMetadata()
          .then((catalogTools) => {
            tools = catalogTools;
            HP.populateCategorySelect(controls.categorySelect, tools);
            renderPage();
          })
          .catch((error) => {
            console.error(error);
            const isLocalFile = window.location.protocol === "file:";
            grid.replaceChildren(HP.createElement("div", {
              className: "load-error",
              text: isLocalFile
                ? "Open this prototype through a local web server so it can read catalog.json."
                : "The tool catalog could not be loaded.",
            }));
          });
      })();
    </script>
  </body>
</html>

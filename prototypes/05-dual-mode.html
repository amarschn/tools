<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Materials — dual-mode prototype</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #181818;
      --muted: #626262;
      --quiet: #858585;
      --line: #d3d3d3;
      --line-dark: #9b9b9b;
      --soft: #f5f5f5;
      --blue: #075ea8;
      --blue-soft: #edf5fb;
      --max: 1060px;
      --tree-columns: minmax(210px, 1fr) 18% 27% 160px;
    }

    * { box-sizing: border-box; }

    html {
      min-width: 300px;
      color: var(--ink);
      background: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      font-size: 14px;
    }

    body { margin: 0; }
    button, input { font: inherit; }
    button { color: inherit; }

    :focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    .skip-link {
      position: fixed;
      z-index: 30;
      top: 4px;
      left: 4px;
      padding: 6px 9px;
      border: 1px solid var(--blue);
      background: #fff;
      transform: translateY(-160%);
    }

    .skip-link:focus { transform: none; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .topbar {
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 6px max(12px, calc((100vw - var(--max)) / 2));
      border-bottom: 1px solid var(--line-dark);
      background: #fff;
    }

    .brand {
      color: #111;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    .build-meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 3px 12px;
      color: var(--muted);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .build-meta b {
      color: #333;
      font-weight: 650;
    }

    .warning {
      min-height: 27px;
      padding: 5px max(12px, calc((100vw - var(--max)) / 2));
      border-bottom: 1px solid var(--line);
      color: #494949;
      background: var(--soft);
      font-size: 12px;
      line-height: 1.35;
    }

    main {
      width: min(100%, var(--max));
      min-height: calc(100vh - 110px);
      margin: 0 auto;
      padding: 10px 12px 34px;
    }

    .search {
      height: 40px;
      display: grid;
      grid-template-columns: 1fr auto;
      border: 1px solid #777;
      background: #fff;
    }

    .search:focus-within {
      border-color: var(--blue);
      box-shadow: 0 0 0 1px var(--blue);
    }

    .search input {
      min-width: 0;
      height: 38px;
      padding: 0 10px;
      border: 0;
      outline: 0;
      color: #111;
      background: transparent;
      font-size: 15px;
    }

    .search input::-webkit-search-cancel-button {
      -webkit-appearance: none;
      appearance: none;
    }

    .search input::-ms-clear { display: none; }

    .search button {
      min-width: 38px;
      border: 0;
      border-left: 1px solid var(--line);
      background: var(--soft);
      cursor: pointer;
    }

    .search button[hidden] { display: none; }

    .routebar {
      min-height: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }

    .routebar strong { color: #333; font-weight: 650; }

    .timing {
      color: var(--quiet);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .idle {
      padding: 12px 0 4px;
    }

    .mode-row {
      display: grid;
      grid-template-columns: 145px minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      min-height: 45px;
      border-bottom: 1px solid var(--line);
    }

    .mode-row:first-child { border-top: 1px solid var(--line-dark); }
    .mode-row:last-child { border-bottom-color: var(--line-dark); }
    .mode-row strong { font-weight: 650; }
    .mode-row span { color: var(--muted); }

    .examples, .choices {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .choice, .action, .example {
      min-height: 29px;
      padding: 4px 8px;
      border: 1px solid #aaa;
      border-radius: 2px;
      color: #222;
      background: #fff;
      cursor: pointer;
    }

    .choice:hover, .action:hover, .example:hover {
      border-color: var(--blue);
      color: var(--blue);
    }

    .action.primary {
      border-color: var(--blue);
      color: #064e89;
      background: var(--blue-soft);
    }

    .notice {
      padding: 10px 0;
      border-bottom: 1px solid var(--line-dark);
      line-height: 1.45;
    }

    .notice strong { font-weight: 650; }
    .notice p { margin: 3px 0 0; color: var(--muted); }
    .notice .choices { margin-top: 8px; }

    .section-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 11px 0 9px;
      border-bottom: 1px solid var(--line-dark);
    }

    .section-head h1 {
      margin: 0;
      color: #111;
      font-size: 20px;
      line-height: 1.25;
    }

    .section-head p {
      margin: 3px 0 0;
      color: var(--muted);
      line-height: 1.4;
    }

    .section-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 5px;
    }

    .overview-summary {
      display: grid;
      grid-template-columns: var(--tree-columns);
      gap: 12px;
      align-items: center;
      padding: 8px;
      border-bottom: 1px solid var(--line);
    }

    .overview-summary > :first-child { grid-column: 1 / 3; }
    .overview-summary > .counts { grid-column: 3; }

    .overview-summary strong {
      display: block;
      color: #111;
      font-size: 15px;
      font-weight: 650;
    }

    .overview-summary span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
    }

    .counts {
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .tree {
      margin-top: 8px;
      border-top: 1px solid var(--line-dark);
      border-bottom: 1px solid var(--line-dark);
    }

    details { min-width: 0; }

    summary {
      position: relative;
      cursor: pointer;
      list-style: none;
    }

    summary::-webkit-details-marker { display: none; }

    .taxon > summary::before,
    .material-node > summary::before,
    .state-node > summary::before {
      position: absolute;
      top: 50%;
      left: calc(6px + var(--tree-indent, 0px));
      color: var(--muted);
      content: "›";
      font-size: 16px;
      line-height: 1;
      transform: translateY(-50%);
      transform-origin: center;
      transition: transform 80ms linear;
    }

    .taxon[open] > summary::before,
    .material-node[open] > summary::before,
    .state-node[open] > summary::before {
      transform: translateY(-50%) rotate(90deg);
    }

    .taxon {
      border-bottom: 1px solid var(--line);
    }

    .taxon:last-child { border-bottom: 0; }

    .taxon > summary {
      min-height: 48px;
      display: grid;
      grid-template-columns: var(--tree-columns);
      align-items: center;
      gap: 12px;
      padding: 6px 8px;
      background: #fff;
    }

    .taxon > summary:hover { background: var(--soft); }

    .node-name {
      min-width: 0;
      padding-left: calc(18px + var(--tree-indent, 0px));
      color: #111;
      font-weight: 650;
    }

    .node-name small {
      display: block;
      margin-top: 1px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 400;
    }

    .range {
      min-width: 0;
      color: #111;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .range small {
      display: block;
      margin-top: 1px;
      color: var(--quiet);
      font-size: 10px;
      font-variant-numeric: normal;
    }

    .node-body {
      border-top: 1px solid #e5e5e5;
      background-image: linear-gradient(var(--line), var(--line));
      background-repeat: no-repeat;
      background-position: calc(13px + var(--tree-indent, 0px)) 0;
      background-size: 1px 100%;
    }

    .material-node {
      border-bottom: 1px solid #e2e2e2;
    }

    .material-node:last-child { border-bottom: 0; }

    .material-node > summary {
      min-height: 44px;
      display: grid;
      grid-template-columns: var(--tree-columns);
      align-items: center;
      gap: 12px;
      padding: 5px 8px;
      background: #fafafa;
    }

    .material-node > summary:hover { background: #f2f2f2; }

    .row-action {
      min-height: 27px;
      justify-self: end;
      white-space: nowrap;
    }

    .material-body {
      padding: 7px 0 9px;
      border-top: 1px solid #e2e2e2;
      background: #fff;
    }

    .material-body > .context {
      padding: 0 8px 0 calc(18px + var(--tree-indent, 0px));
    }

    .context {
      margin: 0 0 7px;
      color: var(--muted);
      font-size: 11px;
    }

    .breadcrumb {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 2px 5px;
    }

    .breadcrumb-node {
      min-height: 18px;
      padding: 0;
      border: 0;
      color: var(--blue);
      background: transparent;
      font-size: 11px;
      text-decoration: underline;
      text-decoration-color: #a9bdd0;
      text-underline-offset: 2px;
      cursor: pointer;
    }

    .breadcrumb-node:hover {
      color: #034b88;
      text-decoration-color: currentColor;
    }

    .breadcrumb-separator { color: var(--quiet); }

    .state-node {
      border-top: 1px solid #e1e1e1;
    }

    .state-node > summary {
      min-height: 37px;
      display: grid;
      grid-template-columns: var(--tree-columns);
      align-items: center;
      gap: 12px;
      padding: 5px 8px;
      font-size: 12px;
    }

    .state-node > summary span { color: var(--muted); }

    .state-node > summary > strong {
      min-width: 0;
      padding-left: calc(18px + var(--tree-indent, 0px));
    }

    .observation {
      display: grid;
      grid-template-columns: 125px minmax(175px, 1fr) minmax(190px, 1.1fr);
      gap: 12px;
      padding: 7px 4px;
      border-top: 1px solid #e3e3e3;
      font-size: 12px;
    }

    .observation .value {
      color: #111;
      font-variant-numeric: tabular-nums;
      font-weight: 650;
    }

    .observation span {
      min-width: 0;
      overflow-wrap: anywhere;
      color: var(--muted);
    }

    .browse-material {
      min-height: 40px;
      display: grid;
      grid-template-columns: var(--tree-columns);
      align-items: center;
      gap: 12px;
      padding: 5px 8px;
      border-bottom: 1px solid #e2e2e2;
      background: #fafafa;
    }

    .browse-material:last-child { border-bottom: 0; }
    .browse-material > strong {
      padding-left: calc(18px + var(--tree-indent, 0px));
    }
    .browse-material span { color: var(--muted); font-size: 12px; }
    .browse-material > .action { grid-column: 4; }

    .match-list, .state-chooser {
      margin-top: 8px;
      border-top: 1px solid var(--line-dark);
      border-bottom: 1px solid var(--line-dark);
    }

    .match, .state-choice {
      width: 100%;
      min-height: 45px;
      display: grid;
      grid-template-columns: minmax(190px, 1.4fr) minmax(150px, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 5px 7px;
      border: 0;
      border-bottom: 1px solid #e2e2e2;
      color: var(--ink);
      background: #fff;
      text-align: left;
      cursor: pointer;
    }

    .match:last-child, .state-choice:last-child { border-bottom: 0; }
    .match:hover, .state-choice:hover { background: var(--soft); }
    .match strong, .match small { display: block; }
    .match strong { color: #111; font-weight: 650; }
    .match small, .match-context, .state-choice span { color: var(--muted); font-size: 12px; }
    .open-label { color: var(--blue); font-size: 12px; white-space: nowrap; }

    .record-meta {
      padding: 7px 0;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .focus-bar {
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 6px 0;
      border-bottom: 1px solid var(--line-dark);
    }

    .focus-bar strong { font-weight: 650; }
    .focus-bar span { color: var(--muted); font-size: 12px; }

    .property-section {
      border-bottom: 1px solid var(--line-dark);
    }

    .property-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0 5px;
    }

    .property-heading h2 {
      margin: 0;
      font-size: 14px;
      font-weight: 650;
    }

    .property-heading span {
      color: var(--muted);
      font-size: 12px;
    }

    .empty {
      padding: 18px 0;
      border-bottom: 1px solid var(--line-dark);
      color: var(--muted);
    }

    footer {
      width: min(100%, var(--max));
      margin: 0 auto;
      padding: 8px 12px 17px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--quiet);
      font-size: 11px;
    }

    [hidden] { display: none !important; }

    @media (max-width: 820px) {
      .overview-summary {
        grid-template-columns: 1fr;
        gap: 5px;
      }
      .overview-summary > :first-child,
      .overview-summary > .counts {
        grid-column: auto;
      }
      .taxon > summary, .material-node > summary {
        grid-template-columns: minmax(150px, 1fr) auto;
        gap: 3px 10px;
      }
      .taxon > summary .counts {
        grid-column: 1 / -1;
        padding-left: 0;
      }
      .material-node > summary .counts {
        grid-column: 1;
        padding-left: 0;
      }
      .material-node > summary .row-action {
        grid-column: 2;
        grid-row: 2;
      }
      .state-node > summary {
        grid-template-columns: minmax(120px, 1fr) auto;
        gap: 3px 10px;
      }
      .state-node > summary .state-range {
        grid-column: 1;
        padding-left: 0;
      }
      .state-node > summary .counts {
        grid-column: 1;
        padding-left: 0;
      }
      .state-node > summary .row-action {
        grid-column: 2;
        grid-row: 1 / span 3;
      }
      .taxon > summary::before,
      .material-node > summary::before,
      .state-node > summary::before {
        left: calc(6px + var(--tree-indent-narrow, 0px));
      }
      .node-name,
      .state-node > summary > strong,
      .browse-material > strong {
        padding-left: calc(18px + var(--tree-indent-narrow, 0px));
      }
      .node-body {
        background-position: calc(13px + var(--tree-indent-narrow, 0px)) 0;
      }
      .material-body > .context {
        padding-left: calc(18px + var(--tree-indent-narrow, 0px));
      }
      .browse-material {
        grid-template-columns: minmax(150px, 1fr) auto;
      }
      .browse-material > :nth-child(2) { display: none; }
      .browse-material > .action { grid-column: 2; }
    }

    @media (max-width: 660px) {
      .topbar {
        align-items: flex-start;
        gap: 8px;
      }

      .build-meta {
        max-width: 270px;
        gap: 1px 8px;
      }

      .mode-row { grid-template-columns: 1fr; gap: 3px; padding: 7px 0; }
      .section-head { display: block; }
      .section-actions { justify-content: flex-start; margin-top: 8px; }
      .match, .state-choice { grid-template-columns: minmax(155px, 1fr) auto; }
      .match-context { display: none; }
      .observation { grid-template-columns: 105px 1fr; gap: 3px 10px; }
      .observation > :last-child { grid-column: 1 / -1; }
      .focus-bar { align-items: flex-start; }
    }

    @media (max-width: 420px) {
      .topbar { display: block; }
      .build-meta { max-width: none; justify-content: flex-start; margin-top: 3px; text-align: left; }
      .warning { font-size: 11px; }
      .routebar { align-items: flex-start; padding: 6px 0; }
      .taxon > summary, .material-node > summary { grid-template-columns: 1fr; }
      .taxon > summary .counts, .material-node > summary .counts { grid-column: auto; }
      .material-node > summary .row-action {
        grid-column: auto;
        grid-row: auto;
        justify-self: start;
      }
      .range small { display: inline; margin-left: 4px; }
      .state-node > summary { grid-template-columns: minmax(100px, 1fr) auto; }
      .state-node > summary .state-range {
        display: block;
        grid-column: 1;
        margin-top: 2px;
      }
      footer { display: block; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#query">Skip to search</a>

  <header class="topbar">
    <a class="brand" href="./05-dual-mode.html">Materials</a>
    <div class="build-meta" aria-label="Prototype metadata">
      <b id="record-count">— records</b>
      <span id="corpus-version">corpus —</span>
      <span id="build-version">build —</span>
    </div>
  </header>

  <div class="warning" id="warning">Synthetic test data only.</div>

  <main>
    <form class="search" id="search-form" role="search">
      <label class="sr-only" for="query">Search a material or property</label>
      <input id="query" type="search" autocomplete="off" spellcheck="false"
        placeholder="Material or property — try AX60-T6 or tensile strength"
        aria-controls="view" autofocus>
      <button id="clear" type="button" aria-label="Clear search" hidden>×</button>
    </form>

    <div class="routebar">
      <span id="route-label"><strong>Opening fixture…</strong></span>
      <span class="timing" id="timing">search — ms</span>
    </div>

    <section id="view" aria-live="polite"></section>
    <p class="sr-only" id="live" role="status" aria-live="polite"></p>
  </main>

  <footer>
    <span>Exact lookup or grouped property overview. No ranking or recommendation.</span>
    <span>Prototype 05 · dual mode</span>
  </footer>

  <script src="./assets/synthetic-corpus.js"></script>
  <script src="./assets/search-core.js"></script>
  <script>
    (function () {
      "use strict";

      var Search = window.MaterialsPrototypeSearch;
      var corpus = Search.corpus;
      var queryInput = document.getElementById("query");
      var clearButton = document.getElementById("clear");
      var routeLabel = document.getElementById("route-label");
      var timing = document.getElementById("timing");
      var view = document.getElementById("view");
      var live = document.getElementById("live");

      var taxonById = new Map();
      var taxonChildren = new Map();
      var materialById = new Map();
      var statesByMaterial = new Map();
      var observationsByMaterial = new Map();
      var observationsByState = new Map();
      var propertyOrder = new Map();
      var rollupCache = new Map();
      var overridePropertyId = null;
      var overrideScopeId = null;
      var analysis = null;
      var selectedEntity = null;
      var focusedPropertyId = null;
      var showAllProperties = false;
      var returnMode = null;

      corpus.taxa.forEach(function (taxon) {
        taxonById.set(taxon.id, taxon);
        if (!taxonChildren.has(taxon.id)) taxonChildren.set(taxon.id, []);
      });
      corpus.taxa.forEach(function (taxon) {
        if (!taxon.parent_id) return;
        if (!taxonChildren.has(taxon.parent_id)) taxonChildren.set(taxon.parent_id, []);
        taxonChildren.get(taxon.parent_id).push(taxon);
      });
      corpus.materials.forEach(function (material) {
        materialById.set(material.id, material);
        statesByMaterial.set(material.id, []);
        observationsByMaterial.set(material.id, []);
      });
      corpus.states.forEach(function (state) {
        statesByMaterial.get(state.material_id).push(state);
        observationsByState.set(state.id, []);
      });
      corpus.observations.forEach(function (observation) {
        observationsByMaterial.get(observation.material_id).push(observation);
        if (observation.state_id && observationsByState.has(observation.state_id)) {
          observationsByState.get(observation.state_id).push(observation);
        }
      });
      corpus.properties.forEach(function (property, index) {
        propertyOrder.set(property.id, index);
      });

      document.getElementById("record-count").textContent =
        Search.stats.lookup_record_count + " records";
      document.getElementById("corpus-version").textContent =
        "corpus " + corpus.corpus_version;
      document.getElementById("build-version").textContent =
        "build " + corpus.build_version;
      document.getElementById("warning").textContent =
        "Synthetic fixture — " + corpus.warning;

      function escapeHtml(value) {
        return String(value == null ? "" : value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function plural(number, singular, pluralForm) {
        return number + " " + (number === 1 ? singular : (pluralForm || singular + "s"));
      }

      function treeDepthStyle(depth) {
        var safeDepth = Math.max(0, Number(depth) || 0);
        return ' style="--tree-indent:' + (safeDepth * 18) +
          'px;--tree-indent-narrow:' + (safeDepth * 10) + 'px"';
      }

      function primaryTaxonId(material) {
        return material && material.taxon_ids && material.taxon_ids.length
          ? material.taxon_ids[0]
          : null;
      }

      function taxonLineage(id) {
        var result = [];
        var current = id ? taxonById.get(id) : null;
        var guard = 0;
        while (current && guard < 40) {
          result.push(current);
          current = current.parent_id ? taxonById.get(current.parent_id) : null;
          guard += 1;
        }
        return result;
      }

      function isPrimaryUnder(material, taxonId) {
        if (!taxonId) return true;
        return taxonLineage(primaryTaxonId(material)).some(function (taxon) {
          return taxon.id === taxonId;
        });
      }

      function materialsUnder(taxonId) {
        return corpus.materials.filter(function (material) {
          return isPrimaryUnder(material, taxonId);
        });
      }

      function directMaterials(taxonId) {
        return corpus.materials.filter(function (material) {
          return primaryTaxonId(material) === taxonId;
        }).sort(function (a, b) {
          return a.name.localeCompare(b.name, undefined, {
            numeric: true,
            sensitivity: "base"
          });
        });
      }

      function observationBounds(observation) {
        return {
          min: Number.isFinite(observation.value_min)
            ? observation.value_min
            : observation.value,
          max: Number.isFinite(observation.value_max)
            ? observation.value_max
            : observation.value
        };
      }

      function conditionSignature(observation) {
        var conditions = observation.conditions || {};
        var keys = Object.keys(conditions).sort();
        return JSON.stringify(keys.map(function (key) {
          return [key, conditions[key]];
        }));
      }

      function conditionLabel(key) {
        var labels = {
          fiber_mass_fraction_1: "fiber content",
          fiber_volume_fraction_1: "fiber content",
          material_state: "material state",
          moisture_content_1: "moisture",
          product_form: "product form",
          temperature_K: "temperature"
        };
        return labels[key] || key.replace(/_/g, " ");
      }

      function rollup(materials, propertyId) {
        var observations = [];
        var materialIds = new Set();
        var eligibleRecordIds = new Set();
        var recordIds = new Set();
        var conditionSets = new Set();
        var bases = new Set();
        var minimum = Infinity;
        var maximum = -Infinity;

        materials.forEach(function (material) {
          var materialObservations = observationsByMaterial.get(material.id);
          materialObservations.forEach(function (item) {
            eligibleRecordIds.add(item.state_id || item.material_id);
          });
          var matching = materialObservations.filter(function (item) {
            return item.property_id === propertyId;
          });
          if (matching.length) materialIds.add(material.id);
          matching.forEach(function (item) {
            observations.push(item);
            recordIds.add(item.state_id || item.material_id);
            conditionSets.add(conditionSignature(item));
            bases.add(item.basis);
            var bounds = observationBounds(item);
            minimum = Math.min(minimum, bounds.min);
            maximum = Math.max(maximum, bounds.max);
          });
        });

        var conditionKeys = new Set();
        observations.forEach(function (item) {
          Object.keys(item.conditions || {}).forEach(function (key) {
            conditionKeys.add(key);
          });
        });
        var mixedConditionKeys = Array.from(conditionKeys).filter(function (key) {
          var values = new Set(observations.map(function (item) {
            var conditions = item.conditions || {};
            return Object.prototype.hasOwnProperty.call(conditions, key)
              ? JSON.stringify(conditions[key])
              : "(not reported)";
          }));
          return values.size > 1;
        }).map(conditionLabel);

        return {
          materials: materialIds.size,
          eligibleRecords: eligibleRecordIds.size,
          records: recordIds.size,
          observations: observations.length,
          conditionSets: conditionSets.size,
          bases: bases.size,
          mixedConditionKeys: Array.from(new Set(mixedConditionKeys)),
          min: observations.length ? minimum : null,
          max: observations.length ? maximum : null,
          items: observations
        };
      }

      function rollupForTaxon(taxonId, propertyId) {
        var key = taxonId + "|" + propertyId;
        if (!rollupCache.has(key)) {
          rollupCache.set(key, rollup(materialsUnder(taxonId), propertyId));
        }
        return rollupCache.get(key);
      }

      function rollupForMaterial(material, propertyId) {
        return rollup([material], propertyId);
      }

      function formatObservedValue(propertyId, value) {
        return Search.formatObservation({
          property_id: propertyId,
          value: value
        });
      }

      function rangeText(propertyId, data) {
        if (!data || !data.observations) return "No observations";
        if (data.min === data.max) return formatObservedValue(propertyId, data.min);
        return formatObservedValue(propertyId, data.min) + " – " +
          formatObservedValue(propertyId, data.max);
      }

      function countsText(data) {
        return [
          plural(data.records, "record"),
          plural(data.materials, "material"),
          plural(data.observations, "observation")
        ].join(" · ");
      }

      function coverageText(data) {
        var coverage = data.records === data.eligibleRecords
          ? plural(data.records, "data-bearing record") + " covered"
          : data.records + " of " + data.eligibleRecords + " data-bearing records covered";
        var parts = [
          coverage,
          plural(data.conditionSets, "condition set"),
          plural(data.bases, "basis", "bases")
        ];
        if (data.mixedConditionKeys.length) {
          var shown = data.mixedConditionKeys.slice(0, 4);
          parts.push("mixed " + shown.join(", ") +
            (data.mixedConditionKeys.length > shown.length ? ", and more" : ""));
        }
        return parts.join(" · ");
      }

      function displayId(entity) {
        var material = materialById.get(entity.material_id);
        var values = entity.kind === "state"
          ? (entity.designations || [])
          : (material && material.designations || []);
        return values.length
          ? values.slice(0, 2).join(" · ")
          : entity.id.replace(/^synthetic-/, "");
      }

      function entityExactRank(entity, materialTerms) {
        var query = Search.compact(materialTerms);
        if (!query) return null;
        var canonical = [
          entity.name,
          entity.label,
          entity.id,
          entity.id.replace(/^synthetic-/, "")
        ].concat(entity.designations || []);
        if (canonical.some(function (value) { return Search.compact(value) === query; })) {
          return [0, entity.kind === "material" ? 0 : 1];
        }
        if ((entity.aliases || []).some(function (value) {
          return Search.compact(value) === query;
        })) {
          return [1, entity.kind === "material" ? 0 : 1];
        }
        return null;
      }

      function exactEntity(value) {
        if (!value.material_terms) return null;
        return (value.results || []).map(function (entity) {
          return { entity: entity, rank: entityExactRank(entity, value.material_terms) };
        }).filter(function (item) {
          return item.rank;
        }).sort(function (a, b) {
          return a.rank[0] - b.rank[0] || a.rank[1] - b.rank[1];
        }).map(function (item) {
          return item.entity;
        })[0] || null;
      }

      function setRoute(label, secondary) {
        routeLabel.innerHTML = "<strong>" + escapeHtml(label) + "</strong>" +
          (secondary ? " · " + escapeHtml(secondary) : "");
      }

      function setQuery(value) {
        queryInput.value = value;
        overridePropertyId = null;
        overrideScopeId = null;
        showAllProperties = false;
        routeSearch();
        queryInput.focus();
      }

      function propertyChoices(intent) {
        return '<div class="choices" aria-label="Choose a precise property">' +
          intent.ids.map(function (id) {
            var property = Search.getProperty(id);
            if (!property) return "";
            return '<button class="choice" type="button" data-property-choice="' +
              escapeHtml(id) + '">' + escapeHtml(property.name) + "</button>";
          }).join("") + "</div>";
      }

      function renderIdle() {
        setRoute("Two lookup modes", "one search box");
        view.innerHTML =
          '<div class="idle">' +
            '<div class="mode-row"><strong>Material datasheet</strong>' +
              '<span>Exact material or named-state query opens one complete record.</span>' +
              '<div class="examples"><button class="example" type="button" data-query="AX60-T6">AX60-T6</button>' +
              '<button class="example" type="button" data-query="NylonDemo N6">NylonDemo N6</button></div></div>' +
            '<div class="mode-row"><strong>Property overview</strong>' +
              '<span>Exact property query opens observed ranges grouped by category.</span>' +
              '<div class="examples"><button class="example" type="button" data-query="tensile strength">tensile strength</button>' +
              '<button class="example" type="button" data-query="plastic tensile strength">plastic tensile strength</button></div></div>' +
          "</div>";
        live.textContent = "Ready for a material or property query.";
      }

      function renderUnsupportedComparison() {
        setRoute("Comparison is not supported", "lookup and grouped overview only");
        view.innerHTML =
          '<div class="notice"><strong>This prototype does not rank, recommend, or compare materials.</strong>' +
          '<p>Look up one exact material, or search one precise property to inspect source observations grouped by category.</p>' +
          '<div class="choices"><button class="choice" type="button" data-query="AX60-T6">Look up AX60-T6</button>' +
          '<button class="choice" type="button" data-query="tensile strength">Open tensile strength overview</button></div></div>';
        live.textContent = "Comparison queries are not supported.";
      }

      function renderScopeChoice(value) {
        setRoute("Choose a category", "the scope term is ambiguous");
        view.innerHTML =
          '<div class="notice"><strong>That term maps to more than one category.</strong>' +
          '<p>Categories are navigation scopes and own no property values.</p>' +
          '<div class="choices">' + value.scope_options.map(function (scope) {
            return '<button class="choice" type="button" data-scope-choice="' +
              escapeHtml(scope.id) + '">' + escapeHtml(scope.name) + "</button>";
          }).join("") + "</div></div>";
        live.textContent = "Choose one category scope.";
      }

      function renderPropertyChoice(value) {
        var label = value.property_intent.label;
        setRoute("Choose a precise property", value.scope ? value.scope.name : label);
        view.innerHTML =
          '<div class="notice"><strong>“' + escapeHtml(label) +
          '” names several different measurements.</strong>' +
          '<p>Select the test you mean. No values are combined across these properties.</p>' +
          propertyChoices(value.property_intent) + "</div>";
        live.textContent = label + " is ambiguous. Choose a precise property.";
      }

      function renderNoMatch(value) {
        setRoute("No material or property matched", "“" + value.query.trim() + "”");
        view.innerHTML =
          '<div class="notice"><strong>The synthetic fixture has no matching identity or registered property.</strong>' +
          '<p>Try a shorter designation, an exact property, or a category plus property.</p>' +
          '<div class="choices"><button class="choice" type="button" data-query="NylonDemo N6">NylonDemo N6</button>' +
          '<button class="choice" type="button" data-query="yield strength">yield strength</button>' +
          '<button class="choice" type="button" data-query="engineering plastics">engineering plastics</button></div></div>';
        live.textContent = "No match for " + value.query.trim() + ".";
      }

      function otherClassification(material) {
        var ids = (material.taxon_ids || []).slice(1);
        (statesByMaterial.get(material.id) || []).forEach(function (state) {
          (state.taxon_ids || []).forEach(function (id) {
            if (ids.indexOf(id) === -1 && id !== primaryTaxonId(material)) ids.push(id);
          });
        });
        return ids.map(function (id) {
          return Search.taxonName(id);
        });
      }

      function observationValue(observation) {
        var bounds = observationBounds(observation);
        if (bounds.min !== bounds.max) {
          return formatObservedValue(observation.property_id, bounds.min) + " – " +
            formatObservedValue(observation.property_id, bounds.max);
        }
        return Search.formatObservation(observation);
      }

      function renderObservation(observation) {
        return '<div class="observation">' +
          '<span class="value">' + escapeHtml(observationValue(observation)) + "</span>" +
          "<span>" + escapeHtml(Search.conditionSummary(observation)) + " · " +
            escapeHtml(observation.basis.replace(/_/g, " ")) + "</span>" +
          "<span>" + escapeHtml(observation.source_id) + " · " +
            escapeHtml(observation.source_locator) + "</span>" +
        "</div>";
      }

      function renderMaterialNode(material, propertyId, depth) {
        depth = depth || 0;
        var data = rollupForMaterial(material, propertyId);
        if (!data.observations) return "";
        var stateGroups = new Map();
        var direct = [];
        data.items.forEach(function (item) {
          if (!item.state_id) {
            direct.push(item);
          } else {
            if (!stateGroups.has(item.state_id)) stateGroups.set(item.state_id, []);
            stateGroups.get(item.state_id).push(item);
          }
        });
        var other = otherClassification(material);
        var body =
          '<div class="material-body">' +
            (other.length ? '<p class="context">Other classification: ' +
              escapeHtml(other.join(" · ")) +
              ". It is context only and is not counted again.</p>" : "") +
            direct.map(renderObservation).join("");

        stateGroups.forEach(function (items, stateId) {
          var state = Search.getState(stateId);
          var stateEntity = Search.getEntity(stateId);
          var stateData = rollup([material], propertyId);
          var itemMinimum = Math.min.apply(null, items.map(function (item) {
            return observationBounds(item).min;
          }));
          var itemMaximum = Math.max.apply(null, items.map(function (item) {
            return observationBounds(item).max;
          }));
          var localData = {
            observations: items.length,
            min: itemMinimum,
            max: itemMaximum
          };
          body += '<details class="state-node"' + treeDepthStyle(depth + 1) +
            '><summary><strong>' +
            escapeHtml(state ? state.label : stateId) + '</strong><span class="state-range">' +
            escapeHtml(rangeText(propertyId, localData)) + '</span>' +
            '<span class="counts">' + plural(items.length, "observation") + '</span>' +
            '<button class="action row-action" type="button" data-open-entity="' +
              escapeHtml(stateEntity ? stateEntity.id : stateId) +
              '" data-open-property="' + escapeHtml(propertyId) +
              '">Open focused state</button></summary>' +
            items.map(renderObservation).join("") + "</details>";
          void stateData;
        });

        body += "</div>";
        return '<details class="material-node"' + treeDepthStyle(depth) + '><summary>' +
          '<span class="node-name">' + escapeHtml(material.name) +
            '<small>' + escapeHtml((material.designations || []).join(" · ") ||
              material.id.replace(/^synthetic-/, "")) + "</small></span>" +
          '<span class="range">' + escapeHtml(rangeText(propertyId, data)) +
            '<small>derived observed range · synthetic</small></span>' +
          '<span class="counts">' + escapeHtml(countsText(data)) + "</span>" +
          '<button class="action row-action" type="button" data-open-entity="' +
            escapeHtml(material.id) + '" data-open-property="' +
            escapeHtml(propertyId) + '">Open focused record</button>' +
          "</summary>" + body + "</details>";
      }

      function renderTaxonNode(taxonId, propertyId, open, depth) {
        depth = depth || 0;
        var taxon = taxonById.get(taxonId);
        var data = rollupForTaxon(taxonId, propertyId);
        if (!taxon || !data.observations) return "";
        var children = (taxonChildren.get(taxonId) || []).filter(function (child) {
          return rollupForTaxon(child.id, propertyId).observations > 0;
        });
        var materials = directMaterials(taxonId).filter(function (material) {
          return rollupForMaterial(material, propertyId).observations > 0;
        });
        return '<details class="taxon"' + treeDepthStyle(depth) +
          (open ? " open" : "") + '><summary>' +
          '<span class="node-name">' + escapeHtml(taxon.name) +
            '<small>Category · owns no values</small></span>' +
          '<span class="range">' + escapeHtml(rangeText(propertyId, data)) +
            '<small>derived observed range · synthetic</small></span>' +
          '<span class="counts">' + escapeHtml(countsText(data)) + "</span>" +
          '</summary><div class="node-body">' +
          children.map(function (child) {
            return renderTaxonNode(child.id, propertyId, false, depth + 1);
          }).join("") +
          materials.map(function (material) {
            return renderMaterialNode(material, propertyId, depth + 1);
          }).join("") +
          "</div></details>";
      }

      function renderPropertyOverview(propertyId, scope) {
        var property = Search.getProperty(propertyId);
        var scopedMaterials = materialsUnder(scope ? scope.id : null);
        var overall = rollup(scopedMaterials, propertyId);
        var roots = scope
          ? [scope]
          : corpus.taxa.filter(function (taxon) {
              return !taxon.parent_id && rollupForTaxon(taxon.id, propertyId).observations;
            });
        focusedPropertyId = propertyId;
        returnMode = "overview";
        setRoute("Property overview", scope ? scope.name : "all primary categories");

        var header =
          '<header class="section-head"><div><h1>' + escapeHtml(property.name) +
          '</h1><p>' + (scope ? "Scoped to " + escapeHtml(scope.name) + ". " : "") +
          'Grouped by each material’s primary taxonomy path; not ranked by value.</p></div>' +
          '<div class="section-actions"><button class="action" type="button" data-new-search>New search</button></div></header>';

        if (!overall.observations) {
          view.innerHTML = header +
            '<div class="empty">No observations of this property exist in the selected category.</div>';
          live.textContent = "No " + property.name + " observations in this category.";
          return;
        }

        view.innerHTML = header +
          '<div class="overview-summary"><div><strong>' +
            escapeHtml(rangeText(propertyId, overall)) +
            '</strong><span>Observed corpus span—not a specification, design range, or recommendation.</span>' +
            '<span>' + escapeHtml(coverageText(overall)) + '</span></div>' +
            '<div class="counts">' + escapeHtml(countsText(overall)) + "</div></div>" +
          '<div class="notice"><strong>Expand a category to inspect its subcategories and materials.</strong>' +
            '<p>Ranges use raw observations in canonical units and the primary taxonomy path. Cross-classifications remain context and are not counted twice.</p></div>' +
          '<div class="tree" aria-label="' + escapeHtml(property.name) +
            ' category overview">' + roots.map(function (root) {
              return renderTaxonNode(root.id, propertyId, Boolean(scope), 0);
            }).join("") + "</div>";
        live.textContent = property.name + " overview. " + countsText(overall) + ".";
      }

      function browseMaterialRow(material, depth) {
        var children = statesByMaterial.get(material.id).length;
        return '<div class="browse-material"' + treeDepthStyle(depth) +
          '><strong>' + escapeHtml(material.name) +
          '</strong><span>' + escapeHtml((material.designations || []).join(" · ") ||
            material.identity_kind.replace(/_/g, " ")) + '</span><button class="action" type="button" data-open-entity="' +
            escapeHtml(material.id) + '">' + (children ? "Choose state" : "Open datasheet") +
            "</button></div>";
      }

      function browseTaxonNode(taxonId, open, depth) {
        depth = depth || 0;
        var taxon = taxonById.get(taxonId);
        var materials = directMaterials(taxonId);
        var children = (taxonChildren.get(taxonId) || []).filter(function (child) {
          return materialsUnder(child.id).length > 0;
        });
        var count = materialsUnder(taxonId).length;
        if (!count) return "";
        return '<details class="taxon"' + treeDepthStyle(depth) +
          (open ? " open" : "") + '><summary>' +
          '<span class="node-name">' + escapeHtml(taxon.name) +
            '<small>Category · owns no values</small></span>' +
          '<span class="range">Browse identities<small>primary taxonomy path</small></span>' +
          '<span class="counts">' + plural(count, "material") + '</span></summary>' +
          '<div class="node-body">' +
          children.map(function (child) {
            return browseTaxonNode(child.id, false, depth + 1);
          }).join("") +
          materials.map(function (material) {
            return browseMaterialRow(material, depth + 1);
          }).join("") +
          "</div></details>";
      }

      function renderCategoryBrowse(scope) {
        var materialCount = materialsUnder(scope.id).length;
        returnMode = "category";
        setRoute("Category browse", scope.name);
        var header =
          '<header class="section-head"><div><h1>' + escapeHtml(scope.name) +
          '</h1><p>Navigation category. It owns no representative material and no property values.</p></div>' +
          '<div class="section-actions"><button class="action" type="button" data-new-search>New search</button></div></header>';
        if (!materialCount) {
          view.innerHTML = header +
            '<div class="empty"><strong>0 materials in this synthetic prototype.</strong><br>' +
            'The category is valid; it is intentionally empty so missing coverage does not look like a failed search.</div>';
          live.textContent = scope.name + " category. 0 materials.";
          return;
        }
        view.innerHTML = header +
          '<div class="notice"><strong>Expand subcategories to choose a specific material identity.</strong>' +
          '<p>Or add a precise property to the query, such as “' +
          escapeHtml(scope.name.toLowerCase()) + ' tensile strength,” for a scoped overview.</p></div>' +
          '<div class="tree">' + browseTaxonNode(scope.id, true, 0) + "</div>";
        live.textContent = scope.name + " category. " +
          plural(materialCount, "material identity", "material identities") + ".";
      }

      function renderMatches(value) {
        var items = (value.results || []).slice(0, 12);
        setRoute(plural(value.total, "material match"), value.property_intent
          ? "property saved: " + value.property_intent.label
          : "choose one exact identity");
        if (!items.length) {
          renderNoMatch(value);
          return;
        }
        view.innerHTML =
          '<div class="notice"><strong>Choose one material identity.</strong>' +
          '<p>Values remain inside its datasheet. Refine the query for a direct open.</p></div>' +
          '<div class="match-list" role="listbox" aria-label="Material matches">' +
          items.map(function (entity, index) {
            return '<button class="match" type="button" role="option" id="match-' +
              index + '" data-open-entity="' + escapeHtml(entity.id) +
              (value.property_intent && value.property_intent.kind === "property"
                ? '" data-open-property="' + escapeHtml(value.property_intent.id)
                : "") + '">' +
              '<span><strong>' + escapeHtml(entity.name) + '</strong><small>' +
                escapeHtml(displayId(entity)) + "</small></span>" +
              '<span class="match-context">' + escapeHtml(Search.entityContext(entity)) + "</span>" +
              '<span class="open-label">' +
                (entity.kind === "material" && entity.state_count ? "Choose state" : "Open datasheet") +
                " →</span></button>";
          }).join("") + "</div>";
        live.textContent = plural(value.total, "material match") + ".";
      }

      function recordPath(entity) {
        var material = materialById.get(entity.material_id);
        var lineage = taxonLineage(primaryTaxonId(material)).reverse();
        return '<nav class="context breadcrumb" aria-label="Material category path">' +
          lineage.map(function (taxon, index) {
            return (index
              ? '<span class="breadcrumb-separator" aria-hidden="true">›</span>'
              : "") +
              '<button class="breadcrumb-node" type="button" data-browse-taxon="' +
              escapeHtml(taxon.id) + '" aria-label="Browse ' +
              escapeHtml(taxon.name) + '">' + escapeHtml(taxon.name) + "</button>";
          }).join("") + "</nav>";
      }

      function renderPropertySections(observations) {
        var groups = new Map();
        observations.forEach(function (item) {
          if (!groups.has(item.property_id)) groups.set(item.property_id, []);
          groups.get(item.property_id).push(item);
        });
        var ids = Array.from(groups.keys()).sort(function (a, b) {
          return (propertyOrder.get(a) || 0) - (propertyOrder.get(b) || 0);
        });
        return ids.map(function (id) {
          var property = Search.getProperty(id);
          var items = groups.get(id);
          return '<section class="property-section"><div class="property-heading"><h2>' +
            escapeHtml(property ? property.name : id) + '</h2><span>' +
            plural(items.length, "observation") + "</span></div>" +
            items.map(renderObservation).join("") + "</section>";
        }).join("");
      }

      function renderDatasheet() {
        if (!selectedEntity) return;
        var material = materialById.get(selectedEntity.material_id);
        var observations = Search.getObservations(selectedEntity);
        var children = Search.getStateChildren(selectedEntity);
        var focusProperty = focusedPropertyId ? Search.getProperty(focusedPropertyId) : null;
        var visible = focusProperty && !showAllProperties
          ? observations.filter(function (item) {
              return item.property_id === focusedPropertyId;
            })
          : observations;
        var other = otherClassification(material);
        setRoute(focusProperty && !showAllProperties
          ? "Property-focused datasheet"
          : "Complete material datasheet", selectedEntity.name);

        var header =
          '<header class="section-head"><div>' + recordPath(selectedEntity) + '<h1>' +
            escapeHtml(selectedEntity.name) + '</h1><p>' +
            escapeHtml(displayId(selectedEntity)) + " · " +
            escapeHtml(selectedEntity.kind === "state" ? "named material state" : "material identity") +
          '</p></div><div class="section-actions">' +
            (returnMode === "overview"
              ? '<button class="action" type="button" data-return-overview>Back to overview</button>'
              : "") +
            '<button class="action" type="button" data-new-search>New search</button></div></header>' +
          '<div class="record-meta">' + escapeHtml(material.notes || "No identity note.") +
            (other.length ? "<br>Other classification: " +
              escapeHtml(other.join(" · ")) +
              ". Context only; not part of the primary browse count." : "") + "</div>";

        if (!observations.length && children.length) {
          var stateRows = children.map(function (child) {
            var available = focusedPropertyId
              ? Search.getAvailability(child, [focusedPropertyId])[focusedPropertyId] || 0
              : child.observation_count;
            return '<button class="state-choice" type="button" data-state-choice="' +
              escapeHtml(child.id) + '"><strong>' + escapeHtml(child.label) +
              '</strong><span>' + (focusProperty
                ? plural(available, focusProperty.name + " observation")
                : plural(available, "observation")) +
              '</span><span class="open-label">Open state →</span></button>';
          }).join("");
          view.innerHTML = header +
            '<div class="notice"><strong>This material identity has no direct property values.</strong>' +
            '<p>Its named states are separate lookup records because condition changes the observations. Choose one state.</p></div>' +
            '<div class="state-chooser">' + stateRows + "</div>";
          live.textContent = selectedEntity.name + ". Choose one named state.";
          return;
        }

        var focusBar = "";
        if (focusProperty) {
          focusBar =
            '<div class="focus-bar"><div><strong>' +
              escapeHtml(showAllProperties ? "All properties" : focusProperty.name) +
              '</strong><span> · ' + (showAllProperties
                ? "focused property retained"
                : "query-focused view") +
              '</span></div><button class="action primary" type="button" data-toggle-all aria-pressed="' +
              String(showAllProperties) + '">' +
              (showAllProperties ? "Show focused property only" : "Show all properties") +
              "</button></div>";
        }

        var sections = renderPropertySections(visible);
        if (!sections) {
          sections = '<div class="empty">No ' +
            escapeHtml(focusProperty ? focusProperty.name : "property observations") +
            " are attached to this exact record." +
            (focusProperty ? " Use “Show all properties” to inspect what is available." : "") +
            "</div>";
        }

        var childSection = "";
        if (children.length) {
          childSection =
            '<div class="notice"><strong>Named states also exist for this identity.</strong>' +
            '<div class="choices">' + children.map(function (child) {
              return '<button class="choice" type="button" data-state-choice="' +
                escapeHtml(child.id) + '">' + escapeHtml(child.label) + "</button>";
            }).join("") + "</div></div>";
        }

        view.innerHTML = header + focusBar + sections + childSection;
        live.textContent = (focusProperty && !showAllProperties
          ? focusProperty.name + " for "
          : "Complete datasheet for ") + selectedEntity.name + ".";
      }

      function openEntity(id, propertyId, fromOverview) {
        selectedEntity = Search.getEntity(id);
        if (!selectedEntity) return;
        focusedPropertyId = propertyId || null;
        showAllProperties = false;
        if (fromOverview) returnMode = "overview";
        renderDatasheet();
        window.scrollTo(0, 0);
      }

      function routeSearch() {
        var options = {};
        if (overridePropertyId) options.propertyId = overridePropertyId;
        if (overrideScopeId) options.scopeId = overrideScopeId;
        analysis = Search.search(queryInput.value, options);
        timing.textContent = "search " + analysis.duration_ms.toFixed(2) + " ms";
        clearButton.hidden = !queryInput.value;
        selectedEntity = null;
        focusedPropertyId = null;
        returnMode = null;

        if (analysis.state === "idle") {
          renderIdle();
          return;
        }
        if (analysis.state === "unsupported-comparison") {
          renderUnsupportedComparison();
          return;
        }
        if (analysis.state === "choose-scope") {
          renderScopeChoice(analysis);
          return;
        }
        if (analysis.property_intent && analysis.property_intent.kind === "group") {
          renderPropertyChoice(analysis);
          return;
        }
        if (analysis.property_intent && analysis.property_intent.kind === "property" &&
            !analysis.material_terms) {
          renderPropertyOverview(analysis.property_intent.id, analysis.scope);
          return;
        }

        var exact = exactEntity(analysis);
        if (exact) {
          selectedEntity = exact;
          focusedPropertyId = analysis.property_intent &&
            analysis.property_intent.kind === "property"
            ? analysis.property_intent.id
            : null;
          renderDatasheet();
          return;
        }

        if (analysis.state === "browse-scope" && analysis.scope) {
          renderCategoryBrowse(analysis.scope);
          return;
        }
        if (analysis.state === "no-match") {
          renderNoMatch(analysis);
          return;
        }
        renderMatches(analysis);
      }

      queryInput.addEventListener("input", function () {
        overridePropertyId = null;
        overrideScopeId = null;
        showAllProperties = false;
        routeSearch();
      });

      queryInput.addEventListener("keydown", function (event) {
        if (event.key === "ArrowDown") {
          var first = view.querySelector(".match, .choice, summary");
          if (first) {
            event.preventDefault();
            first.focus();
          }
        } else if (event.key === "Escape" && queryInput.value) {
          event.preventDefault();
          setQuery("");
        }
      });

      document.getElementById("search-form").addEventListener("submit", function (event) {
        event.preventDefault();
        var first = view.querySelector(".match, .choice");
        if (first) first.click();
      });

      clearButton.addEventListener("click", function () {
        setQuery("");
      });

      document.addEventListener("click", function (event) {
        var queryButton = event.target.closest("[data-query]");
        if (queryButton) {
          setQuery(queryButton.getAttribute("data-query"));
          return;
        }

        var breadcrumbButton = event.target.closest("[data-browse-taxon]");
        if (breadcrumbButton) {
          var breadcrumbTaxon = Search.getTaxon(
            breadcrumbButton.getAttribute("data-browse-taxon")
          );
          if (breadcrumbTaxon) setQuery(breadcrumbTaxon.name);
          return;
        }

        var propertyChoice = event.target.closest("[data-property-choice]");
        if (propertyChoice) {
          overridePropertyId = propertyChoice.getAttribute("data-property-choice");
          routeSearch();
          return;
        }

        var scopeChoice = event.target.closest("[data-scope-choice]");
        if (scopeChoice) {
          overrideScopeId = scopeChoice.getAttribute("data-scope-choice");
          routeSearch();
          return;
        }

        var openButton = event.target.closest("[data-open-entity]");
        if (openButton) {
          event.preventDefault();
          event.stopPropagation();
          openEntity(
            openButton.getAttribute("data-open-entity"),
            openButton.getAttribute("data-open-property"),
            Boolean(openButton.getAttribute("data-open-property"))
          );
          return;
        }

        var stateChoice = event.target.closest("[data-state-choice]");
        if (stateChoice) {
          openEntity(
            stateChoice.getAttribute("data-state-choice"),
            focusedPropertyId,
            returnMode === "overview"
          );
          return;
        }

        if (event.target.closest("[data-toggle-all]")) {
          showAllProperties = !showAllProperties;
          renderDatasheet();
          return;
        }

        if (event.target.closest("[data-return-overview]")) {
          renderPropertyOverview(focusedPropertyId, analysis.scope);
          return;
        }

        if (event.target.closest("[data-new-search]")) {
          setQuery("");
        }
      });

      view.addEventListener("keydown", function (event) {
        var rows = Array.prototype.slice.call(view.querySelectorAll(
          ".match, .state-choice, .choice, .action"
        ));
        var index = rows.indexOf(document.activeElement);
        if (index < 0 || (event.key !== "ArrowDown" && event.key !== "ArrowUp")) return;
        event.preventDefault();
        var delta = event.key === "ArrowDown" ? 1 : -1;
        rows[(index + delta + rows.length) % rows.length].focus();
      });

      document.addEventListener("keydown", function (event) {
        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") {
          event.preventDefault();
          queryInput.focus();
          queryInput.select();
        }
        if (event.key === "/" && !/input|textarea|select/i.test(document.activeElement.tagName)) {
          event.preventDefault();
          queryInput.focus();
        }
      });

      routeSearch();
    })();
  </script>
</body>
</html>

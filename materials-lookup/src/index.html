<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="/manifest.json">
  <!-- Google Analytics. Baked into the template so a rebuild cannot silently
       drop it; catalog-derived tags are added afterwards by
       scripts/inject_seo_meta.py. -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YG3SBRRZFZ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-YG3SBRRZFZ');
  </script>
  <meta name="description" content="Look up a material and read its measured properties with the source behind every value. 222 grades, 1,593 observations, metric or imperial.">
  <meta name="theme-color" content="#ffffff">
  <title>Materials</title>
  <script>
    try {
      const theme = localStorage.getItem('materials.theme.v1');
      document.documentElement.dataset.theme = ['light', 'dark'].includes(theme) ? theme : 'system';
    } catch { document.documentElement.dataset.theme = 'system'; }
  </script>
  <script src="../../shared/json-ld.js" defer></script>
  <link rel="stylesheet" href="assets/{{BUILD_ID}}/app.css">
  <link rel="preload" href="{{DATA_PATH}}/index.json" as="fetch" crossorigin>
  <script type="module" src="assets/{{BUILD_ID}}/app.mjs"></script>
</head>
<body data-build="{{BUILD_ID}}" data-path="{{DATA_PATH}}">
  <a class="skip-link" href="#query">Skip to search</a>
  <header class="topbar">
    <nav class="brand-links" aria-label="Tools navigation"><a href="../../">Tools</a><a class="brand" href="./">Materials</a></nav>
    <div class="build-meta">
      <b>{{MATERIAL_COUNT}} materials</b>
      <span>{{OBSERVATION_COUNT}} values</span>
      <a href="?view=sources">Sources</a>
      <label><span class="sr-only">Units</span><select id="unit-system" title="Display values in metric or imperial units. Changing this resets property unit overrides."><option value="metric">Metric</option><option value="imperial">Imperial</option></select></label>
      <details class="settings" id="settings">
        <summary>Settings</summary>
        <div class="settings-panel"><label for="theme">Theme</label><select id="theme" title="Use a light or dark theme, or follow your system setting."><option value="system">Auto</option><option value="light">Light</option><option value="dark">Dark</option></select></div>
      </details>
    </div>
  </header>
  <main>
    <form class="search" id="search-form" role="search">
      <label class="sr-only" for="query">Search a material or property</label>
      <input id="query" type="search" autocomplete="off" spellcheck="false" placeholder="Material or property: try 6061-T6 or tensile strength" title="Search a grade, named state, property, or category plus property." aria-controls="view" autofocus>
      <button id="clear-search" type="button" aria-label="Clear search" hidden>×</button>
    </form>
    <div class="routebar"><span id="route-label">Loading…</span><span class="timing" id="timing"></span></div>
    <section id="view" aria-label="Lookup results" aria-busy="true"></section>
    <p class="sr-only" id="live" role="status" aria-live="polite"></p>
    <noscript><p>JavaScript is required for search. Download <a href="{{DATA_PATH}}/catalog.json">JSON</a> or <a href="{{DATA_PATH}}/observations.csv">CSV</a>.</p></noscript>
  </main>
  <footer><button class="copy-link" id="copy-link" type="button" data-track="export" title="Copy a link to this material, property, or search.">Copy link</button><span class="footer-links"><a href="{{DATA_PATH}}/catalog.json" download>JSON</a><a href="{{DATA_PATH}}/observations.csv" download>CSV</a><a href="data-license.txt">Data license</a></span></footer>
</body>
</html>

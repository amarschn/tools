<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Materials — compact index prototype</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #171717;
      --muted: #666;
      --faint: #858585;
      --line: #d5d5d5;
      --soft: #f5f5f5;
      --blue: #075ea8;
      --blue-soft: #eef6fc;
      --max: 1180px;
    }

    * { box-sizing: border-box; }

    html {
      min-width: 300px;
      background: #fff;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      font-size: 14px;
    }

    body { margin: 0; }
    button, input { font: inherit; }
    button, a { color: inherit; }

    :focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 1px;
    }

    .skip-link {
      position: fixed;
      z-index: 10;
      top: 4px;
      left: 4px;
      padding: 7px 9px;
      background: #fff;
      border: 1px solid var(--blue);
      transform: translateY(-150%);
    }

    .skip-link:focus { transform: none; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .topbar {
      min-height: 48px;
      display: grid;
      grid-template-columns: 132px minmax(240px, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 6px max(12px, calc((100vw - var(--max)) / 2));
      border-bottom: 1px solid #aaa;
      background: #fff;
    }

    .brand {
      color: #111;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
    }

    .search {
      height: 34px;
      display: grid;
      grid-template-columns: 1fr auto;
      border: 1px solid #888;
      background: #fff;
    }

    .search:focus-within {
      border-color: var(--blue);
      box-shadow: 0 0 0 1px var(--blue);
    }

    .search input {
      min-width: 0;
      height: 32px;
      padding: 0 9px;
      border: 0;
      outline: 0;
      color: #111;
      background: transparent;
    }

    .search input::-webkit-search-cancel-button {
      appearance: none;
      -webkit-appearance: none;
    }

    .search button {
      min-width: 34px;
      border: 0;
      border-left: 1px solid var(--line);
      background: var(--soft);
      cursor: pointer;
    }

    .search button[hidden] { display: none; }

    .meta {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .meta b {
      color: #333;
      font-weight: 600;
    }

    .warning {
      padding: 5px max(12px, calc((100vw - var(--max)) / 2));
      border-bottom: 1px solid var(--line);
      color: #4c4c4c;
      background: var(--soft);
      font-size: 12px;
    }

    main {
      width: min(100%, var(--max));
      margin: 0 auto;
      padding: 0 12px 36px;
    }

    .status {
      min-height: 43px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--line);
    }

    .status-copy {
      min-width: 0;
      padding: 8px 0;
    }

    .status-copy strong {
      font-size: 14px;
      font-weight: 650;
    }

    .status-copy span { color: var(--muted); }

    .timing {
      color: var(--faint);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      font-size: 12px;
    }

    .notice {
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
      line-height: 1.45;
    }

    .notice strong { font-weight: 650; }
    .notice p { margin: 2px 0 0; color: var(--muted); }

    .choices {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 7px;
    }

    .choice, .small-action {
      min-height: 29px;
      padding: 4px 8px;
      border: 1px solid #aaa;
      border-radius: 2px;
      color: #222;
      background: #fff;
      cursor: pointer;
    }

    .choice:hover, .small-action:hover {
      border-color: var(--blue);
      color: var(--blue);
    }

    .choice[aria-pressed="true"] {
      border-color: var(--blue);
      color: #064e89;
      background: var(--blue-soft);
    }

    .table-head, .row {
      display: grid;
      grid-template-columns: minmax(210px, 2.1fr) 105px minmax(130px, 1.1fr) minmax(130px, .9fr);
      align-items: center;
      column-gap: 12px;
    }

    .table-head {
      min-height: 31px;
      border-bottom: 1px solid #aaa;
      color: var(--faint);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: .025em;
      text-transform: uppercase;
    }

    #results {
      border-bottom: 1px solid #aaa;
    }

    .row {
      width: 100%;
      min-height: 48px;
      padding: 5px 0;
      border: 0;
      border-bottom: 1px solid #e3e3e3;
      color: var(--ink);
      background: #fff;
      text-align: left;
      cursor: pointer;
    }

    .row:last-child { border-bottom: 0; }
    .row:hover, .row[aria-expanded="true"] { background: var(--soft); }
    .row[aria-selected="true"] { box-shadow: inset 3px 0 var(--blue); }

    .name {
      min-width: 0;
      padding-left: 7px;
    }

    .name strong, .name small {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .name strong {
      color: #111;
      font-size: 14px;
      font-weight: 650;
    }

    .name small {
      margin-top: 1px;
      color: var(--muted);
      font-size: 11px;
    }

    .cell {
      min-width: 0;
      overflow: hidden;
      color: #4e4e4e;
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .kind {
      color: #333;
      font-weight: 600;
    }

    .detail {
      margin: 0;
      padding: 12px 10px 14px;
      border-bottom: 1px solid #aaa;
      background: #fafafa;
    }

    .detail-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 9px;
    }

    .detail h2 {
      margin: 0;
      font-size: 17px;
      line-height: 1.25;
    }

    .detail-head p, .detail-note {
      margin: 3px 0 0;
      color: var(--muted);
      line-height: 1.4;
    }

    .observation {
      display: grid;
      grid-template-columns: minmax(170px, 1.4fr) 120px minmax(170px, 1.2fr) minmax(190px, 1.2fr);
      gap: 12px;
      padding: 7px 0;
      border-top: 1px solid #ddd;
      font-size: 12px;
    }

    .observation strong {
      color: #111;
      font-weight: 650;
    }

    .observation .value {
      color: #111;
      font-variant-numeric: tabular-nums;
      font-weight: 650;
    }

    .observation span {
      min-width: 0;
      overflow-wrap: anywhere;
      color: var(--muted);
    }

    .empty {
      padding: 18px 0;
      border-bottom: 1px solid #aaa;
      color: var(--muted);
    }

    footer {
      width: min(100%, var(--max));
      margin: 0 auto;
      padding: 9px 12px 18px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--faint);
      font-size: 11px;
    }

    @media (max-width: 760px) {
      .topbar {
        grid-template-columns: 1fr auto;
        gap: 6px 10px;
      }

      .search {
        grid-column: 1 / -1;
        grid-row: 2;
      }

      .meta { font-size: 11px; }
      .table-head, .row { grid-template-columns: minmax(160px, 1.7fr) 88px minmax(105px, 1fr); }
      .table-head > :nth-child(3), .row > :nth-child(3) { display: none; }
      .observation { grid-template-columns: minmax(140px, 1fr) 105px minmax(160px, 1fr); }
      .observation > :last-child { grid-column: 1 / -1; }
    }

    @media (max-width: 480px) {
      .meta .wide-meta { display: none; }
      .status { align-items: flex-start; }
      .table-head, .row { grid-template-columns: minmax(155px, 1fr) 105px; }
      .table-head > :nth-child(2), .row > :nth-child(2) { display: none; }
      .observation { grid-template-columns: 1fr auto; gap: 3px 10px; }
      .observation > :nth-child(3), .observation > :last-child { grid-column: 1 / -1; }
      footer { display: block; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#query">Skip to search</a>

  <header class="topbar">
    <a class="brand" href="./01-compact-index.html">Materials</a>
    <form class="search" id="search-form" role="search">
      <input id="query" type="search" autocomplete="off" spellcheck="false"
        placeholder="Material, designation, category, or property" aria-controls="results" autofocus>
      <button id="clear" type="button" aria-label="Clear search" hidden>×</button>
    </form>
    <div class="meta" aria-label="Index metadata">
      <b id="record-count">— records</b>
      <span>·</span>
      <span id="version">v—</span>
      <span class="wide-meta">· compact index</span>
    </div>
  </header>

  <div class="warning" id="warning">Synthetic test data only — never use these values for engineering work.</div>

  <main>
    <div class="status">
      <div class="status-copy" id="status-copy"><strong>Opening fixture…</strong></div>
      <span class="timing" id="timing">search — ms</span>
    </div>
    <div id="notice" hidden></div>

    <div class="table-head" aria-hidden="true">
      <span>Material identity</span>
      <span>Type</span>
      <span>Category / parent</span>
      <span>Available data</span>
    </div>
    <div id="results" role="listbox" aria-label="Material lookup results"></div>
    <section class="detail" id="detail" aria-live="polite" hidden></section>
    <p id="live" class="sr-only" role="status" aria-live="polite"></p>
  </main>

  <footer>
    <span>Lookup only. No material ranking or comparison.</span>
    <span id="build">build —</span>
  </footer>

  <script src="./assets/synthetic-corpus.js"></script>
  <script src="./assets/search-core.js"></script>
  <script>
    (function () {
      "use strict";

      var api = window.MaterialsPrototypeSearch;
      var corpus = api.corpus;
      var input = document.getElementById("query");
      var clear = document.getElementById("clear");
      var results = document.getElementById("results");
      var statusCopy = document.getElementById("status-copy");
      var timing = document.getElementById("timing");
      var notice = document.getElementById("notice");
      var detail = document.getElementById("detail");
      var live = document.getElementById("live");
      var selectedPropertyId = null;
      var selectedEntityId = null;
      var activeIndex = -1;
      var analysis = null;

      document.getElementById("record-count").textContent =
        api.stats.lookup_record_count + " records";
      document.getElementById("version").textContent =
        "v" + corpus.corpus_version.replace(/^synthetic-/, "");
      document.getElementById("build").textContent = corpus.build_version;
      document.getElementById("warning").textContent =
        "Synthetic test data only — " + corpus.warning;

      function escapeHtml(value) {
        return String(value == null ? "" : value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function displayId(entity) {
        var material = api.getMaterial(entity.material_id);
        var values = entity.kind === "state"
          ? (entity.designations || [])
          : (material && material.designations || []);
        return values.length ? values.slice(0, 2).join(" · ") : entity.id.replace(/^synthetic-/, "");
      }

      function propertyButtons(intent) {
        if (!intent) return "";
        var ids = intent.ids || [];
        return '<div class="choices" aria-label="Choose a property">' +
          ids.map(function (id) {
            var property = api.getProperty(id);
            if (!property) return "";
            return '<button class="choice" type="button" data-property="' + escapeHtml(id) +
              '" aria-pressed="' + String(selectedPropertyId === id) + '">' +
              escapeHtml(property.name) + "</button>";
          }).join("") +
        "</div>";
      }

      function setNotice(html) {
        notice.hidden = !html;
        notice.className = html ? "notice" : "";
        notice.innerHTML = html || "";
      }

      function displayedResults(value) {
        if (value.state === "unsupported-comparison" || value.state === "no-match" ||
            value.state === "choose-scope") return [];
        if (value.state === "needs-material") return api.search("").results;
        return value.results || [];
      }

      function renderStatus(value, shown) {
        var message;
        var secondary = "";

        if (value.state === "idle") {
          message = "Material directory";
          secondary = " · type to narrow " + api.stats.material_count + " identities";
          setNotice("");
        } else if (value.state === "unsupported-comparison") {
          message = "Comparison is not available";
          secondary = " · look up one material at a time";
          setNotice(
            "<strong>This tool does not rank, recommend, or compare materials.</strong>" +
            "<p>Search for one material, designation, or category. Values only appear inside one selected record.</p>" +
            '<div class="choices"><button class="choice" type="button" data-query="plastic">Browse plastics</button>' +
            '<button class="choice" type="button" data-query="Synal AX60">Look up Synal AX60</button></div>'
          );
        } else if (value.state === "choose-scope") {
          message = "Category is ambiguous";
          secondary = " · choose a scope";
          setNotice(
            "<strong>That term names more than one category.</strong>" +
            '<div class="choices">' + value.scope_options.map(function (scope) {
              return '<button class="choice" type="button" data-query="' +
                escapeHtml(scope.name) + '">' + escapeHtml(scope.name) + "</button>";
            }).join("") + "</div>"
          );
        } else if (value.state === "needs-material") {
          message = "Choose a material";
          secondary = " · " + value.property_intent.label + " is a property, not a material";
          setNotice(
            "<strong>" + escapeHtml(value.property_intent.label) + " needs a material identity.</strong>" +
            "<p>The alphabetical directory is shown below. Refine the query with a material name; values are not ranked across materials.</p>"
          );
        } else if (value.state === "choose-property") {
          message = "Choose what “" + value.property_intent.label.toLowerCase() + "” means";
          secondary = value.scope ? " · within " + value.scope.name : "";
          setNotice(
            "<strong>“" + escapeHtml(value.property_intent.label) + "” is a group, not one measured property.</strong>" +
            "<p>Select the intended property before opening a value. The rows show availability, not a ranking.</p>" +
            propertyButtons(value.property_intent)
          );
        } else if (value.state === "browse-scope") {
          message = value.scope.name;
          secondary = " · category, not a material";
          setNotice(
            "<strong>" + escapeHtml(value.scope.name) + " is a navigation category.</strong>" +
            "<p>It has " + api.getTaxonRecordCount(value.scope.id) +
            " data-bearing lookup records. Categories never carry fabricated representative values.</p>"
          );
        } else if (value.state === "no-match") {
          message = "No material identity matched";
          secondary = " · “" + value.query.trim() + "”";
          setNotice(
            "<strong>Nothing in the synthetic fixture matches that identity.</strong>" +
            "<p>Try a shorter designation, a category such as plastic, or a material such as NylonDemo N6.</p>" +
            '<div class="choices"><button class="choice" type="button" data-query="NylonDemo N6">NylonDemo N6</button>' +
            '<button class="choice" type="button" data-query="engineering plastics">Engineering plastics</button></div>'
          );
        } else {
          message = value.total + (value.total === 1 ? " match" : " matches");
          if (value.scope) secondary += " · " + value.scope.name;
          if (value.property_intent) secondary += " · " + value.property_intent.label;
          setNotice("");
        }

        statusCopy.innerHTML =
          "<strong>" + escapeHtml(message) + "</strong><span>" + escapeHtml(secondary) + "</span>";
        timing.textContent = "search " + value.duration_ms.toFixed(2) + " ms";
        live.textContent = message + (shown.length ? ". " + shown.length + " rows shown." : ".");
      }

      function availabilityText(entity, value) {
        if (value.property_intent) {
          var counts = api.getAvailability(entity, value.property_intent.ids);
          var count = value.property_intent.ids.reduce(function (sum, id) {
            return sum + (counts[id] || 0);
          }, 0);
          return count
            ? count + " matching observation" + (count === 1 ? "" : "s")
            : "No matching observation";
        }
        if (entity.kind === "material" && !entity.has_direct_data && entity.state_count) {
          return entity.state_count + " named state" + (entity.state_count === 1 ? "" : "s");
        }
        return entity.observation_count + " observation" +
          (entity.observation_count === 1 ? "" : "s");
      }

      function renderRows(value) {
        var shown = displayedResults(value);
        renderStatus(value, shown);
        activeIndex = -1;

        if (!shown.length) {
          results.innerHTML = '<div class="empty">No rows to show for this query.</div>';
          return;
        }

        results.innerHTML = shown.map(function (entity, index) {
          var context = entity.kind === "state"
            ? entity.parent_name
            : (entity.taxon_names[0] || "Unclassified");
          return '<button class="row" type="button" role="option" id="result-' + index +
            '" data-entity="' + escapeHtml(entity.id) + '" aria-selected="false" aria-expanded="' +
            String(selectedEntityId === entity.id) + '">' +
            '<span class="name"><strong>' + escapeHtml(entity.name) + '</strong><small>' +
              escapeHtml(displayId(entity)) + "</small></span>" +
            '<span class="cell kind">' + (entity.kind === "state" ? "Named state" : "Material") + "</span>" +
            '<span class="cell">' + escapeHtml(context) + "</span>" +
            '<span class="cell">' + escapeHtml(availabilityText(entity, value)) + "</span>" +
          "</button>";
        }).join("");
      }

      function relevantObservations(entity) {
        var observations = api.getObservations(entity);
        var intent = analysis && analysis.property_intent;
        if (!intent) return observations;
        var ids = selectedPropertyId ? [selectedPropertyId] : intent.ids;
        return observations.filter(function (item) {
          return ids.indexOf(item.property_id) !== -1;
        });
      }

      function renderDetail(entity) {
        selectedEntityId = entity.id;
        Array.prototype.forEach.call(results.querySelectorAll(".row"), function (row) {
          var selected = row.getAttribute("data-entity") === entity.id;
          row.setAttribute("aria-selected", String(selected));
          row.setAttribute("aria-expanded", String(selected));
        });

        var observations = relevantObservations(entity);
        var children = api.getStateChildren(entity);
        var intent = analysis && analysis.property_intent;
        var unresolvedGroup = intent && intent.kind === "group" && !selectedPropertyId;
        var header =
          '<div class="detail-head"><div><h2>' + escapeHtml(entity.name) + '</h2><p>' +
          escapeHtml(api.entityContext(entity)) + " · " + escapeHtml(displayId(entity)) +
          '</p></div><button class="small-action" type="button" data-close-detail>Close</button></div>';

        if (unresolvedGroup) {
          detail.innerHTML = header +
            '<p class="detail-note">Choose the intended “' + escapeHtml(intent.label.toLowerCase()) +
            '” property before viewing a number.</p>' + propertyButtons(intent);
        } else if (!observations.length && children.length) {
          detail.innerHTML = header +
            '<p class="detail-note">This identity has no direct property values. Choose a named state:</p>' +
            '<div class="choices">' + children.map(function (child) {
              return '<button class="choice" type="button" data-state="' +
                escapeHtml(child.id) + '">' + escapeHtml(child.label) + " · " +
                child.observation_count + " observations</button>";
            }).join("") + "</div>";
        } else if (!observations.length) {
          detail.innerHTML = header +
            '<p class="detail-note">No observation for the requested property is attached to this exact identity.</p>';
        } else {
          detail.innerHTML = header + observations.map(function (item) {
            var property = api.getProperty(item.property_id);
            return '<div class="observation">' +
              "<strong>" + escapeHtml(property ? property.name : item.property_id) + "</strong>" +
              '<span class="value">' + escapeHtml(api.formatObservation(item)) + "</span>" +
              "<span>" + escapeHtml(api.conditionSummary(item)) + " · " +
                escapeHtml(item.basis.replace(/_/g, " ")) + "</span>" +
              "<span>" + escapeHtml(item.source_id) + " · " +
                escapeHtml(item.source_locator) + "</span>" +
            "</div>";
          }).join("");
        }

        detail.hidden = false;
      }

      function runSearch() {
        analysis = api.search(input.value, selectedPropertyId
          ? { propertyId: selectedPropertyId }
          : undefined);
        clear.hidden = !input.value;
        selectedEntityId = null;
        detail.hidden = true;
        renderRows(analysis);
      }

      function setQuery(value) {
        input.value = value;
        selectedPropertyId = null;
        runSearch();
        input.focus();
      }

      input.addEventListener("input", function () {
        selectedPropertyId = null;
        runSearch();
      });

      input.addEventListener("keydown", function (event) {
        if (event.key === "ArrowDown") {
          var first = results.querySelector(".row");
          if (first) {
            event.preventDefault();
            first.focus();
          }
        } else if (event.key === "Escape" && input.value) {
          event.preventDefault();
          setQuery("");
        }
      });

      document.getElementById("search-form").addEventListener("submit", function (event) {
        event.preventDefault();
        var first = results.querySelector(".row");
        if (first) first.click();
      });

      clear.addEventListener("click", function () { setQuery(""); });

      document.addEventListener("click", function (event) {
        var queryButton = event.target.closest("[data-query]");
        if (queryButton) {
          setQuery(queryButton.getAttribute("data-query"));
          return;
        }

        var propertyButton = event.target.closest("[data-property]");
        if (propertyButton) {
          selectedPropertyId = propertyButton.getAttribute("data-property");
          analysis = api.search(input.value, { propertyId: selectedPropertyId });
          renderRows(analysis);
          if (selectedEntityId) {
            var selected = api.getEntity(selectedEntityId);
            if (selected) renderDetail(selected);
          }
          return;
        }

        var stateButton = event.target.closest("[data-state]");
        if (stateButton) {
          var stateEntity = api.getEntity(stateButton.getAttribute("data-state"));
          if (stateEntity) renderDetail(stateEntity);
          return;
        }

        if (event.target.closest("[data-close-detail]")) {
          selectedEntityId = null;
          detail.hidden = true;
          renderRows(analysis);
          return;
        }

        var row = event.target.closest(".row");
        if (row) {
          var entity = api.getEntity(row.getAttribute("data-entity"));
          if (entity) renderDetail(entity);
        }
      });

      results.addEventListener("keydown", function (event) {
        var rows = Array.prototype.slice.call(results.querySelectorAll(".row"));
        var index = rows.indexOf(document.activeElement);
        if (index < 0) return;
        if (event.key === "ArrowDown" || event.key === "ArrowUp") {
          event.preventDefault();
          var delta = event.key === "ArrowDown" ? 1 : -1;
          rows[(index + delta + rows.length) % rows.length].focus();
        } else if (event.key === "Escape") {
          event.preventDefault();
          input.focus();
        }
      });

      document.addEventListener("keydown", function (event) {
        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") {
          event.preventDefault();
          input.focus();
          input.select();
        }
        if (event.key === "/" && !/input|textarea|select/i.test(document.activeElement.tagName)) {
          event.preventDefault();
          input.focus();
        }
      });

      runSearch();
    })();
  </script>
</body>
</html>

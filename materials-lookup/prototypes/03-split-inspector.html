<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Materials lookup · split inspector prototype</title>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f5f6f7;
      --surface-active: #eceff2;
      --text: #17191c;
      --muted: #656a72;
      --quiet: #898e95;
      --line: #d8dce0;
      --line-strong: #aeb4bb;
      --focus: #235f9c;
      --focus-soft: #e8f0f8;
      --warning: #f1efe9;
      --header-height: 42px;
      --warning-height: 28px;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-width: 300px;
      font-size: 14px;
      line-height: 1.4;
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .app-header {
      height: var(--header-height);
      padding: 0 14px;
      border-bottom: 1px solid #2b2e32;
      background: #202226;
      color: #f7f7f7;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      white-space: nowrap;
    }

    .product-name {
      min-width: 0;
      font-weight: 650;
      letter-spacing: -0.01em;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .product-name span {
      margin-left: 8px;
      color: #b9bdc2;
      font-weight: 450;
    }

    .build-meta {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 14px;
      color: #c7cbd0;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .build-meta code {
      color: #ffffff;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 11px;
    }

    .synthetic-warning {
      min-height: var(--warning-height);
      padding: 5px 14px;
      border-bottom: 1px solid #d6d1c7;
      background: var(--warning);
      color: #4d4941;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      font-size: 12px;
    }

    .synthetic-warning strong {
      color: #24211d;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.055em;
      font-size: 10px;
    }

    .workspace {
      height: calc(100vh - var(--header-height) - var(--warning-height));
      height: calc(100dvh - var(--header-height) - var(--warning-height));
      display: grid;
      grid-template-columns: minmax(320px, 35%) minmax(0, 65%);
      overflow: hidden;
    }

    .search-pane {
      min-width: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--line-strong);
      background: var(--surface);
    }

    .query-area {
      padding: 10px;
      border-bottom: 1px solid var(--line);
      background: var(--bg);
    }

    .query-shell {
      height: 38px;
      display: flex;
      align-items: center;
      border: 1px solid var(--line-strong);
      background: var(--bg);
    }

    .query-shell:focus-within {
      border-color: var(--focus);
      outline: 2px solid rgba(35, 95, 156, 0.16);
      outline-offset: -1px;
    }

    .search-mark {
      width: 36px;
      color: var(--muted);
      text-align: center;
      font-size: 15px;
      flex: 0 0 auto;
    }

    #material-query {
      width: 100%;
      min-width: 0;
      height: 36px;
      padding: 0;
      border: 0;
      outline: 0;
      color: var(--text);
      background: transparent;
      font-size: 14px;
    }

    #material-query::placeholder {
      color: #858a91;
    }

    #material-query::-webkit-search-cancel-button {
      display: none;
    }

    .clear-query {
      width: 36px;
      height: 36px;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    .clear-query:hover,
    .clear-query:focus-visible {
      color: var(--text);
      background: var(--surface);
      outline: 0;
    }

    .clear-query[hidden] {
      display: none;
    }

    .intent-strip {
      min-height: 36px;
      padding: 7px 10px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      background: var(--surface);
      font-size: 12px;
    }

    .intent-summary {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .intent-summary strong {
      color: var(--text);
      font-weight: 600;
    }

    .result-metric {
      flex: 0 0 auto;
      color: var(--quiet);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .choice-strip {
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
      background: var(--bg);
    }

    .choice-strip[hidden] {
      display: none;
    }

    .choice-label {
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.25;
    }

    .choice-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .choice-button {
      min-height: 27px;
      padding: 3px 8px;
      border: 1px solid var(--line-strong);
      border-radius: 2px;
      background: var(--bg);
      cursor: pointer;
      font-size: 11px;
      text-align: left;
    }

    .choice-button:hover,
    .choice-button:focus-visible {
      border-color: var(--focus);
      background: var(--focus-soft);
      outline: 0;
    }

    .result-list {
      min-height: 0;
      flex: 1;
      overflow: auto;
      background: var(--bg);
    }

    .result-row {
      width: 100%;
      min-height: 58px;
      padding: 8px 10px 8px 12px;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-left: 3px solid transparent;
      background: var(--bg);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      text-align: left;
      cursor: pointer;
    }

    .result-row:hover {
      background: #f6f7f8;
    }

    .result-row[aria-selected="true"] {
      border-left-color: var(--focus);
      background: var(--surface-active);
    }

    .result-row:focus-visible {
      position: relative;
      z-index: 1;
      outline: 2px solid var(--focus);
      outline-offset: -2px;
    }

    .result-name {
      display: block;
      overflow: hidden;
      color: var(--text);
      font-size: 13px;
      font-weight: 620;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .result-context {
      display: block;
      margin-top: 3px;
      overflow: hidden;
      color: var(--muted);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .result-count {
      color: var(--quiet);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      text-align: right;
      text-transform: uppercase;
      letter-spacing: 0.035em;
      white-space: nowrap;
    }

    .pane-footer {
      min-height: 30px;
      padding: 6px 10px;
      border-top: 1px solid var(--line);
      color: var(--quiet);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 10px;
      font-variant-numeric: tabular-nums;
    }

    .key {
      padding: 0 3px;
      border: 1px solid #c7cbd0;
      border-bottom-color: #aeb3b9;
      border-radius: 2px;
      background: #fff;
      color: #555a61;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 9px;
    }

    .search-message {
      padding: 22px 18px;
      color: var(--muted);
    }

    .search-message strong {
      display: block;
      margin-bottom: 5px;
      color: var(--text);
      font-size: 14px;
    }

    .search-message p {
      max-width: 42ch;
      margin: 0;
      font-size: 12px;
    }

    .inspector {
      min-width: 0;
      overflow: auto;
      background: var(--bg);
    }

    .inspector-inner {
      width: min(100%, 980px);
      padding: 18px 22px 48px;
    }

    .record-topline {
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.075em;
      text-transform: uppercase;
    }

    .record-title {
      margin: 0;
      font-size: clamp(20px, 2.2vw, 28px);
      font-weight: 680;
      line-height: 1.15;
      letter-spacing: -0.02em;
    }

    .record-context {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .record-context code,
    .record-id {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 11px;
    }

    .record-notes {
      max-width: 76ch;
      margin: 14px 0 0;
      padding: 9px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      color: #444950;
      font-size: 12px;
    }

    .back-link {
      margin: 0 0 10px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--focus);
      cursor: pointer;
      font-size: 12px;
    }

    .back-link:hover,
    .back-link:focus-visible {
      text-decoration: underline;
      outline: 0;
    }

    .section-heading {
      margin: 24px 0 7px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: 13px;
      font-weight: 700;
    }

    .section-heading span {
      color: var(--quiet);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.045em;
    }

    .state-list,
    .property-list {
      border-top: 1px solid var(--line-strong);
    }

    .state-button {
      width: 100%;
      min-height: 48px;
      padding: 8px 2px;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: var(--bg);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
      text-align: left;
      cursor: pointer;
    }

    .state-button:hover,
    .state-button:focus-visible {
      background: var(--surface);
      outline: 0;
    }

    .state-name {
      display: block;
      font-weight: 620;
    }

    .state-meta {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
    }

    .state-arrow {
      color: var(--quiet);
    }

    .property-block {
      border-bottom: 1px solid var(--line-strong);
    }

    .property-head {
      min-height: 40px;
      padding: 8px 0 7px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
    }

    .property-head h3 {
      margin: 0;
      font-size: 12px;
      font-weight: 700;
    }

    .property-head span {
      color: var(--quiet);
      font-size: 10px;
    }

    .property-block.focus-property .property-head {
      color: var(--focus);
    }

    .observation {
      padding: 10px 0 11px;
      border-top: 1px solid var(--line);
      display: grid;
      grid-template-columns: minmax(120px, 23%) minmax(0, 1fr);
      gap: 18px;
    }

    .observation-value {
      color: var(--text);
      font-size: 17px;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      line-height: 1.25;
    }

    .observation-detail {
      min-width: 0;
      color: var(--muted);
      font-size: 11px;
    }

    .observation-detail dl {
      margin: 0;
      display: grid;
      grid-template-columns: 66px minmax(0, 1fr);
      gap: 3px 8px;
    }

    .observation-detail dt {
      color: var(--quiet);
    }

    .observation-detail dd {
      min-width: 0;
      margin: 0;
      overflow-wrap: anywhere;
    }

    .observation-detail code {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 10px;
    }

    .no-data {
      padding: 16px 0;
      border-top: 1px solid var(--line-strong);
      color: var(--muted);
      font-size: 12px;
    }

    .inspector-empty {
      max-width: 52ch;
      margin: 8vh auto 0;
      padding: 22px;
      color: var(--muted);
    }

    .inspector-empty strong {
      display: block;
      margin-bottom: 5px;
      color: var(--text);
      font-size: 15px;
    }

    @media (max-width: 820px) {
      .build-counts {
        display: none;
      }

      .workspace {
        height: auto;
        min-height: calc(100dvh - var(--header-height) - var(--warning-height));
        display: block;
        overflow: visible;
      }

      .search-pane {
        height: min(55dvh, 520px);
        min-height: 360px;
        border-right: 0;
        border-bottom: 1px solid var(--line-strong);
      }

      .inspector {
        overflow: visible;
      }

      .inspector-inner {
        padding: 16px 14px 44px;
      }
    }

    @media (max-width: 520px) {
      .app-header,
      .synthetic-warning {
        padding-left: 10px;
        padding-right: 10px;
      }

      .product-name span,
      .build-id,
      .warning-long {
        display: none;
      }

      .synthetic-warning {
        gap: 8px;
      }

      .observation {
        grid-template-columns: 1fr;
        gap: 7px;
      }

      .record-title {
        font-size: 21px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="product-name">Materials lookup <span>split inspector</span></div>
    <div class="build-meta">
      <span class="build-counts" id="header-counts">Opening fixture…</span>
      <code id="header-version">prototype 03</code>
      <span class="build-id" id="header-build"></span>
    </div>
  </header>

  <div class="synthetic-warning" role="note">
    <span><strong>Synthetic data</strong> <span class="warning-long" id="warning-text">Fabricated for interface testing only.</span></span>
    <span>Not engineering data</span>
  </div>

  <main class="workspace">
    <section class="search-pane" aria-label="Material search">
      <div class="query-area">
        <label class="sr-only" for="material-query">Find a material</label>
        <div class="query-shell">
          <span class="search-mark" aria-hidden="true">⌕</span>
          <input
            id="material-query"
            type="search"
            placeholder="Material, designation, or category"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            role="combobox"
            aria-autocomplete="list"
            aria-controls="result-list"
            aria-expanded="true"
          >
          <button class="clear-query" id="clear-query" type="button" aria-label="Clear search" hidden>×</button>
        </div>
      </div>

      <div class="intent-strip">
        <span class="intent-summary" id="intent-summary">Loading…</span>
        <span class="result-metric" id="result-metric"></span>
      </div>

      <div class="choice-strip" id="choice-strip" hidden>
        <p class="choice-label" id="choice-label"></p>
        <div class="choice-list" id="choice-list"></div>
      </div>

      <div class="result-list" id="result-list" role="listbox" aria-label="Material results"></div>

      <footer class="pane-footer">
        <span><span class="key">↑</span> <span class="key">↓</span> inspect</span>
        <span id="fixture-counts"></span>
      </footer>
    </section>

    <section class="inspector" id="inspector" aria-label="Selected material record" aria-live="polite">
      <div class="inspector-empty">
        <strong>Select a material</strong>
        The inspector shows one record at a time. Categories only narrow the result list.
      </div>
    </section>
  </main>

  <script src="./assets/synthetic-corpus.js"></script>
  <script src="./assets/search-core.js"></script>
  <script>
    (function () {
      "use strict";

      var search = window.MaterialsPrototypeSearch;
      var corpus = window.MaterialsPrototypeCorpus;
      if (!search || !corpus) {
        document.getElementById("intent-summary").textContent =
          "Prototype assets could not be loaded.";
        return;
      }

      var els = {
        input: document.getElementById("material-query"),
        clear: document.getElementById("clear-query"),
        summary: document.getElementById("intent-summary"),
        metric: document.getElementById("result-metric"),
        choiceStrip: document.getElementById("choice-strip"),
        choiceLabel: document.getElementById("choice-label"),
        choiceList: document.getElementById("choice-list"),
        results: document.getElementById("result-list"),
        inspector: document.getElementById("inspector"),
        headerCounts: document.getElementById("header-counts"),
        headerVersion: document.getElementById("header-version"),
        headerBuild: document.getElementById("header-build"),
        fixtureCounts: document.getElementById("fixture-counts"),
        warning: document.getElementById("warning-text")
      };

      var intent = null;
      var visibleResults = [];
      var activeIndex = -1;
      var selectedId = null;
      var selectedPropertyId = null;
      var selectedScopeId = null;

      initializeMetadata();
      bindEvents();
      runSearch();
      els.input.focus();

      function initializeMetadata() {
        var stats = search.stats;
        els.headerCounts.textContent =
          stats.material_count + " materials · " +
          stats.state_count + " states · " +
          stats.observation_count + " observations";
        els.headerVersion.textContent = "prototype 03 · " + corpus.corpus_version;
        els.headerBuild.textContent = corpus.build_version;
        els.fixtureCounts.textContent =
          stats.lookup_record_count + " lookup records · " +
          stats.category_count + " scopes";
        els.warning.textContent = corpus.warning.replace(
          /\s*Not engineering data\.?$/i,
          ""
        );
      }

      function bindEvents() {
        els.input.addEventListener("input", function () {
          selectedPropertyId = null;
          selectedScopeId = null;
          runSearch();
        });

        els.input.addEventListener("keydown", function (event) {
          if (event.key === "ArrowDown") {
            event.preventDefault();
            moveSelection(1, false);
          } else if (event.key === "ArrowUp") {
            event.preventDefault();
            moveSelection(-1, false);
          } else if (event.key === "Enter" && activeIndex >= 0) {
            event.preventDefault();
            renderInspector(visibleResults[activeIndex]);
          } else if (event.key === "Escape" && els.input.value) {
            event.preventDefault();
            clearQuery();
          }
        });

        els.clear.addEventListener("click", clearQuery);

        els.results.addEventListener("click", function (event) {
          var row = event.target.closest("[data-result-index]");
          if (!row) return;
          setActive(Number(row.dataset.resultIndex), false);
        });

        els.results.addEventListener("keydown", function (event) {
          if (event.key !== "ArrowDown" && event.key !== "ArrowUp") return;
          event.preventDefault();
          moveSelection(event.key === "ArrowDown" ? 1 : -1, true);
        });

        els.choiceList.addEventListener("click", function (event) {
          var propertyChoice = event.target.closest("[data-property-id]");
          if (propertyChoice) {
            selectedPropertyId = propertyChoice.dataset.propertyId;
            runSearch();
            els.input.focus();
            return;
          }

          var scopeChoice = event.target.closest("[data-scope-name]");
          if (scopeChoice) {
            selectedScopeId = scopeChoice.dataset.scopeId;
            runSearch();
            els.input.focus();
          }
        });

        els.inspector.addEventListener("click", function (event) {
          var entityButton = event.target.closest("[data-inspect-id]");
          if (!entityButton) return;
          var entity = search.getEntity(entityButton.dataset.inspectId);
          if (!entity) return;
          selectedId = entity.id;
          renderResultSelection();
          renderInspector(entity);
        });

        document.addEventListener("keydown", function (event) {
          var tag = document.activeElement && document.activeElement.tagName;
          var typing = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";
          if (
            event.key === "/" &&
            !typing &&
            !event.metaKey &&
            !event.ctrlKey &&
            !event.altKey
          ) {
            event.preventDefault();
            els.input.focus();
          }
        });
      }

      function clearQuery() {
        els.input.value = "";
        selectedPropertyId = null;
        selectedScopeId = null;
        runSearch();
        els.input.focus();
      }

      function runSearch() {
        var options = {};
        if (selectedPropertyId) options.propertyId = selectedPropertyId;
        if (selectedScopeId) options.scopeId = selectedScopeId;
        intent = search.search(els.input.value, options);
        visibleResults = resultSetForIntent(intent);
        els.clear.hidden = !els.input.value;

        var previousIndex = visibleResults.findIndex(function (entity) {
          return entity.id === selectedId;
        });
        activeIndex = previousIndex >= 0 ? previousIndex : (visibleResults.length ? 0 : -1);
        selectedId = activeIndex >= 0 ? visibleResults[activeIndex].id : null;

        renderIntent();
        renderChoices();
        renderResults();
        if (activeIndex >= 0) renderInspector(visibleResults[activeIndex]);
        else renderEmptyInspector();
      }

      function resultSetForIntent(result) {
        if (
          result.state === "needs-material" ||
          result.state === "unsupported-comparison" ||
          result.state === "choose-scope" ||
          result.state === "no-match"
        ) {
          return [];
        }
        return result.results || [];
      }

      function renderIntent() {
        var parts = [];
        if (intent.scope) {
          parts.push("<strong>Scope:</strong> " + escapeHtml(intent.scope.name));
        }
        if (intent.property_intent) {
          parts.push(
            "<strong>" +
              (intent.property_intent.kind === "group" ? "Meaning:" : "Focus:") +
              "</strong> " +
              escapeHtml(intent.property_intent.label)
          );
        }

        if (!parts.length) {
          if (intent.state === "idle") {
            parts.push("<strong>All materials</strong> · categories filter only");
          } else if (intent.state === "unsupported-comparison") {
            parts.push("<strong>Single-record lookup only</strong>");
          } else {
            parts.push("<strong>Material identity search</strong>");
          }
        }
        els.summary.innerHTML = parts.join(" · ");

        var count = intent.total || 0;
        var duration = intent.duration_ms < 1
          ? intent.duration_ms.toFixed(2)
          : intent.duration_ms.toFixed(1);
        els.metric.textContent =
          count + (count === 1 ? " match" : " matches") + " · " + duration + " ms";
      }

      function renderChoices() {
        els.choiceStrip.hidden = true;
        els.choiceList.innerHTML = "";

        if (
          intent.property_intent &&
          intent.property_intent.kind === "group" &&
          !selectedPropertyId
        ) {
          els.choiceLabel.textContent =
            "“" + intent.property_intent.label + "” can mean several properties. Choose one, or inspect a material first.";
          els.choiceList.innerHTML = intent.property_intent.ids.map(function (id) {
            var property = search.getProperty(id);
            return property
              ? '<button class="choice-button" type="button" data-property-id="' +
                  escapeAttr(id) + '">' + escapeHtml(property.name) + "</button>"
              : "";
          }).join("");
          els.choiceStrip.hidden = false;
          return;
        }

        if (intent.state === "choose-scope" && intent.scope_options.length) {
          els.choiceLabel.textContent = "That category name has more than one meaning. Choose a scope:";
          els.choiceList.innerHTML = intent.scope_options.map(function (scope) {
            return '<button class="choice-button" type="button" data-scope-name="' +
              escapeAttr(scope.name) + '" data-scope-id="' +
              escapeAttr(scope.id) + '">' +
              escapeHtml(scope.name) + " · " +
              search.getTaxonRecordCount(scope.id) + " records</button>";
          }).join("");
          els.choiceStrip.hidden = false;
        }
      }

      function renderResults() {
        if (!visibleResults.length) {
          els.results.removeAttribute("role");
          els.input.removeAttribute("aria-activedescendant");
          els.results.innerHTML = emptySearchMessage();
          return;
        }

        els.results.setAttribute("role", "listbox");
        els.results.innerHTML = visibleResults.map(function (entity, index) {
          var observationText;
          if (entity.kind === "material" && entity.state_count) {
            observationText =
              entity.state_count + (entity.state_count === 1 ? " state" : " states");
          } else {
            observationText =
              entity.observation_count +
              (entity.observation_count === 1 ? " obs" : " obs");
          }
          return (
            '<button class="result-row" id="result-' + index +
            '" type="button" role="option" aria-selected="' +
            String(index === activeIndex) +
            '" tabindex="' + (index === activeIndex ? "0" : "-1") +
            '" data-result-index="' + index + '">' +
              "<span>" +
                '<span class="result-name">' + escapeHtml(entity.name) + "</span>" +
                '<span class="result-context">' +
                  escapeHtml(search.entityContext(entity)) + "</span>" +
              "</span>" +
              '<span class="result-count">' + escapeHtml(observationText) + "</span>" +
            "</button>"
          );
        }).join("");
        updateActiveDescendant();
      }

      function emptySearchMessage() {
        var title = "No material matched";
        var text = "Try a complete grade, product code, state, or broader category.";

        if (intent.state === "needs-material") {
          title = "Add a material";
          text =
            "A property alone does not produce a cross-material ranking. Try a query such as “AX60 tensile strength”.";
        } else if (intent.state === "unsupported-comparison") {
          title = "Comparison is outside this tool";
          text =
            "Look up one material by name or designation. This prototype never ranks materials by a property value.";
        } else if (intent.state === "choose-scope") {
          title = "Choose a category scope";
          text = "Categories narrow material identities; they are not material records.";
        }

        return '<div class="search-message"><strong>' + escapeHtml(title) +
          "</strong><p>" + escapeHtml(text) + "</p></div>";
      }

      function moveSelection(delta, focusRow) {
        if (!visibleResults.length) return;
        var next = activeIndex < 0
          ? 0
          : (activeIndex + delta + visibleResults.length) % visibleResults.length;
        setActive(next, focusRow);
      }

      function setActive(index, focusRow) {
        if (!Number.isFinite(index) || index < 0 || index >= visibleResults.length) return;
        activeIndex = index;
        selectedId = visibleResults[index].id;
        renderResultSelection();
        renderInspector(visibleResults[index]);

        var row = document.getElementById("result-" + index);
        if (row) {
          row.scrollIntoView({ block: "nearest" });
          if (focusRow) row.focus();
        }
      }

      function renderResultSelection() {
        els.results.querySelectorAll("[data-result-index]").forEach(function (row) {
          var selected = Number(row.dataset.resultIndex) === activeIndex;
          row.setAttribute("aria-selected", String(Boolean(selected)));
          row.tabIndex = selected ? 0 : -1;
        });
        updateActiveDescendant();
      }

      function updateActiveDescendant() {
        if (activeIndex >= 0 && visibleResults[activeIndex]) {
          els.input.setAttribute("aria-activedescendant", "result-" + activeIndex);
        } else {
          els.input.removeAttribute("aria-activedescendant");
        }
      }

      function renderEmptyInspector() {
        var title = "Select a material";
        var text =
          "The inspector shows one record at a time. Categories only narrow the result list.";
        if (intent && intent.state === "needs-material") {
          title = "A material is still needed";
          text =
            "Property words set the section to inspect after a material has been identified.";
        } else if (intent && intent.state === "unsupported-comparison") {
          title = "No comparison view";
          text =
            "This direction deliberately avoids aligned values, winner labels, and property-ranked material lists.";
        }
        els.inspector.innerHTML =
          '<div class="inspector-empty"><strong>' + escapeHtml(title) +
          "</strong>" + escapeHtml(text) + "</div>";
      }

      function renderInspector(entity) {
        if (!entity) {
          renderEmptyInspector();
          return;
        }

        selectedId = entity.id;
        var parent = entity.kind === "state"
          ? search.getEntity(entity.material_id)
          : null;
        var material = search.getMaterial(entity.material_id);
        var taxonNames = (entity.taxon_names || []).join(" · ");
        var kindLabel = entity.kind === "state"
          ? "Named material state"
          : entity.has_direct_data
            ? "Data-bearing material"
            : "Material identity";

        var html = '<div class="inspector-inner">';
        if (parent) {
          html += '<button class="back-link" type="button" data-inspect-id="' +
            escapeAttr(parent.id) + '">← ' + escapeHtml(parent.name) + "</button>";
        }
        html +=
          '<p class="record-topline">' + escapeHtml(kindLabel) + "</p>" +
          '<h1 class="record-title">' + escapeHtml(entity.name) + "</h1>" +
          '<p class="record-context">' +
            (taxonNames ? escapeHtml(taxonNames) + " · " : "") +
            '<code class="record-id">' + escapeHtml(entity.id) + "</code>" +
          "</p>";

        var notes = entity.notes || (material && material.notes) || "";
        if (notes) {
          html += '<p class="record-notes">' + escapeHtml(notes) + "</p>";
        }

        if (entity.kind === "material" && entity.state_count) {
          html += renderStates(entity);
        }

        var observations = search.getObservations(entity);
        if (observations.length) {
          html += renderObservations(observations);
        } else if (!entity.state_count) {
          html +=
            '<div class="section-heading"><h2>Observations</h2><span>0 recorded</span></div>' +
            '<div class="no-data">This material identity has no direct observations in the fixture.</div>';
        }

        html += "</div>";
        els.inspector.innerHTML = html;
      }

      function renderStates(entity) {
        var states = search.getStateChildren(entity);
        return (
          '<div class="section-heading"><h2>Choose a material state</h2><span>' +
            states.length + (states.length === 1 ? " state" : " states") +
          "</span></div>" +
          '<div class="state-list">' +
            states.map(function (state) {
              var fixed = state.fixed_conditions || {};
              var conditionText = Object.keys(fixed).map(function (key) {
                return String(fixed[key]).replace(/_/g, " ");
              }).join(" · ");
              return (
                '<button class="state-button" type="button" data-inspect-id="' +
                  escapeAttr(state.id) + '">' +
                  "<span>" +
                    '<span class="state-name">' + escapeHtml(state.label) + "</span>" +
                    '<span class="state-meta">' +
                      escapeHtml(
                        (conditionText ? conditionText + " · " : "") +
                        state.observation_count + " observations"
                      ) +
                    "</span>" +
                  "</span>" +
                  '<span class="state-arrow" aria-hidden="true">→</span>' +
                "</button>"
              );
            }).join("") +
          "</div>"
        );
      }

      function renderObservations(observations) {
        var groups = new Map();
        observations.forEach(function (observation) {
          if (!groups.has(observation.property_id)) {
            groups.set(observation.property_id, []);
          }
          groups.get(observation.property_id).push(observation);
        });

        var propertyIds = Array.from(groups.keys()).sort(function (a, b) {
          var focusedPropertyId = selectedPropertyId ||
            (
              intent &&
              intent.property_intent &&
              intent.property_intent.kind === "property"
                ? intent.property_intent.id
                : null
            );
          if (a === focusedPropertyId) return -1;
          if (b === focusedPropertyId) return 1;
          var propertyA = search.getProperty(a);
          var propertyB = search.getProperty(b);
          return (propertyA ? propertyA.name : a).localeCompare(
            propertyB ? propertyB.name : b
          );
        });

        return (
          '<div class="section-heading"><h2>Observations for this record</h2><span>' +
            observations.length + (observations.length === 1 ? " observation" : " observations") +
          "</span></div>" +
          '<div class="property-list">' +
            propertyIds.map(function (propertyId) {
              var property = search.getProperty(propertyId);
              var items = groups.get(propertyId);
              var focused =
                selectedPropertyId === propertyId ||
                (
                  !selectedPropertyId &&
                  intent &&
                  intent.property_intent &&
                  intent.property_intent.kind === "property" &&
                  intent.property_intent.id === propertyId
                );
              return (
                '<section class="property-block' +
                  (focused ? " focus-property" : "") + '">' +
                  '<div class="property-head"><h3>' +
                    escapeHtml(property ? property.name : propertyId) +
                  "</h3><span>" +
                    items.length + (items.length === 1 ? " value" : " conditioned values") +
                  "</span></div>" +
                  items.map(renderObservation).join("") +
                "</section>"
              );
            }).join("") +
          "</div>"
        );
      }

      function renderObservation(observation) {
        return (
          '<div class="observation">' +
            '<div class="observation-value">' +
              escapeHtml(search.formatObservation(observation)) +
            "</div>" +
            '<div class="observation-detail"><dl>' +
              "<dt>Conditions</dt><dd>" +
                escapeHtml(search.conditionSummary(observation)) + "</dd>" +
              "<dt>Basis</dt><dd>" +
                escapeHtml(String(observation.basis).replace(/_/g, " ")) + "</dd>" +
              "<dt>Source</dt><dd><code>" +
                escapeHtml(observation.source_id) + "</code></dd>" +
              "<dt>Locator</dt><dd>" +
                escapeHtml(observation.source_locator) + "</dd>" +
            "</dl></div>" +
          "</div>"
        );
      }

      function escapeHtml(value) {
        return String(value == null ? "" : value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function escapeAttr(value) {
        return escapeHtml(value).replace(/`/g, "&#96;");
      }
    })();
  </script>
</body>
</html>

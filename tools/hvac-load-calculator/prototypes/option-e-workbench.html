<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex">
<script>window.MathJax = {tex: {inlineMath: [["\\(", "\\)"]]}, startup: {typeset: false}};</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>
<link rel="stylesheet" href="proto.css"><link rel="stylesheet" href="v2/drawing.css"><link rel="stylesheet" href="v2/app.css">
<title>Option E: Workbench</title></head>
<body>
<main class="wrap">
  <h1 class="ptitle">Model workbench</h1>
  <p class="plede" style="margin-bottom:12px">The same model with no fixed order. Every part starts as an assumption, with up to three levels of detail. Bars show how much each unknown could move the answer, so the work goes where it pays.</p>
  <div class="bench">
    <aside><section class="panel"><h3>Parts of the model</h3><div id="tree"></div></section></aside>
    <div>
      <div class="model-error" id="model-error" role="alert" hidden></div>
      <section class="panel" id="sheet-panel"></section>
      <section class="panel"><div class="dock-tabs" role="tablist"><button type="button" data-dock="math" class="on" role="tab">Math</button><button type="button" data-dock="study" role="tab">Sensitivity study</button></div><div id="drill"></div><div id="study" hidden></div></section>
    </div>
    <div class="results-col">
      <section class="panel"><div id="strip" class="strip" style="grid-template-columns:minmax(0,1fr)"></div></section>
      <section class="panel" id="inspector"></section>
      <section class="panel"><h3>Equipment</h3><div id="system"></div><div id="fit" style="margin-top:8px"></div></section>
    </div>
  </div>
</main>
<script src="proto-shared.js"></script><script src="v2/model.js"></script><script src="v2/drawing.js"></script><script src="v2/core.js"></script><script src="v2/shared-ui.js"></script><script src="v2/study.js"></script>
<script>
(async function () {
  const P = Proto; const C = Core; const U = SharedUI;
  const $ = (id) => document.getElementById(id);
  const fmt = C.fmt; const esc = C.esc;
  P.nav('option-e');
  await C.start();
  let active = 'shape';
  const ORDER = ['site', 'shape', 'walls', 'ceiling', 'floor', 'openings', 'air', 'ducts', 'rooms'];
  const TOOL = { shape: 'shell', openings: 'openings', rooms: 'rooms' };
  const TERMS = { air: ['ach50'], walls: ['wall_u'], ceiling: ['ceiling_u'], openings: ['window_pct_of_floor', 'window_u', 'window_shgc'], ducts: ['duct_leakage_pct', 'duct_r'], rooms: ['occupants'], site: ['heating_design_f', 'cooling_design_f'] };
  const DETAIL_HINT = { site: 'ZIP, then station, then your own design values', shape: 'Area, then drawn size, then height and stories', walls: 'Era, then type, then layers', ceiling: 'Era, then level, then attic details', floor: 'Era, then type, then edge details', openings: 'A percent, then drawn, then rated products', air: 'Era, then your guess, then a blower door', ducts: 'Era, then location, then tested leakage', rooms: 'One space, then rooms, then named rooms' };
  $('sheet-panel').innerHTML = C.sheetHtml();
  C.bindDrawing();
  C.bindInspector($('inspector'));
  const drill = P.Drill($('drill'));
  C.drillPanel = drill;
  Study.bind($('study'));
  const drawSystem = P.buildSystem($('system'), () => { C.confirm('system'); C.update(); });

  function lod(id) {
    const f = P.state.fields; const m = C.model;
    let n = C.confirmed.has(id) ? 1 : 0;
    if (id === 'site' && (f.heating_design_f !== undefined)) n = 2;
    if (id === 'site' && P.state.zip) n = Math.max(n, 1);
    if (id === 'shape' && C.eraConfirmed) n = Math.max(n, 2);
    if (id === 'walls' && f.layer_u) n = 2;
    if (id === 'air' && f.air_measured) n = 2;
    if (id === 'ducts' && f.duct_leakage_pct !== undefined) n = 2;
    if (id === 'openings' && (f.window_u !== undefined || f.window_shgc !== undefined)) n = 2;
    if (id === 'rooms') { const count = m.levels.reduce((a, l) => a + l.rooms.length, 0); n = count > m.stories ? (m.levels.some((l) => l.rooms.some((r) => r.type !== 'other')) ? 2 : 1) : 0; }
    return n;
  }
  function tree() {
    const band = C.band; const terms = (band && band.terms) || [];
    const sw = (ids) => terms.filter((t) => ids.includes(t.key)).reduce((a, t) => a + Math.max(t.heat_high - t.heat_low, t.cool_high - t.cool_low), 0);
    const values = {}; ORDER.forEach((id) => { values[id] = TERMS[id] ? sw(TERMS[id].filter((k) => !terms.find((t) => t.key === k && t.known))) : 0; });
    const max = Math.max(...Object.values(values), 1);
    const top = Object.entries(values).sort((a, b) => b[1] - a[1])[0];
    $('tree').innerHTML = ORDER.map((id) => {
      const n = lod(id);
      const dots = `<span class="lod" role="img" aria-label="Detail level ${n + 1} of 3">${[0, 1, 2].map((i) => `<i class="${i <= n ? 'f' : ''}"></i>`).join('')}</span>`;
      const bar = !C.eraConfirmed && id !== 'shape' ? '' : (TERMS[id] ? `<span class="unk"><span class="track"><b style="width:${values[id] / max * 100}%"></b></span><span>${values[id] > 1 ? `±${fmt(values[id] / 2)}` : 'settled'}${top && top[0] === id && values[id] > 1 ? ' <span class="biggest">biggest</span>' : ''}</span></span>` : '');
      return `<button type="button" class="tree-row ${id === active ? 'on' : ''}" data-el="${id}"><span class="name">${esc(C.ELEMENTS[id].title)}</span>${dots}${bar}</button>`;
    }).join('') + (C.eraConfirmed ? '' : '<p class="note" style="margin-top:8px">Set when the house was built, under Size and shape. That is the biggest unknown until you do.</p>');
  }
  function inspector() {
    $('inspector').innerHTML = `<h3>${esc(C.ELEMENTS[active].title)}</h3><p class="note" style="margin:0 0 8px">Levels of detail: ${esc(DETAIL_HINT[active])}</p>${C.elementHtml(active)}${C.confirmed.has(active) ? '' : '<button type="button" class="btn" data-confirm-el style="margin-top:6px">This assumption is right</button>'}`;
  }
  function fit() { $('fit').innerHTML = U.fitChart(); }
  function refresh(light) {
    C.applyLayout(); C.draw(); $('strip').innerHTML = U.readouts();
    tree();
    if (!light) { const focus = document.activeElement && document.activeElement.id; inspector(); if (focus && $(focus)) $(focus).focus(); drawSystem(C.result); fit(); drill.draw(); }
  }
  C.onChange(({ light, bandOnly, math } = {}) => {
    if (math) { document.querySelector('[data-dock="math"]').click(); return; }
    if (bandOnly) { $('strip').innerHTML = U.readouts(); tree(); fit(); return; }
    refresh(light);
  });
  document.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.el) { active = b.dataset.el; C.view.tool = TOOL[active] || 'select'; C.view.splitting = false; if (active === 'rooms') C.view.overlay = true; const box = $('dwg-overlay'); if (box) box.checked = C.view.overlay; refresh(); }
    if (b.dataset.confirmEl !== undefined) { C.confirm(active); C.update(); }
    if (b.dataset.dock) {
      document.querySelectorAll('[data-dock]').forEach((x) => x.classList.toggle('on', x === b));
      $('drill').hidden = b.dataset.dock !== 'math'; $('study').hidden = b.dataset.dock !== 'study';
      if (b.dataset.dock === 'study') { $('study').innerHTML = '<p class="note">Running the sweeps...</p>'; setTimeout(() => Study.render($('study')), 30); }
    }
  });
  P.onTheme = () => refresh();
  C.view.tool = TOOL[active];
  C.computeBand();
  refresh();
  document.getElementById('p-loading').classList.add('done');
})();
</script></body></html>
